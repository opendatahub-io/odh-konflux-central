apiVersion: tekton.dev/v1
kind: PipelineRun
#
# Cross-repo trigger: a push to odh-model-controller/main rebuilds the
# kserve-module operator image from opendatahub-io/kserve release-v0.17.
#
# This template is evaluated on odh-model-controller webhook events, so all
# Pipelines-as-Code template variables ({{revision}}, {{source_url}},
# {{target_branch}}) resolve to ODH Model Controller values. The KServe
# build inputs are therefore hardcoded below.
#
metadata:
  annotations:
    # {{revision}} here is the ODH-MC commit that triggered the rebuild, NOT
    # the KServe revision the image is built from. The KServe revision is
    # the release-v0.17 branch head at build time and is not templatable
    # from this event.
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/odh-model-controller?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    # Non-standard annotation recording the actual build source.
    odh.opendatahub.io/build-repository: https://github.com/opendatahub-io/kserve
    odh.opendatahub.io/build-revision: release-v0.17
    odh.opendatahub.io/trigger-revision: '{{revision}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch
      == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: opendatahub-builds
    appstudio.openshift.io/component: odh-kserve-module-operator-ci
    odh.opendatahub.io/cross-repo-trigger: "true"
  name: odh-kserve-module-operator-on-odh-mc-push
  namespace: open-data-hub-tenant
spec:
  params:
  - name: git-url
    value: https://github.com/opendatahub-io/kserve
  - name: revision
    value: release-v0.17
  # Tag derived from the triggering ODH-MC commit. Must never collide with
  # the KServe commit-sha tags published by the regular push pipeline.
  - name: output-image
    value: quay.io/opendatahub/odh-kserve-module-operator:omc-{{revision}}
  - name: dockerfile
    value: kserve-module-controller.Dockerfile
  - name: path-context
    value: .
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunSpecs:
    - pipelineTaskName: sast-shell-check
      computeResources:
        requests:
          cpu: '2'
          memory: 16Gi
        limits:
          cpu: '2'
          memory: 16Gi
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-kserve-module-operator-ci
  workspaces:
  - name: git-auth
    secret:
      # The git-auth secret generated for the odh-model-controller webhook
      # repository. It is NOT a credential for opendatahub-io/kserve; the
      # clone succeeds only because kserve is public. If kserve ever goes
      # private this breaks.
      secretName: '{{ git_auth_secret }}'
status: {}

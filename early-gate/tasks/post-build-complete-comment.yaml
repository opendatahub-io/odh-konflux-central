---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: post-build-complete-comment
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: |
    Posts an "Early Gate Build - Complete" comment on the PR with the
    FBC image reference (repo:unique-tag@digest).
  params:
  - name: catalog-image-url
    description: Catalog image URL from the build task (repo:tag)
    type: string
  - name: catalog-image-digest
    description: Catalog image digest from the build task
    type: string
  - name: unique-tag
    description: Unique tag to use in the FBC image reference
    type: string
  - name: pr-token-secret-name
    description: Name of the Kubernetes secret containing the GitHub token for PR comment operations
    type: string
    default: odh-github-secret
  - name: pr-token-secret-key
    description: Key in the secret that holds the GitHub token for PR comment operations
    type: string
    default: commenter-token
  results:
  - name: fbc-image
    description: Fully qualified FBC image reference with digest
  steps:
  - name: post-comment
    image: quay.io/konflux-ci/konflux-test:stable
    env:
    - name: PR_NUMBER
      valueFrom:
        fieldRef:
          fieldPath: metadata.labels['pipelinesascode.tekton.dev/pull-request']
    - name: REPO_URL
      valueFrom:
        fieldRef:
          fieldPath: metadata.annotations['pipelinesascode.tekton.dev/url-repository']
    - name: REPO_ORG
      valueFrom:
        fieldRef:
          fieldPath: metadata.annotations['pipelinesascode.tekton.dev/url-org']
    - name: PR_GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: $(params.pr-token-secret-name)
          key: $(params.pr-token-secret-key)
    - name: CATALOG_IMAGE_URL
      value: $(params.catalog-image-url)
    - name: CATALOG_IMAGE_DIGEST
      value: $(params.catalog-image-digest)
    - name: UNIQUE_TAG
      value: $(params.unique-tag)
    script: |
      #!/bin/bash
      set -euo pipefail

      OWNER="${REPO_ORG}"
      REPO="${REPO_URL}"

      CATALOG_REPO="${CATALOG_IMAGE_URL%%:*}"
      FBC_IMAGE="${CATALOG_REPO}:${UNIQUE_TAG}@${CATALOG_IMAGE_DIGEST}"
      echo "FBC_IMAGE: ${FBC_IMAGE}"
      printf '%s' "${FBC_IMAGE}" > "$(results.fbc-image.path)"

      COMMENT_BODY=$(printf '<!-- early-gate-build-complete -->\n:white_check_mark: **Early Gate Build - Complete**\n\n| Field | Value |\n|-------|-------|\n| **Status** | :white_check_mark: SUCCESS |\n| **FBC Image** | %s |' \
        "${FBC_IMAGE}")

      curl -sSf \
        -X POST \
        -H "Authorization: Bearer ${PR_GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/${OWNER}/${REPO}/issues/${PR_NUMBER}/comments" \
        -d "{\"body\":$(echo "${COMMENT_BODY}" | jq -Rs .)}" \
        2>/dev/null || echo "WARNING: Failed to post PR comment (non-fatal)"

      echo "Posted build-complete comment on PR #${PR_NUMBER}"

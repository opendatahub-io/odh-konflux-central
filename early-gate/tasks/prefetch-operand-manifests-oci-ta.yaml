---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prefetch-operand-manifests-oci-ta
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: image-build, konflux
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: |-
    Task that prefetches all the deployment manifests for all the operands of the ODH/RHODS operator.
    Tekton equivalent of the existing operator-processor GitHub workflow.
    Supports SNAPSHOT-based overrides: for components present in the SNAPSHOT, their image URIs
    and git commits replace the ones resolved via buildVersionTag.
  params:
  - name: SOURCE_ARTIFACT
    description: The Trusted Artifact URI pointing to the artifact with the application source code.
    type: string
  - name: caTrustConfigMapKey
    description: The name of the key in the ConfigMap that contains the CA bundle data.
    type: string
    default: ca-bundle.crt
  - name: caTrustConfigMapName
    description: The name of the ConfigMap to read CA bundle data from.
    type: string
    default: trusted-ca
  - name: ociArtifactExpiresAfter
    description: Expiration date for the trusted artifacts created in the OCI repository.
    type: string
    default: "1d"
  - name: ociStorage
    description: The OCI repository where the Trusted Artifacts are stored.
    type: string
  - name: utilsRepoUrl
    description: Git URL of the RHOAI-Konflux-Automation repo
    type: string
    default: "https://github.com/red-hat-data-services/RHOAI-Konflux-Automation.git"
  - name: utilsRepoBranch
    description: Git branch of the RHOAI-Konflux-Automation repo
    type: string
    default: "main"
  - name: buildConfigRepoUrl
    description: Git URL of the Build-Config repo
    type: string
    default: "https://github.com/opendatahub-io/ODH-Build-Config.git"
  - name: buildConfigRepoBranch
    description: Git branch of the Build-Config repo
    type: string
    default: "main"
  - name: buildVersionTag
    description: Image tag of operand images to be sought by operator-processor
    type: string
    default: "latest"
  - name: SNAPSHOT_ARTIFACT
    description: |
      OCI trusted artifact URI from generate-snapshot containing snapshot.json.
      Mounted at /var/workdir/snapshot/snapshot.json. Empty string means no overrides.
    type: string
    default: ""
  - name: operatorComponentName
    description: |
      Operator component name to use for finding the push pipeline YAML file.
      If empty, uses the PipelineRun's appstudio.openshift.io/component label.
    type: string
    default: ""
  results:
  - name: CACHI2_ARTIFACT
    description: The Trusted Artifact URI pointing to the artifact with the prefetched dependencies.
    type: string
  - name: SOURCE_ARTIFACT
    description: The Trusted Artifact URI pointing to the artifact with the application source code.
    type: string
  volumes:
  - name: config
    emptyDir: {}
  - name: trusted-ca
    configMap:
      items:
      - key: $(params.caTrustConfigMapKey)
        path: ca-bundle.crt
      name: $(params.caTrustConfigMapName)
      optional: true
  - name: workdir
    emptyDir: {}
  workspaces:
  - name: git-basic-auth
    description: |
      A Workspace containing a .gitconfig and .git-credentials file or username and password.
    optional: true
  - name: netrc
    description: |
      Workspace containing a .netrc file. Cachi2 will use the credentials in this file when
      performing http(s) requests.
    optional: true
  stepTemplate:
    env:
    - name: UTILS_REPO_URL
      value: $(params.utilsRepoUrl)
    - name: UTILS_REPO_BRANCH
      value: $(params.utilsRepoBranch)
    - name: BUILD_CONFIG_REPO_URL
      value: $(params.buildConfigRepoUrl)
    - name: BUILD_CONFIG_REPO_BRANCH
      value: $(params.buildConfigRepoBranch)
    - name: RHOAI_QUAY_API_TOKEN
      value: ""
    - name: OPENDATAHUB_QUAY_API_TOKEN
      value: ""
    - name: BUILD_VERSION_TAG
      value: $(params.buildVersionTag)
    - name: SNAPSHOT_ARTIFACT
      value: $(params.SNAPSHOT_ARTIFACT)
    volumeMounts:
    - mountPath: /mnt/config
      name: config
    - mountPath: /var/workdir
      name: workdir
  steps:
  - name: use-trusted-artifact
    image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:81c4864dae6bb11595f657be887e205262e70086a05ed16ada827fd6391926ac
    args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source
    - $(params.SNAPSHOT_ARTIFACT)=/var/workdir/snapshot
  - name: prefetch-manifests
    image: quay.io/rhoai/rhoai-task-toolset:latest
    volumeMounts:
    - mountPath: /mnt/trusted-ca
      name: trusted-ca
      readOnly: true
    env:
    - name: WORKSPACE_GIT_AUTH_BOUND
      value: $(workspaces.git-basic-auth.bound)
    - name: WORKSPACE_GIT_AUTH_PATH
      value: $(workspaces.git-basic-auth.path)
    - name: WORKSPACE_NETRC_BOUND
      value: $(workspaces.netrc.bound)
    - name: WORKSPACE_NETRC_PATH
      value: $(workspaces.netrc.path)
    - name: ODH_OPERATOR_COMPONENT_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.labels['appstudio.openshift.io/component']
    - name: OPERATOR_COMPONENT_NAME_PARAM
      value: $(params.operatorComponentName)
    workingDir: /var/workdir
    script: |
      # Override component name if parameter is provided
      if [ -n "${OPERATOR_COMPONENT_NAME_PARAM}" ]; then
        ODH_OPERATOR_COMPONENT_NAME="${OPERATOR_COMPONENT_NAME_PARAM}"
        echo "Using operator component name from parameter: ${ODH_OPERATOR_COMPONENT_NAME}"
      else
        echo "Using operator component name from label: ${ODH_OPERATOR_COMPONENT_NAME}"
      fi

      # Install dependencies
      os="$(uname -s | tr '[:upper:]' '[:lower:]')"
      arch="$(uname -m | sed 's/x86_64/amd64/')"
      yq_version="v4.44.3"
      yq_filename="yq-$yq_version"
      echo "-> Downloading yq" >&2
      curl -sSfLo "$yq_filename" "https://github.com/mikefarah/yq/releases/download/$yq_version/yq_${os}_${arch}"
      chmod +x $yq_filename
      ln -s $yq_filename yq
      cp $yq_filename /usr/local/bin/yq

      mkdir -p playpen
      git clone ${UTILS_REPO_URL} --branch ${UTILS_REPO_BRANCH} utils
      ls utils

      git clone ${BUILD_CONFIG_REPO_URL} --branch ${BUILD_CONFIG_REPO_BRANCH} RBC
      ls RBC

      pip install --default-timeout=100 -r utils/utils/operator-processor/requirements.txt

      echo "ODH_OPERATOR_COMPONENT_NAME = ${ODH_OPERATOR_COMPONENT_NAME}"
      PATCH_YAML_PATH=RBC/bundle/bundle-patch.yaml
      OPERANDS_MAP_PATH=source/build/operands-map.yaml
      MANIFEST_CONFIG_PATH=source/build/manifests-config.yaml
      PUSH_PIPELINE_PATH=source/.tekton/${ODH_OPERATOR_COMPONENT_NAME}-push.yaml

      python3 utils/utils/operator-processor/operator-processor.py -op process-operator-yamls --patch-yaml-path ${PATCH_YAML_PATH} --operands-map-path ${OPERANDS_MAP_PATH} --manifest-config-path ${MANIFEST_CONFIG_PATH} --rhoai-version ${BUILD_VERSION_TAG} --push-pipeline-yaml-path ${PUSH_PIPELINE_PATH} --push-pipeline-operation enable

      echo "----- OPERANDS_MAP ------"
      cat $OPERANDS_MAP_PATH
      echo "----- MANIFEST_CONFIG ------"
      cat $MANIFEST_CONFIG_PATH
      echo "current dir = $(pwd)"

      # =====================================================================
      # SNAPSHOT OVERRIDES
      # For components present in the SNAPSHOT, replace their image URIs in
      # operands-map.yaml and update git.commit in manifests-config.yaml.
      # Components NOT in the SNAPSHOT keep the buildVersionTag-resolved values.
      # =====================================================================
      SNAPSHOT_FILE=/var/workdir/snapshot/snapshot.json
      if [ -f "${SNAPSHOT_FILE}" ]; then
        echo ""
        echo "*************** Applying SNAPSHOT overrides ***************"
        cp "${SNAPSHOT_FILE}" /tmp/snapshot_input.json

        cat > /tmp/apply_snapshot_overrides.py << 'PYEOF'
      import argparse
      import json
      import sys
      from ruamel.yaml import YAML

      yaml_handler = YAML()
      yaml_handler.preserve_quotes = True

      def parse_image_repo(image_ref):
          if "@" in image_ref:
              return image_ref.split("@")[0]
          if ":" in image_ref:
              parts = image_ref.rsplit(":", 1)
              return image_ref if "/" in parts[1] else parts[0]
          return image_ref

      def main():
          parser = argparse.ArgumentParser()
          parser.add_argument("--snapshot-file", required=True)
          parser.add_argument("--operands-map", required=True)
          parser.add_argument("--manifests-config", default="")
          args = parser.parse_args()

          with open(args.snapshot_file) as f:
              snapshot = json.load(f)

          repo_to_image = {}
          git_url_to_info = {}
          for comp_name, comp_data in snapshot.items():
              if not isinstance(comp_data, dict) or "image" not in comp_data:
                  continue
              image = comp_data["image"]
              repo_to_image[parse_image_repo(image)] = image
              git_url = comp_data.get("git.url", "")
              git_commit = comp_data.get("git.commit", "")
              if git_url and git_commit:
                  git_url_to_info[git_url] = {"commit": git_commit, "component": comp_name}

          if not repo_to_image:
              print("No image entries in SNAPSHOT, skipping overrides.")
              return

          with open(args.operands_map) as f:
              operands_map_data = yaml_handler.load(f)
          count = 0
          operands_map = operands_map_data.get("relatedImages", []) if operands_map_data else []
          if operands_map:
              for entry in operands_map:
                  value = str(entry.get("value", ""))
                  entry_repo = parse_image_repo(value)
                  if entry_repo in repo_to_image:
                      print(f"SNAPSHOT OVERRIDE {entry.get('name', '?')}: {value} -> {repo_to_image[entry_repo]}")
                      entry["value"] = repo_to_image[entry_repo]
                      count += 1
          with open(args.operands_map, "w") as f:
              yaml_handler.dump(operands_map_data, f)
          print(f"Applied {count} SNAPSHOT override(s) to operands-map.yaml")

          if args.manifests_config and git_url_to_info:
              with open(args.manifests_config) as f:
                  mc = yaml_handler.load(f)
              mc_count = 0
              if mc and "map" in mc:
                  for comp_key in mc["map"]:
                      comp_val = mc["map"][comp_key]
                      git_url = str(comp_val.get("git.url", ""))
                      if git_url in git_url_to_info:
                          old = comp_val.get("git.commit", "")
                          new = git_url_to_info[git_url]["commit"]
                          print(f"SNAPSHOT OVERRIDE manifests-config[{comp_key}]: git.commit {old} -> {new}")
                          comp_val["git.commit"] = new
                          if comp_val.get("ref_type") == "branch":
                              comp_val["ref_type"] = "commit"
                          mc_count += 1
              with open(args.manifests_config, "w") as f:
                  yaml_handler.dump(mc, f)
              print(f"Applied {mc_count} SNAPSHOT override(s) to manifests-config.yaml")

      if __name__ == "__main__":
          main()
      PYEOF

        python3 /tmp/apply_snapshot_overrides.py \
          --snapshot-file /tmp/snapshot_input.json \
          --operands-map "${OPERANDS_MAP_PATH}" \
          --manifests-config "${MANIFEST_CONFIG_PATH}"

        echo "----- OPERANDS_MAP (after SNAPSHOT overrides) ------"
        cat $OPERANDS_MAP_PATH
        echo "----- MANIFEST_CONFIG (after SNAPSHOT overrides) ------"
        cat $MANIFEST_CONFIG_PATH
      else
        echo "No SNAPSHOT artifact found at ${SNAPSHOT_FILE}, using buildVersionTag-resolved images for all components."
      fi

      # Fetch every component listed in a manifests-config.yaml/charts-config.yaml
      # "map" into its own sparse git checkout, then copy $src into $dest under
      # $default_dest_base (or $chart_dest_base when the entry's "type" is
      # "chart" and $chart_dest_base is non-empty). Shared by both the
      # manifests and charts prefetch phases below so a fix here (for example
      # the dest containment check) never has to be duplicated or drift.
      fetch_and_copy_entries() {
        local config_path="$1"
        local work_dir="$2"
        local default_dest_base="$3"
        local chart_dest_base="$4"
        local value component git_url git_commit ref_type branch
        local src dest entry_type dest_base dest_dir_path

        mkdir -p "$work_dir"
        cd "$work_dir"

        while IFS= read -r value; do
          value=${value/- /}
          component=$value
          [[ -z "$component" ]] && continue

          echo "=============================================================="
          echo "Fetching entry for component: $component"
          echo "=============================================================="

          git_url=$(value="$value" yq '.map[strenv(value)]["git.url"]' "${config_path}")
          git_commit=$(value="$value" yq '.map[strenv(value)]["git.commit"]' "${config_path}")
          ref_type=$(value="$value" yq '.map[strenv(value)]["ref_type"]' "${config_path}")
          branch=$(value="$value" yq '.map[strenv(value)]["branch"]' "${config_path}")

          if [[ "$ref_type" == "branch" ]]; then
            git_commit=$(git ls-remote "$git_url" "refs/heads/$branch" | awk '{print $1}')
            if [[ -z "$git_commit" ]]; then
              echo "ERROR: could not resolve branch '$branch' for $git_url (component: $component)" >&2
              exit 1
            fi
            echo "Resolved git.commit for branch '$branch' to commit SHA $git_commit"
            value="$value" git_commit="$git_commit" yq -i eval '.map[strenv(value)]["git.commit"] = strenv(git_commit)' "${config_path}"
          fi

          if [[ -z "$git_commit" ]]; then
            echo "ERROR: no git.commit resolved for component '$component'" >&2
            exit 1
          fi

          src=$(value="$value" yq '.map[strenv(value)]["src"]' "${config_path}")
          dest=$(value="$value" yq '.map[strenv(value)]["dest"]' "${config_path}")
          entry_type=$(value="$value" yq '.map[strenv(value)]["type"] // "manifest"' "${config_path}")

          # Route type: chart entries to prefetched-charts (opendatahub-operator#3763 /
          # rhoai-konflux-tasks#273). Entries without a type default to "manifest".
          dest_base="$default_dest_base"
          if [[ -n "$chart_dest_base" && "$entry_type" == "chart" ]]; then
            dest_base="$chart_dest_base"
          fi

          # Reject dest values that would escape dest_base (for example "../../etc").
          case "$dest" in
            *..*)
              echo "ERROR: dest '$dest' for component '$component' contains '..' and is rejected" >&2
              exit 1
              ;;
          esac

          echo "component = $component"
          echo "git_url = $git_url"
          echo "git_commit = $git_commit"
          echo "src = $src"
          echo "dest = $dest"
          echo "type = $entry_type"

          mkdir -p "$component"
          cd "$component"
          git init
          git remote add origin "$git_url"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          echo "$src" >> .git/info/sparse-checkout
          if ! git fetch --depth=1 origin "$git_commit"; then
            echo "ERROR: failed to fetch $git_commit from $git_url (component: $component)" >&2
            exit 1
          fi
          if ! git checkout "$git_commit"; then
            echo "ERROR: failed to checkout $git_commit for component '$component'" >&2
            exit 1
          fi
          cd ../

          dest_dir_path="${dest_base}/${dest}"
          mkdir -p "${dest_dir_path}"
          cp -r "$component/$src"/* "${dest_dir_path}"
          echo ""
        done < <(yq e '.map | keys' "${config_path}")

        cd /var/workdir
      }

      echo "*************** Prefetching manifests ********************"
      PREFETCHED_MANIFEST_DIR_PATH="/var/workdir/cachi2/output/prefetched-manifests"
      PREFETCHED_CHARTS_DIR_PATH="/var/workdir/cachi2/output/prefetched-charts"
      MANIFEST_CONFIG_PATH=/var/workdir/source/build/manifests-config.yaml

      # Create both dirs so operator CI BUILD_TYPE=CI can always cp charts.
      # Content goes under output/ so KBC (buildah 0.10.5+) mounts it at
      # /cachi2/output inside the build container.
      mkdir -p "$PREFETCHED_MANIFEST_DIR_PATH"
      mkdir -p "$PREFETCHED_CHARTS_DIR_PATH"

      # cachi2.env is sourced by KBC before every RUN instruction.
      # Create compatibility symlinks so the operator Dockerfile's
      # hardcoded /cachi2/prefetched-manifests and /cachi2/prefetched-charts
      # paths resolve to the KBC-mounted /cachi2/output/ tree.
      cat > /var/workdir/cachi2/cachi2.env << 'ENVEOF'
      ln -snf /cachi2/output/prefetched-manifests /cachi2/prefetched-manifests 2>/dev/null || true
      ln -snf /cachi2/output/prefetched-charts /cachi2/prefetched-charts 2>/dev/null || true
      ENVEOF
    
      fetch_and_copy_entries "$MANIFEST_CONFIG_PATH" /var/workdir/manifests \
        "$PREFETCHED_MANIFEST_DIR_PATH" "$PREFETCHED_CHARTS_DIR_PATH"

      echo "=== Prefetched Manifests ==="
      cd ${PREFETCHED_MANIFEST_DIR_PATH}
      ls -l

      echo "*************** Prefetching charts ********************"
      CHARTS_CONFIG_PATH=/var/workdir/source/build/charts-config.yaml

      if [ -f "$CHARTS_CONFIG_PATH" ]; then
        fetch_and_copy_entries "$CHARTS_CONFIG_PATH" /var/workdir/charts \
          "$PREFETCHED_CHARTS_DIR_PATH" ""
      else
        echo "No charts-config.yaml found at ${CHARTS_CONFIG_PATH}, skipping charts prefetch"
      fi

      echo "=== Prefetched Charts ==="
      cd ${PREFETCHED_CHARTS_DIR_PATH}
      ls -l

  - name: create-trusted-artifact
    image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:81c4864dae6bb11595f657be887e205262e70086a05ed16ada827fd6391926ac
    args:
    - create
    - --store
    - $(params.ociStorage)
    - $(results.SOURCE_ARTIFACT.path)=/var/workdir/source
    - $(results.CACHI2_ARTIFACT.path)=/var/workdir/cachi2
    env:
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.ociArtifactExpiresAfter)

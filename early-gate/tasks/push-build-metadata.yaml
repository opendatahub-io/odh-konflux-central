---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-build-metadata
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: |
    Pushes operator build manifests (prefetched operand manifests, operands-map.yaml,
    and manifests-config.yaml) to the odh-build-metadata repository, keyed by the
    operator image digest.
  params:
  - name: SOURCE_ARTIFACT
    description: The Trusted Artifact URI pointing to the artifact with the application source code.
    type: string
  - name: CACHI2_ARTIFACT
    description: The Trusted Artifact URI pointing to the artifact with the prefetched dependencies.
    type: string
  - name: OUTPUT_IMAGE_DIGEST
    description: The operator image digest (sha256:...) used to key the metadata directory.
    type: string
  - name: build-metadata-repo
    description: GitHub org/repo for the build metadata repository.
    type: string
    default: "opendatahub-io/odh-build-metadata"
  volumes:
  - name: workdir
    emptyDir: {}
  stepTemplate:
    volumeMounts:
    - mountPath: /var/workdir
      name: workdir
  workspaces:
  - name: basic-auth
    description: Workspace containing git credentials.
    optional: true
  steps:
  - name: use-trusted-artifact
    image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:81c4864dae6bb11595f657be887e205262e70086a05ed16ada827fd6391926ac
    args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source
    - $(params.CACHI2_ARTIFACT)=/var/workdir/cachi2
  - name: push-metadata
    image: quay.io/rhoai/rhoai-task-toolset:latest
    computeResources:
      requests:
        cpu: '4'
        memory: 16Gi
      limits:
        cpu: '4'
        memory: 16Gi
    env:
    - name: SOURCE_ARTIFACT
      value: $(params.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(params.CACHI2_ARTIFACT)
    - name: OUTPUT_IMAGE_DIGEST
      value: $(params.OUTPUT_IMAGE_DIGEST)
    - name: BUILD_METADATA_REPO
      value: "$(params.build-metadata-repo)"
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: odh-github-secret
          key: build-metadata-token
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      echo "SOURCE_ARTIFACT=${SOURCE_ARTIFACT}"
      echo "CACHI2_ARTIFACT=${CACHI2_ARTIFACT}"
      echo "exploring manifests"
      ls /var/workdir/cachi2
      ls /var/workdir/cachi2/output/prefetched-manifests
      
      echo "exploring sources"
      ls /var/workdir/source

      echo "****************** pushing the changes to odh-build-metadata ************************"
      git config --global init.defaultBranch main
      git config --global user.name "OpenShift-AI-DevOps"
      git config --global user.email "openshift-ai-devops@redhat.com"

      META_DIR=/var/workdir/odh-build-metadata
      OUTPUT_IMAGE_DIGEST=${OUTPUT_IMAGE_DIGEST/sha256:/}

      # Clone once. Do not rebase or reset --hard: that walks the full
      # ~22M-file index. If main rejects the push, publish via a unique
      # digest branch and merge on GitHub instead.
      cd /var/workdir
      rm -rf ${META_DIR}
      mkdir -p ${META_DIR}
      cd ${META_DIR}
      git init
      git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${BUILD_METADATA_REPO}.git"
      git config core.sparseCheckout true
      git config core.sparseCheckoutCone false
      echo "components/odh-operator/docs" >> .git/info/sparse-checkout
      git fetch --depth=1 origin main
      git checkout main

      mkdir -p components/odh-operator/${OUTPUT_IMAGE_DIGEST}/manifests
      cp -r /var/workdir/cachi2/output/prefetched-manifests/* components/odh-operator/${OUTPUT_IMAGE_DIGEST}/manifests
      cp /var/workdir/source/build/operands-map.yaml components/odh-operator/${OUTPUT_IMAGE_DIGEST}
      cp /var/workdir/source/build/manifests-config.yaml components/odh-operator/${OUTPUT_IMAGE_DIGEST}
      git add --sparse components/odh-operator/${OUTPUT_IMAGE_DIGEST}
      if git diff --cached --quiet; then
        if git cat-file -e "HEAD:components/odh-operator/${OUTPUT_IMAGE_DIGEST}" 2>/dev/null; then
          echo "digest ${OUTPUT_IMAGE_DIGEST} already present on origin/main"
          exit 0
        fi
        echo "ERROR: nothing staged for digest ${OUTPUT_IMAGE_DIGEST}"
        exit 1
      fi
      git commit --quiet -m "build-meta for operator image ${OUTPUT_IMAGE_DIGEST}"

      digest_present_on_main() {
        local code
        code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${BUILD_METADATA_REPO}/contents/components/odh-operator/${OUTPUT_IMAGE_DIGEST}?ref=main") || code=000
        [ "$code" = "200" ]
      }

      publish_metadata() {
        local branch="build-meta/${OUTPUT_IMAGE_DIGEST}"
        local api="https://api.github.com/repos/${BUILD_METADATA_REPO}/merges"
        local max_retries=10
        local attempt delay http_code jitter

        echo "Pushing metadata to main"
        if git push origin HEAD:main; then
          echo "Push to main succeeded"
          return 0
        fi

        echo "main rejected the push; publishing via unique branch ${branch}"
        git push --force origin "HEAD:refs/heads/${branch}"

        for ((attempt=1; attempt<=max_retries; attempt++)); do
          echo "Merging ${branch} into main (attempt ${attempt}/${max_retries})"
          http_code=$(curl -sS -o /tmp/merge-body -w "%{http_code}" --max-time 60 \
            -X POST "$api" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"base\":\"main\",\"head\":\"${branch}\",\"commit_message\":\"build-meta for operator image ${OUTPUT_IMAGE_DIGEST}\"}") || http_code=000
          echo "GitHub merge API HTTP ${http_code}"
          cat /tmp/merge-body 2>/dev/null || true
          echo
          case "$http_code" in
            201|204)
              echo "Merged ${branch} into main"
              git push origin ":refs/heads/${branch}" || true
              return 0
              ;;
            401|403)
              echo "ERROR: GitHub merge API authentication failed (${http_code})" >&2
              return 1
              ;;
          esac
          if digest_present_on_main; then
            echo "Digest directory already present on main"
            git push origin ":refs/heads/${branch}" || true
            return 0
          fi
          if [ "$attempt" -eq "$max_retries" ]; then
            echo "ERROR: Failed to merge ${branch} into main after ${max_retries} attempts" >&2
            return 1
          fi
          jitter=$((RANDOM % 8))
          delay=$((attempt * 2 + jitter))
          echo "Merge not complete; waiting ${delay}s before retry"
          sleep "$delay"
        done
      }
      publish_metadata

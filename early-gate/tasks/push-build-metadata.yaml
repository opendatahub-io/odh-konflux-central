---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-build-metadata
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: |
    Pushes operator build manifests (prefetched operand manifests, operands-map.yaml,
    and manifests-config.yaml) to the odh-build-metadata repository, keyed by the
    operator image digest.
  params:
  - name: SOURCE_ARTIFACT
    description: The Trusted Artifact URI pointing to the artifact with the application source code.
    type: string
  - name: CACHI2_ARTIFACT
    description: The Trusted Artifact URI pointing to the artifact with the prefetched dependencies.
    type: string
  - name: OUTPUT_IMAGE_DIGEST
    description: The operator image digest (sha256:...) used to key the metadata directory.
    type: string
  - name: build-metadata-repo
    description: GitHub org/repo for the build metadata repository.
    type: string
    default: "opendatahub-io/odh-build-metadata"
  volumes:
  - name: workdir
    emptyDir: {}
  stepTemplate:
    volumeMounts:
    - mountPath: /var/workdir
      name: workdir
  workspaces:
  - name: basic-auth
    description: Workspace containing git credentials.
    optional: true
  steps:
  - name: use-trusted-artifact
    image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:81c4864dae6bb11595f657be887e205262e70086a05ed16ada827fd6391926ac
    args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source
    - $(params.CACHI2_ARTIFACT)=/var/workdir/cachi2
  - name: push-metadata
    image: quay.io/rhoai/rhoai-task-toolset:latest
    computeResources:
      requests:
        cpu: '4'
        memory: 16Gi
      limits:
        cpu: '4'
        memory: 16Gi
    env:
    - name: SOURCE_ARTIFACT
      value: $(params.SOURCE_ARTIFACT)
    - name: CACHI2_ARTIFACT
      value: $(params.CACHI2_ARTIFACT)
    - name: OUTPUT_IMAGE_DIGEST
      value: $(params.OUTPUT_IMAGE_DIGEST)
    - name: BUILD_METADATA_REPO
      value: "$(params.build-metadata-repo)"
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: odh-github-secret
          key: build-metadata-token
    script: |
      echo "SOURCE_ARTIFACT=${SOURCE_ARTIFACT}"
      echo "CACHI2_ARTIFACT=${CACHI2_ARTIFACT}"
      echo "exploring manifests"
      ls /var/workdir/cachi2
      ls /var/workdir/cachi2/output/prefetched-manifests
      
      echo "exploring sources"
      ls /var/workdir/source

      echo "****************** pushing the changes to odh-build-metadata ************************"
      git config --global init.defaultBranch main
      git config --global user.name "OpenShift-AI-DevOps"
      git config --global user.email "openshift-ai-devops@redhat.com"

      META_DIR=/var/workdir/odh-build-metadata
      OUTPUT_IMAGE_DIGEST=${OUTPUT_IMAGE_DIGEST/sha256:/}

      # Same clone+commit as a successful first attempt. Do not rebase or
      # reset --hard: that walks the full ~22M-file index. On a rejected
      # push, delete the repo and start over from origin/main.
      commit_metadata() {
        cd /var/workdir || return 1
        rm -rf ${META_DIR}
        mkdir -p ${META_DIR} || return 1
        cd ${META_DIR} || return 1
        git init || return 1
        git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${BUILD_METADATA_REPO}.git" || return 1
        git config core.sparseCheckout true || return 1
        git config core.sparseCheckoutCone false || return 1
        echo "components/odh-operator/docs" >> .git/info/sparse-checkout || return 1
        git fetch --depth=1 origin main || return 1
        git checkout main || return 1

        mkdir -p components/odh-operator/${OUTPUT_IMAGE_DIGEST}/manifests || return 1
        cp -r /var/workdir/cachi2/output/prefetched-manifests/* components/odh-operator/${OUTPUT_IMAGE_DIGEST}/manifests || return 1
        cp /var/workdir/source/build/operands-map.yaml components/odh-operator/${OUTPUT_IMAGE_DIGEST} || return 1
        cp /var/workdir/source/build/manifests-config.yaml components/odh-operator/${OUTPUT_IMAGE_DIGEST} || return 1
        git add --sparse components/odh-operator/${OUTPUT_IMAGE_DIGEST} || return 1
        if git diff --cached --quiet; then
          if git cat-file -e "HEAD:components/odh-operator/${OUTPUT_IMAGE_DIGEST}" 2>/dev/null; then
            echo "digest ${OUTPUT_IMAGE_DIGEST} already present on origin/main"
            return 0
          fi
          echo "ERROR: nothing staged for digest ${OUTPUT_IMAGE_DIGEST}"
          return 1
        fi
        git commit -m "build-meta for operator image ${OUTPUT_IMAGE_DIGEST}" || return 1
      }

      commit_metadata || exit 1
      MAX_RETRIES=10
      for attempt in $(seq 1 $MAX_RETRIES); do
        if git push; then
          echo "Push succeeded (attempt ${attempt})"
          break
        fi
        if [ "$attempt" -eq "$MAX_RETRIES" ]; then
          echo "ERROR: Push failed after ${MAX_RETRIES} attempts"
          exit 1
        fi
        echo "Push failed (attempt ${attempt}/${MAX_RETRIES}), recloning origin/main and retrying..."
        commit_metadata || exit 1
      done

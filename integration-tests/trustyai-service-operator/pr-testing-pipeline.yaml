apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: odh-pr-test-trustyai-service-operator
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  description: |
    An integration test which provisions an ephemeral Hypershift cluster, deploys opendatahub-operator
    with the TrustyAI Service Operator from the PR image, and runs the opendatahub-operator e2e tests.
  params:
    - description: Snapshot of the application
      name: SNAPSHOT
      type: string
    - name: ODH_OPERATOR_REPO
      type: string
      default: "https://github.com/opendatahub-io/opendatahub-operator.git"
    - name: ODH_OPERATOR_REVISION
      type: string
      default: "main"
    - name: OPERATOR_NAMESPACE
      type: string
      default: opendatahub-operator-system
    - name: oci-artifacts-repo
      default: 'quay.io/opendatahub/odh-ci-artifacts'
      description: The OCI container used to store all test artifacts.
    - name: artifact-browser-url
      default: 'https://app-artifact-browser.apps.rosa.konflux-qe.zmr9.p3.openshiftapps.com'
      description: The URL for browsing test artifacts.
    - name: OCP_VERSION
      type: string
      default: "4.22"
      description: OpenShift minor version for the ephemeral HyperShift cluster.
    - name: COMPUTE_NODE_TYPE
      type: string
      default: m5.2xlarge
      description: AWS instance type for ephemeral HyperShift worker nodes.
    - name: HYPERSHIFT_NODE_COUNT
      type: string
      default: "3"
      description: Number of worker nodes for the ephemeral HyperShift cluster.
    - name: HOSTED_MANAGEMENT_CLUSTER
      type: string
      default: hosted-mgmt2
      description: Hosted management cluster used to provision the ephemeral cluster.
  tasks:
    - name: audit-snapshot
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskSpec:
        params:
          - name: SNAPSHOT
            description: Snapshot of the application
        results:
        - name: trustyai-operator-image
        - name: pull-request-author
        - name: pull-request-number
        - name: git-repo
        - name: git-org
        - name: git-revision
        steps:
          - name: audit-snapshot
            image: quay.io/konflux-ci/konflux-test:stable
            workingDir: /workspace
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: PR_AUTHOR
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pac.test.appstudio.openshift.io/sender']
              - name: PR_NUMBER
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['pac.test.appstudio.openshift.io/pull-request']
              - name: GIT_REPO
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pac.test.appstudio.openshift.io/url-repository']
              - name: GIT_ORG
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pac.test.appstudio.openshift.io/url-org']
              - name: GIT_REVISION
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pac.test.appstudio.openshift.io/sha']
            script: |
              #!/bin/bash
              set -e
              echo "SNAPSHOT=${SNAPSHOT}"

              # Extract TrustyAI operator image from snapshot
              TRUSTYAI_OPERATOR_IMAGE=""
              while IFS= read -r row; do
                  COMPONENT_NAME=$(echo "$row" | base64 -d | jq -r '.name')
                  IMAGE=$(echo "$row" | base64 -d | jq -r '.containerImage')
                  GIT_COMMIT=$(echo "$row" | base64 -d | jq -r '.source.git.revision')
                  GIT_URL=$(echo "$row" | base64 -d | jq -r '.source.git.url')

                  if echo "${GIT_URL}" | grep -q "trustyai-service-operator"; then
                    TRUSTYAI_OPERATOR_IMAGE="${IMAGE}"
                  fi
                  echo "${COMPONENT_NAME} IMAGE: ${IMAGE} GIT_COMMIT: ${GIT_COMMIT}"
              done < <(echo "$SNAPSHOT" | jq -r '.components[] | @base64')

              if [ -z "$TRUSTYAI_OPERATOR_IMAGE" ]; then
                echo "ERROR: TrustyAI operator image not found in snapshot"
                exit 1
              fi

              echo "TRUSTYAI_OPERATOR_IMAGE: ${TRUSTYAI_OPERATOR_IMAGE}"
              echo -n "${TRUSTYAI_OPERATOR_IMAGE}" > "$(results.trustyai-operator-image.path)"
              echo -n "${PR_AUTHOR}" > "$(results.pull-request-author.path)"
              echo -n "${PR_NUMBER}" > "$(results.pull-request-number.path)"
              echo -n "${GIT_REPO}" > "$(results.git-repo.path)"
              echo -n "${GIT_ORG}" > "$(results.git-org.path)"
              echo -n "${GIT_REVISION}" > "$(results.git-revision.path)"

    - name: provision-cluster
      runAfter:
        - audit-snapshot
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: "9751a2028f2b3b88e4204d5c42de8eda4ebb466f"
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)

        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 1h
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.OCP_VERSION)","architecture":"multi"}}}
        - name: env
          value: '{"COMPUTE_NODE_TYPE":"$(params.COMPUTE_NODE_TYPE)","HYPERSHIFT_NODE_COUNT":"$(params.HYPERSHIFT_NODE_COUNT)","HOSTED_MANAGEMENT_CLUSTER":"$(params.HOSTED_MANAGEMENT_CLUSTER)"}'

    - name: deploy-and-test
      timeout: 120m
      runAfter:
        - provision-cluster
      params:
      - name: trustyai-operator-image
        value: "$(tasks.audit-snapshot.results.trustyai-operator-image)"
      - name: odh-operator-repo
        value: "$(params.ODH_OPERATOR_REPO)"
      - name: odh-operator-revision
        value: "$(params.ODH_OPERATOR_REVISION)"
      - name: operator-namespace
        value: "$(params.OPERATOR_NAMESPACE)"
      - name: clusterCredentialsSecretRef
        value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: trustyai-operator-image
            type: string
          - name: odh-operator-repo
            type: string
          - name: odh-operator-revision
            type: string
          - name: operator-namespace
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          - name: test-status
            emptyDir: {}
        steps:
          - name: clone-odh-operator
            image: alpine/git
            script: |
              echo "Cloning opendatahub-operator from $(params.odh-operator-repo) at $(params.odh-operator-revision)"
              git config --global --add safe.directory /workspace/source
              git init /workspace/source
              git -C /workspace/source fetch --depth 1 $(params.odh-operator-repo) $(params.odh-operator-revision)
              git -C /workspace/source checkout FETCH_HEAD

          - name: deploy-and-e2e
            image: quay.io/rhoai/rhoai-task-toolset:operator
            imagePullPolicy: Always
            onError: continue
            computeResources:
              requests:
                memory: "16Gi"
                cpu: "4"
              limits:
                memory: "24Gi"
                cpu: "6"
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: GOMEMLIMIT
                value: "10GiB"
              - name: GOTOOLCHAIN
                value: "auto"
              - name: TRUSTYAI_OPERATOR_IMAGE
                value: $(params.trustyai-operator-image)
              - name: ARTIFACT_DIR
                value: /workspace/artifacts-dir
            workingDir: /workspace/source
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: test-status
                mountPath: /test-status
            script: |
              set -ex
              STATUS_FILE="/test-status/deploy-and-e2e-status"
              echo "failed" > "$STATUS_FILE"

              git config --global --add safe.directory /workspace/source
              echo "=== Latest commit ==="
              git log -1 --format="Commit: %H%nAuthor: %an%nDate:   %ci%nMessage: %s"

              echo "=== TrustyAI Operator Image from PR ==="
              echo "TRUSTYAI_OPERATOR_IMAGE: ${TRUSTYAI_OPERATOR_IMAGE}"

              # Install kubectl
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x kubectl
              mv kubectl /tmp/kubectl

              oc whoami
              oc get nodes

              # Deploy the opendatahub-operator
              echo "Deploying opendatahub-operator..."
              make deploy OPERATOR_NAMESPACE=$(params.operator-namespace)

              # Wait for operator to be ready
              echo "Waiting for opendatahub-operator to be ready..."
              /tmp/kubectl wait --for=condition=available --timeout=300s deployment/opendatahub-operator-controller-manager -n $(params.operator-namespace)

              # Create DataScienceCluster with TrustyAI enabled and using the PR image
              echo "Creating DataScienceCluster with TrustyAI using PR image..."
              cat <<EOF | oc apply -f -
              apiVersion: datasciencecluster.opendatahub.io/v1
              kind: DataScienceCluster
              metadata:
                name: default-dsc
              spec:
                components:
                  trustyai:
                    managementState: Managed
                    devFlags:
                      manifests:
                        - uri: https://github.com/opendatahub-io/trustyai-service-operator/tarball/main
                          contextDir: config
                          sourcePath: ""
                    trustyaiserviceoperator:
                      image: ${TRUSTYAI_OPERATOR_IMAGE}
              EOF

              # Wait for TrustyAI operator to be deployed
              echo "Waiting for TrustyAI operator deployment..."
              sleep 30
              /tmp/kubectl get deployments -A | grep trustyai || true

              mkdir -p "${ARTIFACT_DIR}"

              # Run e2e tests
              echo "Running opendatahub-operator e2e tests..."
              make e2e-test -e E2E_TEST_OPERATOR_NAMESPACE=$(params.operator-namespace) 2>&1 | tee "${ARTIFACT_DIR}/e2e-tests.log" || {
                EXIT_CODE=$?
                echo "============================================"
                echo "E2E tests failed with exit code: $EXIT_CODE"
                echo "Pods in namespace $(params.operator-namespace):"
                /tmp/kubectl get pods -n $(params.operator-namespace) || true
                echo "Operator logs:"
                /tmp/kubectl logs -n $(params.operator-namespace) -l control-plane=controller-manager --tail=100 || true
                echo "TrustyAI resources:"
                /tmp/kubectl get trustyaiservices -A || true
                exit $EXIT_CODE
              }

              echo "success" > "$STATUS_FILE"

          - name: git-push-artifacts
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/secure-git-push/0.1/secure-git-push.yaml
            params:
              - name: source-path
                value: /workspace/artifacts-dir
              - name: repo-path
                value: 'opendatahub-io/odh-build-metadata'
              - name: repo-branch
                value: 'ci-artifacts'
              - name: sparse-file-path
                value: 'test-artifacts/docs'
              - name: dest-path
                value: 'test-artifacts/$(context.pipelineRun.name)'
              - name: pipelinerun-name
                value: $(context.pipelineRun.name)

          - name: check-test-exit-code
            image: quay.io/rhoai-konflux/alpine:latest
            volumeMounts:
              - name: test-status
                mountPath: /test-status
            script: |
              STATUS_FILE="/test-status/deploy-and-e2e-status"
              if ! [ -f "$STATUS_FILE" ] || [ "$(cat "$STATUS_FILE")" != "success" ]; then
                echo "Failing pipeline because deploy-and-e2e step failed"
                exit 1
              fi
              echo "deploy-and-e2e step succeeded"

  finally:
    - name: push-ci-artifacts-and-update-pr
      params:
        - name: oci-artifacts-repo
          value: $(params.oci-artifacts-repo)
        - name: pipeline-status
          value: $(tasks.status)
      taskSpec:
        volumes:
          - name: odh-registry-secret-volume
            secret:
              secretName: odh-registry-secret
              items:
              - key: .dockerconfigjson
                path: oci-storage-dockerconfigjson
        params:
          - name: oci-artifacts-repo
            description: oci-artifacts-repo
          - name: pipeline-status
            type: string
        steps:
          - name: pull-ci-artifacts
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/git-clone/0.1/git-clone.yaml
            params:
              - name: repo-path
                value: 'opendatahub-io/odh-build-metadata'
              - name: repo-branch
                value: 'ci-artifacts'
              - name: sparse-file-path
                value: 'test-artifacts/$(context.pipelineRun.name)'
              - name: dest-path
                value: /workspace/odh-ci-artifacts
              - name: artifacts-dir-path
                value: 'test-artifacts/$(context.pipelineRun.name)'
          - name: secure-push-oci
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
            params:
              - name: workdir-path
                value: '/workspace/odh-ci-artifacts/test-artifacts/$(context.pipelineRun.name)'
              - name: oci-ref
                value: $(params.oci-artifacts-repo):$(context.pipelineRun.name)
              - name: credentials-volume-name
                value: odh-registry-secret-volume
          - name: share-status-on-pull-request
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/pull-request-comment/0.1/pull-request-comment.yaml
            params:
              - name: test-name
                value: $(context.pipelineRun.name)
              - name: oci-container
                value: $(params.oci-artifacts-repo):$(context.pipelineRun.name)
              - name: pipeline-aggregate-status
                value: $(params.pipeline-status)
              - name: pull-request-author
                value: $(tasks.audit-snapshot.results.pull-request-author)
              - name: pull-request-number
                value: $(tasks.audit-snapshot.results.pull-request-number)
              - name: git-repo
                value: $(tasks.audit-snapshot.results.git-repo)
              - name: git-org
                value: $(tasks.audit-snapshot.results.git-org)
              - name: git-revision
                value: $(tasks.audit-snapshot.results.git-revision)
              - name: artifact-browser-url
                value: $(params.artifact-browser-url)
          - name: cleanup-artifacts-from-git
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/cleanup-git-repo/0.1/cleanup-git-repo.yaml
            params:
              - name: work-dir
                value: '/workspace/odh-ci-artifacts'
              - name: artifacts-dir-path
                value: 'test-artifacts'
              - name: dir-to-be-deleted
                value: '$(context.pipelineRun.name)'

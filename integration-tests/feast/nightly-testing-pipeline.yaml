# Nightly integration test pipeline for Feast.
#
# Resolves the latest Konflux-built odh-master images (pushed on every merge
# to master by the odh-feast-operator-push and odh-feature-server-push
# pipelines), provisions an ephemeral HyperShift cluster, deploys those
# images, and runs the full e2e + REST API + upgrade test suite.
#
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: odh-nightly-test-feast
spec:
  description: |
    Nightly integration test for Feast. Resolves the latest Konflux-built
    odh-master images, provisions an ephemeral HyperShift cluster, deploys
    those images, and runs the full e2e + REST API + upgrade test suite.
  params:
    - name: oci-artifacts-repo
      default: 'quay.io/opendatahub/odh-ci-artifacts'
      description: The OCI container used to store all test artifacts.
    - name: artifact-browser-url
      default: 'https://app-artifact-browser.apps.rosa.konflux-qe.zmr9.p3.openshiftapps.com'
      description: The OCI artifact browser URL.
    - name: git-repo
      default: 'opendatahub-io/feast'
      description: GitHub repo (owner/name) for commit status reporting.
    - name: git-branch
      default: 'master'
      description: Branch to report status against.
    - name: ocp-version
      type: string
      default: "4.22"
      description: OpenShift minor version for the ephemeral HyperShift cluster.
    - name: compute-node-type
      type: string
      default: m5.2xlarge
      description: AWS instance type for ephemeral HyperShift worker nodes.
    - name: hypershift-node-count
      type: string
      default: "3"
      description: Number of worker nodes for the ephemeral HyperShift cluster.
    - name: hosted-management-cluster
      type: string
      default: hosted-mgmt2
      description: Hosted management cluster used to provision the ephemeral cluster.
  tasks:
    - name: resolve-images
      description: |
        Resolve the current digest of the Konflux-built odh-master images
        (quay.io/opendatahub/feast-operator:odh-master and feature-server:odh-master)
        and emit a SNAPSHOT. No build step required — images are already built
        and pushed by the push pipelines on every merge to master.
      params:
        - name: git-repo
          value: $(params.git-repo)
        - name: git-branch
          value: $(params.git-branch)
      taskSpec:
        params:
          - name: git-repo
            description: GitHub repo as owner/name (e.g. opendatahub-io/feast)
          - name: git-branch
            description: Branch to resolve the HEAD commit from
        results:
          - name: SNAPSHOT
            description: JSON snapshot of component images (digest-pinned)
          - name: git-revision
            description: Git commit embedded in the operator image labels
        steps:
          - name: resolve
            image: quay.io/konflux-ci/konflux-test:stable
            env:
              - name: GIT_REPO
                value: $(params.git-repo)
              - name: GIT_BRANCH
                value: $(params.git-branch)
            script: |
              #!/bin/bash
              set -euo pipefail

              OPERATOR_REF="quay.io/opendatahub/feast-operator:odh-master"
              SERVER_REF="quay.io/opendatahub/feature-server:odh-master"
              GIT_URL="https://github.com/${GIT_REPO}"

              echo "=== Resolving odh-master image digests ==="
              OPERATOR_DIGEST=$(skopeo inspect --no-tags "docker://${OPERATOR_REF}" \
                | jq -r '.Name + "@" + .Digest')
              SERVER_DIGEST=$(skopeo inspect --no-tags "docker://${SERVER_REF}" \
                | jq -r '.Name + "@" + .Digest')

              echo "Operator: ${OPERATOR_DIGEST}"
              echo "Server:   ${SERVER_DIGEST}"

              # Get git commit from image labels set by the Konflux build pipeline
              GIT_COMMIT=$(skopeo inspect "docker://${OPERATOR_REF}" | jq -r '
                .Labels["io.openshift.build.commit.id"] //
                .Labels["vcs-ref"] //
                .Labels["org.opencontainers.image.revision"] //
                ""')

              # Fallback: resolve current HEAD of the branch from GitHub
              if [ -z "${GIT_COMMIT}" ]; then
                echo "No git commit found in image labels, resolving from GitHub"
                GIT_COMMIT=$(git ls-remote "https://github.com/${GIT_REPO}.git" \
                  "refs/heads/${GIT_BRANCH}" | awk '{print $1}')
              fi

              if [ -z "${GIT_COMMIT}" ]; then
                echo "ERROR: failed to resolve git commit from image labels or GitHub (image=${OPERATOR_REF} repo=${GIT_REPO} branch=${GIT_BRANCH})" >&2
                exit 1
              fi

              echo "Commit:   ${GIT_COMMIT}"

              # Warn if the image appears stale (older than 48h)
              CREATED=$(skopeo inspect "docker://${OPERATOR_REF}" | jq -r '.Created')
              IMAGE_AGE_HOURS=$(( ($(date +%s) - $(date -d "${CREATED}" +%s)) / 3600 ))
              echo "Image age: ${IMAGE_AGE_HOURS}h (created: ${CREATED})"
              if [ "${IMAGE_AGE_HOURS}" -gt 48 ]; then
                echo "WARNING: odh-master image is ${IMAGE_AGE_HOURS}h old — the push pipeline may not have run recently"
              fi

              jq -n \
                --arg op  "${OPERATOR_DIGEST}" \
                --arg sv  "${SERVER_DIGEST}" \
                --arg sha "${GIT_COMMIT}" \
                --arg url "${GIT_URL}" \
                '{
                  "odh-feast-operator-ci":  {"image": $op, "git.commit": $sha, "git.url": $url},
                  "odh-feature-server-ci":  {"image": $sv, "git.commit": $sha, "git.url": $url}
                }' | tee "$(results.SNAPSHOT.path)"

              echo -n "${GIT_COMMIT}" > "$(results.git-revision.path)"

    - name: provision-cluster
      runAfter:
        - resolve-images
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: "9751a2028f2b3b88e4204d5c42de8eda4ebb466f"
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 1h
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.ocp-version)","architecture":"multi"}}}
        - name: env
          value: '{"COMPUTE_NODE_TYPE":"$(params.compute-node-type)","HYPERSHIFT_NODE_COUNT":"$(params.hypershift-node-count)","HOSTED_MANAGEMENT_CLUSTER":"$(params.hosted-management-cluster)"}'

    - name: deploy-and-test
      workspaces:
        - name: basic-auth
          workspace: git-auth
      runAfter:
        - provision-cluster
      params:
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          - name: test-status
            emptyDir: {}
        workspaces:
          - name: basic-auth
            optional: true
        steps:
          - name: deploy-and-e2e
            image: quay.io/rhoai/rhoai-task-toolset:go-its
            onError: continue
            computeResources:
              requests:
                memory: "4Gi"
                cpu: "2"
              limits:
                memory: "8Gi"
                cpu: "4"
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: SNAPSHOT
                value: $(tasks.resolve-images.results.SNAPSHOT)
              - name: GOTOOLCHAIN
                value: auto
            workingDir: /workspace/source
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: test-status
                mountPath: /test-status
            script: |
              STATUS_FILE="/test-status/deploy-and-e2e-status"
              echo "failed" > "$STATUS_FILE"

              export KUBECONFIG
              echo "KUBECONFIG=${KUBECONFIG}"
              export HOME="${HOME:-/tmp}"
              mkdir -p "$HOME/.kube"
              cp "${KUBECONFIG%%:*}" "$HOME/.kube/config"
              echo "Kubeconfig copied to $HOME/.kube/config"

              oc get pods
              oc whoami

              echo "=== NIGHTLY TEST RUN ==="
              echo "SNAPSHOT=${SNAPSHOT}"

              COMPONENT_NAME=odh-feast-operator-ci
              FEAST_OPERATOR_CONTROLLER_IMAGE=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name].image' <<< "${SNAPSHOT}")
              GIT_COMMIT=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.commit"' <<< "${SNAPSHOT}")
              GIT_URL=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.url"' <<< "${SNAPSHOT}")
              echo "  FEAST_OPERATOR_CONTROLLER_IMAGE: ${FEAST_OPERATOR_CONTROLLER_IMAGE}"
              echo "GIT_COMMIT=${GIT_COMMIT}"
              echo "GIT_URL=${GIT_URL}"

              COMPONENT_NAME=odh-feature-server-ci
              FEAST_FEATURE_SERVER_IMAGE=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name].image' <<< "${SNAPSHOT}")
              GIT_COMMIT=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.commit"' <<< "${SNAPSHOT}")
              GIT_URL=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.url"' <<< "${SNAPSHOT}")
              echo "  FEAST_FEATURE_SERVER_IMAGE: ${FEAST_FEATURE_SERVER_IMAGE}"
              echo "GIT_COMMIT=${GIT_COMMIT}"
              echo "GIT_URL=${GIT_URL}"

              REPO_URL=${GIT_URL}
              REVISION=${GIT_COMMIT}

              echo "REPO_URL=${REPO_URL}"
              echo "REVISION=${REVISION}"
              git clone "${REPO_URL}" src_code
              cd src_code
              git checkout ${REVISION}

              export RUN_ON_OPENSHIFT_CI=true

              echo "=== Feature Store Operator E2E ==="
              cd infra/feast-operator
              make install && make deploy IMG=${FEAST_OPERATOR_CONTROLLER_IMAGE} FS_IMG=${FEAST_FEATURE_SERVER_IMAGE}
              oc wait --for condition=Available -n feast-operator-system deployment feast-operator-controller-manager

              E2E_RC=0
              REGISTRY_RC=0
              PREV_RC=0
              UPGRADE_RC=0

              echo "=== Running: make test-e2e ==="
              make test-e2e || E2E_RC=$?

              cd ../..
              echo "=== Running: registry REST API test ==="
              make install-python-dependencies-ci && \
              uv run pytest -c sdk/python/pytest.ini sdk/python/tests/integration/rest_api/test_registry_rest_api.py --integration -s --timeout=600 || REGISTRY_RC=$?

              cd infra/feast-operator
              make undeploy IMG=${FEAST_OPERATOR_CONTROLLER_IMAGE} FS_IMG=${FEAST_FEATURE_SERVER_IMAGE} || true

              echo "=== Running: make test-previous-version ==="
              make test-previous-version || PREV_RC=$?

              oc delete deployment feast-operator-controller-manager -n feast-operator-system --ignore-not-found=true
              oc wait --for=delete deployment/feast-operator-controller-manager -n feast-operator-system --timeout=180s || UPGRADE_RC=$?

              echo "=== Running: make test-upgrade ==="
              make test-upgrade || UPGRADE_RC=$?

              echo ""
              echo "=== Test Suite Results ==="
              echo "  test-e2e:              $([ $E2E_RC      -eq 0 ] && echo PASSED || echo FAILED [rc=$E2E_RC])"
              echo "  registry-rest-api:     $([ $REGISTRY_RC -eq 0 ] && echo PASSED || echo FAILED [rc=$REGISTRY_RC])"
              echo "  test-previous-version: $([ $PREV_RC     -eq 0 ] && echo PASSED || echo FAILED [rc=$PREV_RC])"
              echo "  test-upgrade:          $([ $UPGRADE_RC  -eq 0 ] && echo PASSED || echo FAILED [rc=$UPGRADE_RC])"

              if [ $E2E_RC -eq 0 ] && [ $REGISTRY_RC -eq 0 ] && [ $PREV_RC -eq 0 ] && [ $UPGRADE_RC -eq 0 ]; then
                echo "success" > "$STATUS_FILE"
              fi

          - name: must-gather
            onError: continue
            image: quay.io/rhoai/rhoai-task-toolset:go-its
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: ARTIFACT_DIR
                value: /workspace/artifacts-dir
            workingDir: /workspace/source
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            script: |
              mkdir -p "${ARTIFACT_DIR}/gather-feast"
              oc adm must-gather --image=quay.io/modh/must-gather:rhoai-2.24 --dest-dir "${ARTIFACT_DIR}/gather-feast" -- "export COMPONENT=feastoperator; /usr/bin/gather"

              mkdir -p "${ARTIFACT_DIR}/gather-openshift"
              oc adm must-gather --dest-dir "${ARTIFACT_DIR}/gather-openshift"

          - name: git-push-artifacts
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/secure-git-push/0.1/secure-git-push.yaml
            params:
              - name: source-path
                value: /workspace/artifacts-dir
              - name: repo-path
                value: 'opendatahub-io/odh-build-metadata'
              - name: repo-branch
                value: 'ci-artifacts'
              - name: sparse-file-path
                value: 'test-artifacts/docs'
              - name: dest-path
                value: 'test-artifacts/$(context.pipelineRun.name)'
              - name: pipelinerun-name
                value: $(context.pipelineRun.name)

          - name: fail-if-needed
            image: alpine
            volumeMounts:
              - name: test-status
                mountPath: /test-status
            script: |
              STATUS_FILE="/test-status/deploy-and-e2e-status"
              if ! [ -f "$STATUS_FILE" ] || [ "$(cat "$STATUS_FILE")" != "success" ]; then
                echo "Failing pipeline because deploy-and-e2e step failed"
                exit 1
              fi
              echo "All nightly tests passed"

  finally:
    - name: report-nightly-status
      params:
        - name: pipeline-status
          value: $(tasks.status)
        - name: git-repo
          value: $(params.git-repo)
        - name: git-branch
          value: $(params.git-branch)
        - name: git-revision
          value: $(tasks.resolve-images.results.git-revision)
        - name: oci-artifacts-repo
          value: $(params.oci-artifacts-repo)
        - name: artifact-browser-url
          value: $(params.artifact-browser-url)
      workspaces:
        - name: basic-auth
          workspace: git-auth
      taskSpec:
        volumes:
          - name: odh-registry-secret-volume
            secret:
              secretName: odh-registry-secret
              items:
                - key: .dockerconfigjson
                  path: oci-storage-dockerconfigjson
        params:
          - name: pipeline-status
            type: string
          - name: git-repo
            type: string
          - name: git-branch
            type: string
          - name: git-revision
            type: string
          - name: oci-artifacts-repo
            type: string
          - name: artifact-browser-url
            type: string
        workspaces:
          - name: basic-auth
            optional: true
        steps:
          - name: pull-ci-artifacts
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/git-clone/0.1/git-clone.yaml
            params:
              - name: repo-path
                value: 'opendatahub-io/odh-build-metadata'
              - name: repo-branch
                value: 'ci-artifacts'
              - name: sparse-file-path
                value: 'test-artifacts/$(context.pipelineRun.name)'
              - name: dest-path
                value: /workspace/odh-ci-artifacts
              - name: artifacts-dir-path
                value: 'test-artifacts/$(context.pipelineRun.name)'
          - name: secure-push-oci
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
            params:
              - name: workdir-path
                value: '/workspace/odh-ci-artifacts/test-artifacts/$(context.pipelineRun.name)'
              - name: oci-ref
                value: $(params.oci-artifacts-repo):$(context.pipelineRun.name)
              - name: credentials-volume-name
                value: odh-registry-secret-volume
          - name: set-commit-status
            image: quay.io/konflux-ci/konflux-test:stable
            env:
              - name: PIPELINE_STATUS
                value: $(params.pipeline-status)
              - name: GIT_REPO
                value: $(params.git-repo)
              - name: GIT_BRANCH
                value: $(params.git-branch)
              - name: GIT_REVISION
                value: $(params.git-revision)
              - name: PIPELINERUN_NAME
                value: $(context.pipelineRun.name)
              - name: OCI_REPO
                value: $(params.oci-artifacts-repo)
              - name: ARTIFACT_BROWSER_URL
                value: $(params.artifact-browser-url)
            script: |
              #!/bin/bash
              set -e

              echo "=== Nightly Test Report ==="
              echo "Pipeline status: ${PIPELINE_STATUS}"
              echo "Git repo:        ${GIT_REPO}"
              echo "Git branch:      ${GIT_BRANCH}"
              echo "Git revision:    ${GIT_REVISION}"
              echo "PipelineRun:     ${PIPELINERUN_NAME}"

              if [ "${PIPELINE_STATUS}" = "Succeeded" ]; then
                STATE="success"
                DESCRIPTION="Nightly tests passed"
              else
                STATE="failure"
                DESCRIPTION="Nightly tests failed"
              fi

              ARTIFACTS_URL="${ARTIFACT_BROWSER_URL}/?oci=${OCI_REPO}:${PIPELINERUN_NAME}"
              echo "Artifacts: ${ARTIFACTS_URL}"

              if [ -f "/workspace/basic-auth/.git-credentials" ]; then
                GITHUB_TOKEN=$(cat /workspace/basic-auth/.git-credentials | grep github.com | sed 's|.*://||;s|@.*||;s|.*:||')
                if [ -n "${GITHUB_TOKEN}" ] && [ -n "${GIT_REVISION}" ] && [ "${GIT_REVISION}" != "master" ]; then
                  curl -s -X POST \
                    -H "Authorization: token ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    "https://api.github.com/repos/${GIT_REPO}/statuses/${GIT_REVISION}" \
                    -d "{
                      \"state\": \"${STATE}\",
                      \"target_url\": \"${ARTIFACTS_URL}\",
                      \"description\": \"${DESCRIPTION}\",
                      \"context\": \"konflux/nightly-feast\"
                    }" && echo "Commit status posted" || echo "Failed to post commit status"
                fi
              fi

              echo "Nightly report complete"
          - name: cleanup-artifacts-from-git
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/cleanup-git-repo/0.1/cleanup-git-repo.yaml
            params:
              - name: work-dir
                value: '/workspace/odh-ci-artifacts'
              - name: artifacts-dir-path
                value: 'test-artifacts'
              - name: dir-to-be-deleted
                value: '$(context.pipelineRun.name)'
  workspaces:
    - name: git-auth
      optional: true

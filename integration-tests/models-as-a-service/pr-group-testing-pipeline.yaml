---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: odh-pr-test-maas
spec:
  description: |
    A group integration test which provisions an ephemeral Hypershift cluster and runs the
    MaaS e2e tests using images for odh-maas-api-ci, odh-maas-controller-ci, and
    odh-maas-discovery-ci built from the same pull request commit.
  params:
    - description: List of components in the group
      name: group-components
      type: string
    - name: oci-artifacts-repo
      default: 'quay.io/opendatahub/odh-ci-artifacts'
      description: The OCI container used to store all test artifacts.
    - name: artifact-browser-url
      default: 'https://app-artifact-browser.apps.rosa.konflux-qe.zmr9.p3.openshiftapps.com'
      description: The OCI container used to store all test artifacts.
    - name: rhoai-must-gather-tag
      type: string
      default: 'v3.5.0'
      description: >
        Tag for the official RHOAI must-gather image
        registry.redhat.io/rhoai/odh-must-gather-rhel9:<tag>.
        Ignored when rhoai-must-gather-image is set.
    - name: rhoai-must-gather-image
      type: string
      default: ''
      description: >
        Optional full must-gather image override (e.g. quay pre-release).
        When empty, uses registry.redhat.io/rhoai/odh-must-gather-rhel9:<tag>.
    - name: gather-on-success
      type: string
      default: 'false'
      description: >
        Run must-gather even when e2e tests pass. Set to "true" when you
        need cluster logs from a successful run for validation. When "false"
        (default), must-gather is skipped on success to save ~20-25 min.
    - name: ocp-version
      type: string
      default: "4.22"
      description: OpenShift minor version for the ephemeral HyperShift cluster.
    - name: compute-node-type
      type: string
      default: m5.2xlarge
      description: AWS instance type for ephemeral HyperShift worker nodes.
    - name: hypershift-node-count
      type: string
      default: "3"
      description: Number of worker nodes for the ephemeral HyperShift cluster.
    - name: hosted-management-cluster
      type: string
      default: hosted-mgmt2
      description: Hosted management cluster used to provision the ephemeral cluster.
  tasks:
    - name: generate-snapshot
      description: Generate a composite snapshot containing images for all group components
      params:
        - name: COMPONENTS
          value: $(params.group-components)
      workspaces:
      - name: basic-auth
        workspace: git-auth
      taskRef:
        resolver: git
        params:
        - name: url
          value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
        - name: revision
          value: main
        - name: pathInRepo
          value: konflux-tekton-tasks/generate-snapshot-for-group-testing/0.1/generate-snapshot-for-group-testing.yaml
    - name: audit-snapshot
      runAfter:
        - generate-snapshot
      params:
        - name: COMPONENTS
          value: $(params.group-components)
      taskSpec:
        params:
          - name: COMPONENTS
            description: List of components in the group
        results:
        - name: pull-request-author
        - name: pull-request-number
        - name: git-repo
        - name: git-org
        - name: git-revision
        steps:
          - name: audit-snapshot
            image: quay.io/konflux-ci/konflux-test:stable
            workingDir: /workspace
            env:
              - name: SNAPSHOT
                value: $(tasks.generate-snapshot.results.SNAPSHOT)
              - name: COMPONENTS
                value: $(params.COMPONENTS)
              - name: PR_AUTHOR
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/sender']
              - name: PR_NUMBER
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['pipelinesascode.tekton.dev/pull-request']
              - name: GIT_REPO
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/url-repository']
              - name: GIT_ORG
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/url-org']
              - name: GIT_REVISION
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/sha']
            script: |
              #!/bin/bash
              set -e
              echo "SNAPSHOT=${SNAPSHOT}"

              # Parse JSON and iterate through each component
              while IFS= read -r row; do
                  COMPONENT_NAME=$(echo "$row" | base64 -d | jq -r '.key')
                  IMAGE=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name].image' <<< "${SNAPSHOT}")
                  GIT_COMMIT=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.commit"' <<< "${SNAPSHOT}")
                  GIT_URL=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.url"' <<< "${SNAPSHOT}")
                  if [ -z "${IMAGE}" ] || [ "${IMAGE}" = "null" ] || \
                     [ -z "${GIT_COMMIT}" ] || [ "${GIT_COMMIT}" = "null" ] || \
                     [ -z "${GIT_URL}" ] || [ "${GIT_URL}" = "null" ]; then
                      echo "ERROR: snapshot metadata missing for ${COMPONENT_NAME}" >&2
                      exit 1
                  fi
                  echo "${COMPONENT_NAME} IMAGE: ${IMAGE}"
                  echo "GIT_COMMIT=${GIT_COMMIT}"
                  echo "GIT_URL=${GIT_URL}"
              done < <(echo "$COMPONENTS" | jq -r 'to_entries[] | @base64')

              echo -n "${PR_AUTHOR}" > "$(results.pull-request-author.path)"
              echo -n "${PR_NUMBER}" > "$(results.pull-request-number.path)"
              echo -n "${GIT_REPO}" > "$(results.git-repo.path)"
              echo -n "${GIT_ORG}" > "$(results.git-org.path)"
              echo -n "${GIT_REVISION}" > "$(results.git-revision.path)"

    - name: provision-cluster
      runAfter:
        - audit-snapshot
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: "9751a2028f2b3b88e4204d5c42de8eda4ebb466f"
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 1h
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.ocp-version)","architecture":"multi"}}}
        - name: env
          value: '{"COMPUTE_NODE_TYPE":"$(params.compute-node-type)","HYPERSHIFT_NODE_COUNT":"$(params.hypershift-node-count)","HOSTED_MANAGEMENT_CLUSTER":"$(params.hosted-management-cluster)"}'
    - name: e2e-maas-openshift
      timeout: 1h30m
      workspaces:
      - name: basic-auth
        workspace: git-auth
      runAfter:
        - provision-cluster
      params:
        - name: rhoai-must-gather-tag
          value: $(params.rhoai-must-gather-tag)
        - name: rhoai-must-gather-image
          value: $(params.rhoai-must-gather-image)
        - name: gather-on-success
          value: $(params.gather-on-success)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: rhoai-must-gather-tag
            type: string
            default: 'v3.5.0'
            description: Tag for registry.redhat.io/rhoai/odh-must-gather-rhel9
          - name: rhoai-must-gather-image
            type: string
            default: ''
            description: Optional full must-gather image override
          - name: gather-on-success
            type: string
            default: 'false'
            description: Run must-gather even when e2e tests pass
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          - name: test-status
            emptyDir: {}
        workspaces:
          - name: basic-auth
            optional: true
        steps:
          - name: clone-repo
            image: alpine/git
            env:
            - name: source_branch
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['pipelinesascode.tekton.dev/source-branch']
            - name: repo_url
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['pipelinesascode.tekton.dev/source-repo-url']
            script: |
              echo "${source_branch}"
              echo "${repo_url}"
              git clone --depth 50 --no-single-branch "${repo_url}" /workspace/source
              git config --global --add safe.directory /workspace/source
              cd /workspace/source
              git checkout "${source_branch}"
          - name: e2e-maas
            onError: continue
            image: quay.io/rhoai/rhoai-task-toolset:maas
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: ARTIFACT_DIR
                value: /workspace/artifacts-dir
              - name: SNAPSHOT
                value: $(tasks.generate-snapshot.results.SNAPSHOT)
              - name: TARGET_BRANCH
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['build.appstudio.redhat.com/target_branch']
            workingDir: /workspace/source
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: test-status
                mountPath: /test-status
            script: |
              set -euxo pipefail
              bash

              STATUS_FILE="/test-status/deploy-and-e2e-status"
              echo "failed" > "$STATUS_FILE"

              export MAAS_API_IMAGE=$(jq -r '."odh-maas-api-ci".image' <<< "${SNAPSHOT}")
              export MAAS_CONTROLLER_IMAGE=$(jq -r '."odh-maas-controller-ci".image' <<< "${SNAPSHOT}")
              export MAAS_DISCOVERY_IMAGE=$(jq -r '."odh-maas-discovery-ci".image' <<< "${SNAPSHOT}")

              MAAS_API_TAG=$(jq -r '."odh-maas-api-ci".image_tag' <<< "${SNAPSHOT}")
              MAAS_CONTROLLER_TAG=$(jq -r '."odh-maas-controller-ci".image_tag' <<< "${SNAPSHOT}")
              MAAS_DISCOVERY_TAG=$(jq -r '."odh-maas-discovery-ci".image_tag' <<< "${SNAPSHOT}")

              if [ -z "${MAAS_API_TAG}" ] || [ "${MAAS_API_TAG}" = "null" ] || \
                 [ -z "${MAAS_CONTROLLER_TAG}" ] || [ "${MAAS_CONTROLLER_TAG}" = "null" ] || \
                 [ -z "${MAAS_DISCOVERY_TAG}" ] || [ "${MAAS_DISCOVERY_TAG}" = "null" ]; then
                set +x
                echo "❌ ERROR: image_tag missing for odh-maas-api-ci, odh-maas-controller-ci, or odh-maas-discovery-ci in SNAPSHOT" >&2
                exit 1
              fi

              set +x
              echo ""
              echo "=========================================="
              echo "  ✅ Snapshot images resolved"
              echo "=========================================="
              echo "  API:        ${MAAS_API_IMAGE%%@*}:${MAAS_API_TAG}"
              echo "              digest: ${MAAS_API_IMAGE#*@}"
              echo "  Controller: ${MAAS_CONTROLLER_IMAGE%%@*}:${MAAS_CONTROLLER_TAG}"
              echo "              digest: ${MAAS_CONTROLLER_IMAGE#*@}"
              echo "  Discovery:  ${MAAS_DISCOVERY_IMAGE%%@*}:${MAAS_DISCOVERY_TAG}"
              echo "              digest: ${MAAS_DISCOVERY_IMAGE#*@}"
              echo "=========================================="
              echo ""
              set -x

              # main -> stable promotion PRs are the integration gate: deploy via the ODH
              # operator (latest catalog) with ai-gateway-operator pinned to its stable image,
              # so the operator's own ModelsAsService/AIGateway reconcilers get exercised
              # against this PR's images before it can merge. Plain /group-test runs (main)
              # keep the default kustomize-based deploy used by every other PR.
              if [ "${TARGET_BRANCH:-}" = "stable" ]; then
                echo "TARGET_BRANCH=stable: deploying via ODH operator (latest) + ai-gateway-operator (stable)"
                export DEPLOY_MODE=operator
                export OPERATOR_CATALOG="${OPERATOR_CATALOG:-quay.io/opendatahub/opendatahub-operator-catalog:latest}"
                # The "latest" ODH catalog only ships a "fast" channel (no "fast-3"), unlike
                # community-operators. deploy.sh defaults custom-catalog ODH installs to
                # fast-3, which does not exist here and fails subscription resolution — so
                # this must be pinned explicitly. Confirmed via manual testing.
                export OPERATOR_CHANNEL="${OPERATOR_CHANNEL:-fast}"
                export AI_GATEWAY_OPERATOR_IMAGE="${AI_GATEWAY_OPERATOR_IMAGE:-quay.io/opendatahub/odh-ai-gateway-operator:odh-stable}"
              else
                echo "TARGET_BRANCH=${TARGET_BRANCH:-<unset>}: using default kustomize deploy"
              fi

              ./test/e2e/scripts/prow_run_smoke_test.sh

              echo "success" > "$STATUS_FILE"
          - name: must-gather
            onError: continue
            image: quay.io/rhoai/rhoai-task-toolset:maas
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: ARTIFACT_DIR
                value: /workspace/artifacts-dir
              - name: RHOAI_MUST_GATHER_TAG
                value: $(params.rhoai-must-gather-tag)
              - name: RHOAI_MUST_GATHER_IMAGE_OVERRIDE
                value: $(params.rhoai-must-gather-image)
              - name: GATHER_ON_SUCCESS
                value: $(params.gather-on-success)
            workingDir: /workspace/source
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: test-status
                mountPath: /test-status
            script: |
              set -uxo pipefail

              # --- Conditional skip: only gather on failure or when explicitly requested ---
              STATUS_FILE="/test-status/deploy-and-e2e-status"
              E2E_STATUS=$(cat "${STATUS_FILE}" 2>/dev/null || echo "failed")
              echo "ℹ️ e2e test status: ${E2E_STATUS}"
              echo "ℹ️ gather-on-success: ${GATHER_ON_SUCCESS}"

              if [ "${E2E_STATUS}" = "success" ] && [ "${GATHER_ON_SUCCESS}" != "true" ]; then
                echo "✅ E2E passed and gather-on-success is not enabled — skipping must-gather"
                exit 0
              fi

              if [ -n "${RHOAI_MUST_GATHER_IMAGE_OVERRIDE}" ]; then
                RHOAI_MUST_GATHER_IMAGE="${RHOAI_MUST_GATHER_IMAGE_OVERRIDE}"
              else
                RHOAI_MUST_GATHER_IMAGE="registry.redhat.io/rhoai/odh-must-gather-rhel9:${RHOAI_MUST_GATHER_TAG}"
              fi
              echo "ℹ️ RHOAI_MUST_GATHER_IMAGE=${RHOAI_MUST_GATHER_IMAGE}"

              # Group-test installs ODH (opendatahub-operator in openshift-operators), not
              # rhods-operator. Without OPERATOR_NAMESPACE, must-gather's gather script
              # probes for a rhods-operator Subscription, prints
              # "rhods-operator not detected. Skipping.", and exits 0 with empty caches.
              # Setting these env vars skips that probe (must-gather image unchanged).
              MG_ODH_ENV="export OPERATOR_NAMESPACE=openshift-operators; export APPLICATIONS_NAMESPACE=opendatahub; export MONITORING_NAMESPACE=opendatahub; export NOTEBOOK_NAMESPACE=opendatahub"

              # --- Run all three gathers in parallel ---
              # Each gather writes to its own destination directory and runs as a
              # background job so all three execute simultaneously, reducing wall-clock
              # time from ~25 min (sequential) to ~10 min (longest single gather).
              GATHER_PIDS=()
              GATHER_NAMES=()

              mkdir -p "${ARTIFACT_DIR}/gather-openshift"
              (
                oc adm must-gather --dest-dir "${ARTIFACT_DIR}/gather-openshift"
              ) &
              GATHER_PIDS+=($!)
              GATHER_NAMES+=("openshift")

              # aigateway-must-gather (MaaS CRs: aitenants, configs,
              # maasauthpolicies, maasmodelrefs, maassubscriptions, maastenantconfigs,
              # tenants, kuadrant TRLPs/RLPs, inference ExternalModel/Provider, etc.)
              mkdir -p "${ARTIFACT_DIR}/gather-aigateway"
              (
                oc adm must-gather --image="${RHOAI_MUST_GATHER_IMAGE}" \
                  --dest-dir "${ARTIFACT_DIR}/gather-aigateway" -- \
                  "${MG_ODH_ENV}; export COMPONENT=aigateway; /usr/bin/gather"
              ) &
              GATHER_PIDS+=($!)
              GATHER_NAMES+=("aigateway")

              # kserve-must-gather (LLMInferenceService / llmisvc and related serving CRs)
              mkdir -p "${ARTIFACT_DIR}/gather-kserve"
              (
                oc adm must-gather --image="${RHOAI_MUST_GATHER_IMAGE}" \
                  --dest-dir "${ARTIFACT_DIR}/gather-kserve" -- \
                  "${MG_ODH_ENV}; export COMPONENT=kserve; /usr/bin/gather"
              ) &
              GATHER_PIDS+=($!)
              GATHER_NAMES+=("kserve")

              # Wait for all gathers and report results
              FAILED=0
              for i in "${!GATHER_PIDS[@]}"; do
                if ! wait "${GATHER_PIDS[$i]}"; then
                  echo "❌ ${GATHER_NAMES[$i]} must-gather failed (continuing)"
                  FAILED=$((FAILED + 1))
                else
                  echo "✅ ${GATHER_NAMES[$i]} must-gather completed successfully"
                fi
              done
              echo "ℹ️ Must-gather complete: $((${#GATHER_PIDS[@]} - FAILED))/${#GATHER_PIDS[@]} succeeded"
          - name: git-push-artifacts
            onError: continue
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/secure-git-push/0.1/secure-git-push.yaml
            params:
              - name: source-path
                value: /workspace/artifacts-dir
              - name: repo-path
                value: 'opendatahub-io/odh-build-metadata'
              - name: repo-branch
                value: 'ci-artifacts'
              - name: sparse-file-path
                value: 'test-artifacts/docs'
              - name: dest-path
                value: 'test-artifacts/$(context.pipelineRun.name)'
              - name: pipelinerun-name
                value: $(context.pipelineRun.name)
          - name: fail-if-needed
            image: alpine
            volumeMounts:
              - name: test-status
                mountPath: /test-status
            script: |
              STATUS_FILE="/test-status/deploy-and-e2e-status"
              if ! [ -f "$STATUS_FILE" ] || [ "$(cat "$STATUS_FILE")" != "success" ]; then
                echo "❌ Failing pipeline because deploy-and-e2e step failed"
                exit 1
              fi
              echo "✅ deploy-and-e2e step succeeded"

  finally:
  - name: push-ci-artifacts-and-update-pr
    workspaces:
    - name: basic-auth
      workspace: git-auth
    params:
      - name: oci-artifacts-repo
        value: $(params.oci-artifacts-repo)
      - name: pipeline-status
        value: $(tasks.status)
    taskSpec:
      volumes:
        - name: odh-registry-secret-volume
          secret:
            secretName: odh-registry-secret
            items:
            - key: .dockerconfigjson
              path: oci-storage-dockerconfigjson
      workspaces:
        - name: basic-auth
          optional: true
      params:
        - name: oci-artifacts-repo
          description: oci-artifacts-repo
        - name: pipeline-status
          type: string
      steps:
        - name: pull-ci-artifacts
          onError: continue
          ref:
            resolver: git
            params:
              - name: url
                value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
              - name: revision
                value: main
              - name: pathInRepo
                value: stepactions/git-clone/0.1/git-clone.yaml
          params:
            - name: repo-path
              value: 'opendatahub-io/odh-build-metadata'
            - name: repo-branch
              value: 'ci-artifacts'
            - name: sparse-file-path
              value: 'test-artifacts/$(context.pipelineRun.name)'
            - name: dest-path
              value: /workspace/odh-ci-artifacts
            - name: artifacts-dir-path
              value: 'test-artifacts/$(context.pipelineRun.name)'
        - name: secure-push-oci
          onError: continue
          ref:
            resolver: git
            params:
              - name: url
                value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
              - name: revision
                value: main
              - name: pathInRepo
                value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
          params:
            - name: workdir-path
              value: '/workspace/odh-ci-artifacts/test-artifacts/$(context.pipelineRun.name)'
            - name: oci-ref
              value: $(params.oci-artifacts-repo):$(context.pipelineRun.name)
            - name: credentials-volume-name
              value: odh-registry-secret-volume
        - name: share-status-on-pull-request
          ref:
            resolver: git
            params:
              - name: url
                value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
              - name: revision
                value: main
              - name: pathInRepo
                value: stepactions/pull-request-comment/0.1/pull-request-comment.yaml
          params:
            - name: test-name
              value: $(context.pipelineRun.name)
            - name: oci-container
              value: $(params.oci-artifacts-repo):$(context.pipelineRun.name)
            - name: pipeline-aggregate-status
              value: $(params.pipeline-status)
            - name: pull-request-author
              value: $(tasks.audit-snapshot.results.pull-request-author)
            - name: pull-request-number
              value: $(tasks.audit-snapshot.results.pull-request-number)
            - name: git-repo
              value: $(tasks.audit-snapshot.results.git-repo)
            - name: git-org
              value: $(tasks.audit-snapshot.results.git-org)
            - name: git-revision
              value: $(tasks.audit-snapshot.results.git-revision)
            - name: artifact-browser-url
              value: $(params.artifact-browser-url)
        - name: cleanup-artifacts-from-git
          onError: continue
          ref:
            resolver: git
            params:
              - name: url
                value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
              - name: revision
                value: main
              - name: pathInRepo
                value: stepactions/cleanup-git-repo/0.1/cleanup-git-repo.yaml
          params:
            - name: work-dir
              value: '/workspace/odh-ci-artifacts'
            - name: artifacts-dir-path
              value: 'test-artifacts'
            - name: dir-to-be-deleted
              value: '$(context.pipelineRun.name)'
  workspaces:
  - name: git-auth
    optional: true

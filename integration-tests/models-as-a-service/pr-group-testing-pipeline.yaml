---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: odh-pr-test-maas
spec:
  description: |
    A group integration test which provisions an ephemeral Hypershift cluster and runs the
    MaaS e2e tests using images for odh-maas-api-ci, odh-maas-controller-ci, and
    odh-maas-discovery-ci built from the same pull request commit.

    Smoke deploy sets MAAS_DISCOVERY_ENABLED=true so odh-maas-discovery runs in-cluster for this
    pipeline (snapshots require maas-discovery-ci; discovery is part of the default group-test deploy).
  params:
    - description: List of components in the group
      name: group-components
      type: string
    - name: oci-artifacts-repo
      default: 'quay.io/opendatahub/odh-ci-artifacts'
      description: The OCI container used to store all test artifacts.
    - name: artifact-browser-url
      default: 'https://app-artifact-browser.apps.rosa.konflux-qe.zmr9.p3.openshiftapps.com'
      description: The OCI container used to store all test artifacts.
    - name: rhoai-must-gather-tag
      type: string
      default: 'v3.5.0'
      description: >
        Tag for the official RHOAI must-gather image
        registry.redhat.io/rhoai/odh-must-gather-rhel9:<tag>.
        Ignored when rhoai-must-gather-image is set.
    - name: rhoai-must-gather-image
      type: string
      default: ''
      description: >
        Optional full must-gather image override (e.g. quay pre-release).
        When empty, uses registry.redhat.io/rhoai/odh-must-gather-rhel9:<tag>.
    - name: gather-on-success
      type: string
      default: 'false'
      description: >
        Run must-gather even when e2e tests pass. Set to "true" when you
        need cluster logs from a successful run for validation. When "false"
        (default), must-gather is skipped on success to save ~20-25 min.
    - name: ocp-version
      type: string
      default: "4.22"
      description: OpenShift minor version for the ephemeral HyperShift cluster.
    - name: compute-node-type
      type: string
      default: m5.2xlarge
      description: AWS instance type for ephemeral HyperShift worker nodes.
    - name: hypershift-node-count
      type: string
      default: "3"
      description: Number of worker nodes for the ephemeral HyperShift cluster.
    - name: hosted-management-cluster
      type: string
      default: hosted-mgmt2
      description: Hosted management cluster used to provision the ephemeral cluster.
    - name: tls-pqc-check
      type: string
      default: "true"
      description: When "true", run openshift tls-scanner with --pqc-check after smoke e2e.
    - name: tls-scan-namespaces
      type: string
      default: "opendatahub,odh-ai-gateway-infra"
      description: Comma-separated namespaces for tls-scanner --namespace-filter.
    - name: tls-component-filter
      type: string
      default: "maas-api,maas-controller,maas-discovery,odh-maas-discovery,ai-gateway-operator,ai-gateway-controller"
      description: Comma-separated component filter passed to tls-scanner (include odh-maas-discovery alias for discovery image).
    - name: tls-scanner-image
      type: string
      default: "registry.ci.openshift.org/ocp/4.22:tls-scanner-tool"
      description: tls-scanner container image (align with params.ocp-version when possible).
    - name: tls-scanner-pod-namespace
      type: string
      default: opendatahub
      description: Namespace for the in-cluster tls-scanner pod (opendatahub allows maas-api:8443 when labeled maas-api-e2e-probe).
    - name: tls-pqc-required-ports
      type: string
      default: "8443,9443"
      description: Ports for the post-scan TLS 1.3 + ML-KEM check. Each scanned tls-component-filter entry needs at least one PQC-ready result on these ports.
    - name: odh-konflux-central-revision
      type: string
      default: main
      description: Git branch, tag, or 40-char commit SHA of odh-konflux-central for tls-scanner-run.sh (SHA uses fetch+checkout, not git clone --branch).
    - name: odh-konflux-central-git-url
      type: string
      default: "https://github.com/opendatahub-io/odh-konflux-central.git"
      description: Git remote for tls-scanner-run.sh (use your fork URL while testing a konflux PR branch).
  tasks:
    - name: generate-snapshot
      description: Generate a composite snapshot containing images for all group components
      params:
        - name: COMPONENTS
          value: $(params.group-components)
      workspaces:
      - name: basic-auth
        workspace: git-auth
      taskRef:
        resolver: git
        params:
        - name: url
          value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
        - name: revision
          value: main
        - name: pathInRepo
          value: konflux-tekton-tasks/generate-snapshot-for-group-testing/0.1/generate-snapshot-for-group-testing.yaml
    - name: audit-snapshot
      runAfter:
        - generate-snapshot
      params:
        - name: COMPONENTS
          value: $(params.group-components)
      taskSpec:
        params:
          - name: COMPONENTS
            description: List of components in the group
        results:
        - name: pull-request-author
        - name: pull-request-number
        - name: git-repo
        - name: git-org
        - name: git-revision
        steps:
          - name: audit-snapshot
            image: quay.io/konflux-ci/konflux-test:stable
            workingDir: /workspace
            env:
              - name: SNAPSHOT
                value: $(tasks.generate-snapshot.results.SNAPSHOT)
              - name: COMPONENTS
                value: $(params.COMPONENTS)
              - name: PR_AUTHOR
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/sender']
              - name: PR_NUMBER
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['pipelinesascode.tekton.dev/pull-request']
              - name: GIT_REPO
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/url-repository']
              - name: GIT_ORG
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/url-org']
              - name: GIT_REVISION
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['pipelinesascode.tekton.dev/sha']
            script: |
              #!/bin/bash
              set -e
              echo "SNAPSHOT=${SNAPSHOT}"

              # Parse JSON and iterate through each component
              while IFS= read -r row; do
                  COMPONENT_NAME=$(echo "$row" | base64 -d | jq -r '.key')
                  IMAGE=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name].image' <<< "${SNAPSHOT}")
                  GIT_COMMIT=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.commit"' <<< "${SNAPSHOT}")
                  GIT_URL=$(jq -r --arg component_name "${COMPONENT_NAME}" '.[$component_name]."git.url"' <<< "${SNAPSHOT}")
                  if [ -z "${IMAGE}" ] || [ "${IMAGE}" = "null" ] || \
                     [ -z "${GIT_COMMIT}" ] || [ "${GIT_COMMIT}" = "null" ] || \
                     [ -z "${GIT_URL}" ] || [ "${GIT_URL}" = "null" ]; then
                      echo "ERROR: snapshot metadata missing for ${COMPONENT_NAME}" >&2
                      exit 1
                  fi
                  echo "${COMPONENT_NAME} IMAGE: ${IMAGE}"
                  echo "GIT_COMMIT=${GIT_COMMIT}"
                  echo "GIT_URL=${GIT_URL}"
              done < <(echo "$COMPONENTS" | jq -r 'to_entries[] | @base64')

              echo -n "${PR_AUTHOR}" > "$(results.pull-request-author.path)"
              echo -n "${PR_NUMBER}" > "$(results.pull-request-number.path)"
              echo -n "${GIT_REPO}" > "$(results.git-repo.path)"
              echo -n "${GIT_ORG}" > "$(results.git-org.path)"
              echo -n "${GIT_REVISION}" > "$(results.git-revision.path)"

    - name: provision-cluster
      runAfter:
        - audit-snapshot
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: "9751a2028f2b3b88e4204d5c42de8eda4ebb466f"
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 1h
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.ocp-version)","architecture":"multi"}}}
        - name: env
          value: '{"COMPUTE_NODE_TYPE":"$(params.compute-node-type)","HYPERSHIFT_NODE_COUNT":"$(params.hypershift-node-count)","HOSTED_MANAGEMENT_CLUSTER":"$(params.hosted-management-cluster)"}'
    - name: e2e-maas-openshift
      timeout: 2h30m
      workspaces:
      - name: basic-auth
        workspace: git-auth
      runAfter:
        - provision-cluster
      params:
        - name: rhoai-must-gather-tag
          value: $(params.rhoai-must-gather-tag)
        - name: rhoai-must-gather-image
          value: $(params.rhoai-must-gather-image)
        - name: gather-on-success
          value: $(params.gather-on-success)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: rhoai-must-gather-tag
            type: string
            default: 'v3.5.0'
            description: Tag for registry.redhat.io/rhoai/odh-must-gather-rhel9
          - name: rhoai-must-gather-image
            type: string
            default: ''
            description: Optional full must-gather image override
          - name: gather-on-success
            type: string
            default: 'false'
            description: Run must-gather even when e2e tests pass
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          - name: test-status
            emptyDir: {}
        workspaces:
          - name: basic-auth
            optional: true
        steps:
          - name: clone-repo
            image: alpine/git
            env:
            - name: source_branch
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['pipelinesascode.tekton.dev/source-branch']
            - name: repo_url
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['pipelinesascode.tekton.dev/source-repo-url']
            script: |
              echo "${source_branch}"
              echo "${repo_url}"
              git clone --depth 50 --no-single-branch "${repo_url}" /workspace/source
              git config --global --add safe.directory /workspace/source
              cd /workspace/source
              git checkout "${source_branch}"
          - name: e2e-maas
            onError: continue
            image: quay.io/rhoai/rhoai-task-toolset:maas
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: ARTIFACT_DIR
                value: /workspace/artifacts-dir
              - name: SNAPSHOT
                value: $(tasks.generate-snapshot.results.SNAPSHOT)
            workingDir: /workspace/source
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: test-status
                mountPath: /test-status
            script: |
              set -euxo pipefail

              STATUS_FILE="/test-status/deploy-and-e2e-status"
              E2E_SMOKE_STATUS="/test-status/e2e-smoke-status"
              echo "failed" > "$STATUS_FILE"
              echo "failed" > "$E2E_SMOKE_STATUS"

              export MAAS_API_IMAGE=$(jq -r '."odh-maas-api-ci".image' <<< "${SNAPSHOT}")
              export MAAS_CONTROLLER_IMAGE=$(jq -r '."odh-maas-controller-ci".image' <<< "${SNAPSHOT}")
              export MAAS_DISCOVERY_IMAGE=$(jq -r '."odh-maas-discovery-ci".image' <<< "${SNAPSHOT}")
              # Enable MaaS discovery in smoke so odh-maas-discovery is deployed (snapshot includes odh-maas-discovery-ci; TLS filter expects maas-discovery/odh-maas-discovery).
              export MAAS_DISCOVERY_ENABLED="true"

              MAAS_API_TAG=$(jq -r '."odh-maas-api-ci".image_tag' <<< "${SNAPSHOT}")
              MAAS_CONTROLLER_TAG=$(jq -r '."odh-maas-controller-ci".image_tag' <<< "${SNAPSHOT}")
              MAAS_DISCOVERY_TAG=$(jq -r '."odh-maas-discovery-ci".image_tag' <<< "${SNAPSHOT}")

              if [ -z "${MAAS_API_TAG}" ] || [ "${MAAS_API_TAG}" = "null" ] || \
                 [ -z "${MAAS_CONTROLLER_TAG}" ] || [ "${MAAS_CONTROLLER_TAG}" = "null" ] || \
                 [ -z "${MAAS_DISCOVERY_TAG}" ] || [ "${MAAS_DISCOVERY_TAG}" = "null" ]; then
                set +x
                echo "❌ ERROR: image_tag missing for odh-maas-api-ci, odh-maas-controller-ci, or odh-maas-discovery-ci in SNAPSHOT" >&2
                exit 1
              fi

              set +x
              echo ""
              echo "=========================================="
              echo "  ✅ Snapshot images resolved"
              echo "=========================================="
              echo "  API:        ${MAAS_API_IMAGE%%@*}:${MAAS_API_TAG}"
              echo "              digest: ${MAAS_API_IMAGE#*@}"
              echo "  Controller: ${MAAS_CONTROLLER_IMAGE%%@*}:${MAAS_CONTROLLER_TAG}"
              echo "              digest: ${MAAS_CONTROLLER_IMAGE#*@}"
              echo "  Discovery:  ${MAAS_DISCOVERY_IMAGE%%@*}:${MAAS_DISCOVERY_TAG}"
              echo "              digest: ${MAAS_DISCOVERY_IMAGE#*@}"
              echo "=========================================="
              echo ""
              set -x

              ./test/e2e/scripts/prow_run_smoke_test.sh

              echo "success" > "$E2E_SMOKE_STATUS"
              echo "success" > "$STATUS_FILE"
          - name: tls-pqc-scan
            onError: continue
            image: quay.io/rhoai/rhoai-task-toolset:maas
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: ARTIFACT_DIR
                value: /workspace/artifacts-dir
              - name: TLS_PQC_CHECK
                value: $(params.tls-pqc-check)
              - name: TLS_SCAN_NAMESPACES
                value: $(params.tls-scan-namespaces)
              - name: TLS_COMPONENT_FILTER
                value: $(params.tls-component-filter)
              - name: PULL_SPEC_TLS_SCANNER_TOOL
                value: $(params.tls-scanner-image)
              - name: TLS_SCANNER_POD_NAMESPACE
                value: $(params.tls-scanner-pod-namespace)
              - name: TLS_PQC_REQUIRED_PORTS
                value: $(params.tls-pqc-required-ports)
              - name: ODH_KONFLUX_CENTRAL_REVISION
                value: $(params.odh-konflux-central-revision)
              - name: ODH_KONFLUX_CENTRAL_GIT_URL
                value: $(params.odh-konflux-central-git-url)
            workingDir: /workspace/source
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: test-status
                mountPath: /test-status
            script: |
              set -euxo pipefail

              STATUS_FILE="/test-status/deploy-and-e2e-status"
              E2E_SMOKE_STATUS="/test-status/e2e-smoke-status"
              E2E_STATUS=$(cat "${E2E_SMOKE_STATUS}" 2>/dev/null || cat "${STATUS_FILE}" 2>/dev/null || echo "failed")
              if [ "${E2E_STATUS}" != "success" ]; then
                echo "Smoke e2e status is ${E2E_STATUS}; continuing with TLS scan (tls-pqc-check=${TLS_PQC_CHECK})"
              fi

              if [ "${TLS_PQC_CHECK}" != "true" ]; then
                echo "TLS PQC scan disabled (tls-pqc-check=${TLS_PQC_CHECK})"
                echo "skipped" > "/test-status/tls-scan-status"
                exit 0
              fi

              echo "failed" > "/test-status/tls-scan-status"

              if [ "${E2E_STATUS}" = "success" ]; then
                echo "failed" > "$STATUS_FILE"
              fi

              mkdir -p "${ARTIFACT_DIR}"
              export PQC_CHECK="true"
              export SCAN_NAMESPACE="${TLS_SCAN_NAMESPACES}"
              export COMPONENT_FILTER="${TLS_COMPONENT_FILTER}"
              export SHARED_DIR="${ARTIFACT_DIR}/shared"
              export SCANNER_CPU="${SCANNER_CPU:-4}"
              export SCANNER_MEMORY="${SCANNER_MEMORY:-4Gi}"
              export SCANNER_NAMESPACE="${TLS_SCANNER_POD_NAMESPACE}"
              export SCANNER_MAAS_API_E2E_PROBE="true"
              mkdir -p "${SHARED_DIR}"

              ODH_KONFLUX_GIT_CLONE_TIMEOUT="${ODH_KONFLUX_GIT_CLONE_TIMEOUT:-120s}"
              rm -rf /tmp/odh-konflux-central
              set +e
              if [[ "${ODH_KONFLUX_CENTRAL_REVISION}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                timeout "${ODH_KONFLUX_GIT_CLONE_TIMEOUT}" git clone --depth 1 "${ODH_KONFLUX_CENTRAL_GIT_URL}" /tmp/odh-konflux-central
                CLONE_EXIT=$?
                if [ "${CLONE_EXIT}" -eq 0 ]; then
                  git -C /tmp/odh-konflux-central fetch --depth 1 origin "${ODH_KONFLUX_CENTRAL_REVISION}"
                  CLONE_EXIT=$?
                fi
                if [ "${CLONE_EXIT}" -eq 0 ]; then
                  git -C /tmp/odh-konflux-central checkout "${ODH_KONFLUX_CENTRAL_REVISION}"
                  CLONE_EXIT=$?
                fi
              else
                timeout "${ODH_KONFLUX_GIT_CLONE_TIMEOUT}" git clone --depth 1 --branch "${ODH_KONFLUX_CENTRAL_REVISION}" \
                  "${ODH_KONFLUX_CENTRAL_GIT_URL}" /tmp/odh-konflux-central
                CLONE_EXIT=$?
              fi
              set -e
              if [ "${CLONE_EXIT}" -ne 0 ]; then
                echo "git clone for tls-scanner failed or timed out (exit ${CLONE_EXIT})" >&2
                echo "failed" > "$STATUS_FILE"
                echo "failed" > "/test-status/tls-scan-status"
                exit "${CLONE_EXIT}"
              fi
              set +e
              bash /tmp/odh-konflux-central/integration-tests/models-as-a-service/tls-scanner-run.sh
              TLS_EXIT=$?
              set -e
              if [ "${TLS_EXIT}" -ne 0 ]; then
                echo "failed" > "$STATUS_FILE"
                echo "failed" > "/test-status/tls-scan-status"
                exit "${TLS_EXIT}"
              fi

              set +e
              export TLS_COMPONENT_FILTER
              export TLS_PQC_REQUIRED_PORTS
              python3 /tmp/odh-konflux-central/integration-tests/models-as-a-service/validate-maas-tls-pqc-results.py
              VALIDATE_EXIT=$?
              set -e
              if [ "${VALIDATE_EXIT}" -ne 0 ]; then
                echo "failed" > "$STATUS_FILE"
                echo "failed" > "/test-status/tls-scan-status"
                exit "${VALIDATE_EXIT}"
              fi

              echo "success" > "/test-status/tls-scan-status"
              if [ "${E2E_STATUS}" = "success" ]; then
                echo "success" > "$STATUS_FILE"
              else
                echo "ℹ️ TLS scan succeeded; pipeline will still fail on smoke (e2e-smoke-status=${E2E_STATUS})"
              fi
          - name: must-gather
            onError: continue
            image: quay.io/rhoai/rhoai-task-toolset:maas
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: ARTIFACT_DIR
                value: /workspace/artifacts-dir
              - name: RHOAI_MUST_GATHER_TAG
                value: $(params.rhoai-must-gather-tag)
              - name: RHOAI_MUST_GATHER_IMAGE_OVERRIDE
                value: $(params.rhoai-must-gather-image)
              - name: GATHER_ON_SUCCESS
                value: $(params.gather-on-success)
            workingDir: /workspace/source
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: test-status
                mountPath: /test-status
            script: |
              set -uxo pipefail

              # --- Conditional skip: only gather on failure or when explicitly requested ---
              STATUS_FILE="/test-status/deploy-and-e2e-status"
              E2E_STATUS=$(cat "${STATUS_FILE}" 2>/dev/null || echo "failed")
              echo "ℹ️ e2e test status: ${E2E_STATUS}"
              echo "ℹ️ gather-on-success: ${GATHER_ON_SUCCESS}"

              if [ "${E2E_STATUS}" = "success" ] && [ "${GATHER_ON_SUCCESS}" != "true" ]; then
                echo "✅ E2E passed and gather-on-success is not enabled — skipping must-gather"
                exit 0
              fi

              if [ -n "${RHOAI_MUST_GATHER_IMAGE_OVERRIDE}" ]; then
                RHOAI_MUST_GATHER_IMAGE="${RHOAI_MUST_GATHER_IMAGE_OVERRIDE}"
              else
                RHOAI_MUST_GATHER_IMAGE="registry.redhat.io/rhoai/odh-must-gather-rhel9:${RHOAI_MUST_GATHER_TAG}"
              fi
              echo "ℹ️ RHOAI_MUST_GATHER_IMAGE=${RHOAI_MUST_GATHER_IMAGE}"

              # Group-test installs ODH (opendatahub-operator in openshift-operators), not
              # rhods-operator. Without OPERATOR_NAMESPACE, must-gather's gather script
              # probes for a rhods-operator Subscription, prints
              # "rhods-operator not detected. Skipping.", and exits 0 with empty caches.
              # Setting these env vars skips that probe (must-gather image unchanged).
              MG_ODH_ENV="export OPERATOR_NAMESPACE=openshift-operators; export APPLICATIONS_NAMESPACE=opendatahub; export MONITORING_NAMESPACE=opendatahub; export NOTEBOOK_NAMESPACE=opendatahub"

              # --- Run both gathers in parallel with a hard timeout each ---
              # The timeout runs INSIDE the gather pod, around /usr/bin/gather,
              # so a hung collector terminates and oc still copies whatever was
              # already collected. The outer timeout is only a backstop in case
              # oc itself hangs (e.g. dead cluster API).
              GATHER_TIMEOUT="25m"
              GATHER_PIDS=()
              GATHER_NAMES=()

              # Default OpenShift must-gather (infra-level data)
              mkdir -p "${ARTIFACT_DIR}/gather-openshift"
              (
                timeout 30m oc adm must-gather \
                  --dest-dir "${ARTIFACT_DIR}/gather-openshift" -- \
                  "timeout ${GATHER_TIMEOUT} /usr/bin/gather || echo 'gather timed out or failed; copying partial data'"
              ) &
              GATHER_PIDS+=($!)
              GATHER_NAMES+=("openshift")

              # Single RHOAI must-gather without COMPONENT (defaults to "all"):
              # combines the previous aigateway and kserve runs into one pod,
              # avoiding the duplicate namespace/log collection and saving space.
              mkdir -p "${ARTIFACT_DIR}/gather-rhoai"
              (
                timeout 30m oc adm must-gather \
                  --image="${RHOAI_MUST_GATHER_IMAGE}" \
                  --dest-dir "${ARTIFACT_DIR}/gather-rhoai" -- \
                  "${MG_ODH_ENV}; timeout ${GATHER_TIMEOUT} /usr/bin/gather || echo 'gather timed out or failed; copying partial data'"
              ) &
              GATHER_PIDS+=($!)
              GATHER_NAMES+=("rhoai")

              # Wait for all gathers and report results
              FAILED=0
              for i in "${!GATHER_PIDS[@]}"; do
                if ! wait "${GATHER_PIDS[$i]}"; then
                  echo "❌ ${GATHER_NAMES[$i]} must-gather failed (continuing)"
                  FAILED=$((FAILED + 1))
                else
                  echo "✅ ${GATHER_NAMES[$i]} must-gather completed successfully"
                fi
              done
              echo "ℹ️ Must-gather complete: $((${#GATHER_PIDS[@]} - FAILED))/${#GATHER_PIDS[@]} succeeded"
          - name: git-push-artifacts
            onError: continue
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/secure-git-push/0.1/secure-git-push.yaml
            params:
              - name: source-path
                value: /workspace/artifacts-dir
              - name: repo-path
                value: 'opendatahub-io/odh-build-metadata'
              - name: repo-branch
                value: 'ci-artifacts'
              - name: sparse-file-path
                value: 'test-artifacts/docs'
              - name: dest-path
                value: 'test-artifacts/$(context.pipelineRun.name)'
              - name: pipelinerun-name
                value: $(context.pipelineRun.name)
          - name: fail-if-needed
            image: alpine
            volumeMounts:
              - name: test-status
                mountPath: /test-status
            script: |
              STATUS_FILE="/test-status/deploy-and-e2e-status"
              E2E_SMOKE=$(cat /test-status/e2e-smoke-status 2>/dev/null || echo "unknown")
              if [ -f /test-status/tls-scan-status ]; then
                TLS_RAW=$(tr -d '[:space:]' </test-status/tls-scan-status)
                TLS_STATUS_DISPLAY="${TLS_RAW}"
              else
                TLS_RAW="failed"
                TLS_STATUS_DISPLAY="missing (tls step did not write status — e.g. task timeout before tls-pqc-scan)"
              fi
              FAIL=0
              if [ "${E2E_SMOKE}" != "success" ]; then
                FAIL=1
              fi
              if [ "${TLS_RAW}" = "failed" ]; then
                FAIL=1
              fi
              if [ "${FAIL}" -ne 0 ] || ! [ -f "$STATUS_FILE" ] || [ "$(cat "$STATUS_FILE")" != "success" ]; then
                echo "❌ Failing pipeline (e2e-smoke-status=${E2E_SMOKE}, tls-scan-status=${TLS_STATUS_DISPLAY}, deploy-and-e2e-status=$(cat "$STATUS_FILE" 2>/dev/null || echo missing))"
                exit 1
              fi
              if [ "${TLS_RAW}" = "success" ]; then
                echo "✅ deploy, e2e smoke, and TLS PQC scan succeeded"
              elif [ "${TLS_RAW}" = "skipped" ]; then
                echo "✅ deploy and e2e smoke succeeded (TLS PQC scan disabled)"
              else
                echo "✅ deploy and e2e smoke succeeded (unexpected tls-scan-status=${TLS_RAW})"
              fi

  finally:
  - name: push-ci-artifacts-and-update-pr
    workspaces:
    - name: basic-auth
      workspace: git-auth
    params:
      - name: oci-artifacts-repo
        value: $(params.oci-artifacts-repo)
      - name: pipeline-status
        value: $(tasks.status)
    taskSpec:
      volumes:
        - name: odh-registry-secret-volume
          secret:
            secretName: odh-registry-secret
            items:
            - key: .dockerconfigjson
              path: oci-storage-dockerconfigjson
      workspaces:
        - name: basic-auth
          optional: true
      params:
        - name: oci-artifacts-repo
          description: oci-artifacts-repo
        - name: pipeline-status
          type: string
      steps:
        - name: pull-ci-artifacts
          onError: continue
          ref:
            resolver: git
            params:
              - name: url
                value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
              - name: revision
                value: main
              - name: pathInRepo
                value: stepactions/git-clone/0.1/git-clone.yaml
          params:
            - name: repo-path
              value: 'opendatahub-io/odh-build-metadata'
            - name: repo-branch
              value: 'ci-artifacts'
            - name: sparse-file-path
              value: 'test-artifacts/$(context.pipelineRun.name)'
            - name: dest-path
              value: /workspace/odh-ci-artifacts
            - name: artifacts-dir-path
              value: 'test-artifacts/$(context.pipelineRun.name)'
        - name: secure-push-oci
          onError: continue
          ref:
            resolver: git
            params:
              - name: url
                value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
              - name: revision
                value: main
              - name: pathInRepo
                value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
          params:
            - name: workdir-path
              value: '/workspace/odh-ci-artifacts/test-artifacts/$(context.pipelineRun.name)'
            - name: oci-ref
              value: $(params.oci-artifacts-repo):$(context.pipelineRun.name)
            - name: credentials-volume-name
              value: odh-registry-secret-volume
        - name: share-status-on-pull-request
          ref:
            resolver: git
            params:
              - name: url
                value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
              - name: revision
                value: main
              - name: pathInRepo
                value: stepactions/pull-request-comment/0.1/pull-request-comment.yaml
          params:
            - name: test-name
              value: $(context.pipelineRun.name)
            - name: oci-container
              value: $(params.oci-artifacts-repo):$(context.pipelineRun.name)
            - name: pipeline-aggregate-status
              value: $(params.pipeline-status)
            - name: pull-request-author
              value: $(tasks.audit-snapshot.results.pull-request-author)
            - name: pull-request-number
              value: $(tasks.audit-snapshot.results.pull-request-number)
            - name: git-repo
              value: $(tasks.audit-snapshot.results.git-repo)
            - name: git-org
              value: $(tasks.audit-snapshot.results.git-org)
            - name: git-revision
              value: $(tasks.audit-snapshot.results.git-revision)
            - name: artifact-browser-url
              value: $(params.artifact-browser-url)
        - name: cleanup-artifacts-from-git
          onError: continue
          ref:
            resolver: git
            params:
              - name: url
                value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
              - name: revision
                value: main
              - name: pathInRepo
                value: stepactions/cleanup-git-repo/0.1/cleanup-git-repo.yaml
          params:
            - name: work-dir
              value: '/workspace/odh-ci-artifacts'
            - name: artifacts-dir-path
              value: 'test-artifacts'
            - name: dir-to-be-deleted
              value: '$(context.pipelineRun.name)'
  workspaces:
  - name: git-auth
    optional: true

---
# Manual test Snapshot for rhoai-e2e integration scenario.
# Creates a Snapshot to trigger the ITS pipeline without waiting for a real build.
#
# containerImage below is used only for manual ``oc create -f`` and as a rhoai/odh
# fallback when ``rhoai_e2e.py`` cannot resolve the latest Konflux build. It is
# NOT used for default ``--omit-product`` triggers (SNAPSHOT omits containerImage;
# extract-fbcf-image records n/a).
#
# Pinned fallback: RHOAI 3.5 EA2 (rhoai-v3-5-ea-2), OCP 4.21 (rhoai-fbc-fragment-ocp-421).
# rhoai_e2e.py resolves latest Konflux snapshots when ``--product rhoai``; this digest is
# used only when lookup fails. Updated 2026-07 (3.5 EA2 stage push).
#
# Prerequisites:
#   1. The ITS CR must already be applied:
#      oc apply -n rhoai-tenant -f integration-tests/rhoai-e2e/tekton/its/its-rhoai-e2e-ephc-ocp421.yaml
#
# Usage:
#   oc create -n rhoai-tenant -f integration-tests/rhoai-e2e/config/test-snapshot.yaml
#
# To always use the very latest Konflux-built image, run this first:
#   LATEST=$(oc get snapshots -n rhoai-tenant \
#     --sort-by=.metadata.creationTimestamp \
#     -l appstudio.openshift.io/application=rhoai-fbc-fragment-ocp-421 \
#     -o jsonpath='{.items[-1].spec.components[0].containerImage}')
#   sed "s|containerImage:.*|containerImage: $LATEST|" \
#     integration-tests/rhoai-e2e/config/test-snapshot.yaml | oc create -n rhoai-tenant -f -
#
# After creation, Konflux detects the Snapshot and triggers a PipelineRun for
# every matching IntegrationTestScenario on spec.application (and Enterprise Contract
# may add separate runs). Prefer ``python3 integration-tests/rhoai-e2e/rhoai_e2e.py`` (prunes legacy ITS by
# default for rhoai-tenant + testops-playpen) or run ``python3 integration-tests/rhoai-e2e/runners/report/prune_stale_testops_its.py`` first.
# ``rhoai_e2e.py`` annotates trigger command/type (``rhoai-e2e.*``) and adds ``source.git`` on
# Snapshot components so Konflux Reference uses an https URL (never raw Quay pullspecs).
# Watch the rhoai-e2e run:
#   oc get pipelineruns -n rhoai-tenant | grep rhoai-e2e
#   or via the Konflux UI:
#   https://konflux-ui.apps.<cluster-domain>/ns/rhoai-tenant/applications/testops-playpen/activity/pipelineruns
apiVersion: appstudio.redhat.com/v1alpha1
kind: Snapshot
metadata:
  generateName: test-rhoai-e2e-snap-
  namespace: rhoai-tenant
spec:
  application: testops-playpen
  components:
    - name: rhoai-fbc-fragment-ocp-421
      containerImage: quay.io/rhoai/rhoai-fbc-fragment@sha256:6f8c6350ec16320668c7977c12219b2170432fff4d3626ca82dfc4ed909b7405
      source:
        git:
          url: https://github.com/opendatahub-io/odh-konflux-central.git
          revision: "main"

# Reusable Tekton step snippets for rhoai-e2e-pipeline.yaml.
# Full reference: README.md#pipeline-snippets-rhoai-e2e-pipeline-snippetsyaml
#
# Per-component test steps are defined in task-component-pytest.yaml (taskRef from test-* pipeline tasks).
# Copy the anchors below into PipelineTask step lists.
# workspace mount paths to match your task (repo clone dir may be /workspace/repo
# or /workspace/scripts-repo).

# --- clone-scripts-repo (shallow git fetch; odh-konflux-central or fork) ---
clone-scripts-repo: |
  #!/bin/bash
  set -euo pipefail
  rm -rf "${DEST_DIR}" && mkdir -p "${DEST_DIR}" && cd "${DEST_DIR}"
  git init -q && git remote add origin "${REPO_URL}"
  git fetch --depth=1 origin "${REPO_REV}" && git checkout -q FETCH_HEAD
  # Env: REPO_URL, REPO_REV, DEST_DIR (e.g. /workspace/repo)

# --- run rhoai-e2e helper (``python -m helpers.<area>.<module>`` from OLMINSTALL_DIR) ---
run-rhoai-e2e-helper: |
  #!/usr/bin/env python3
  import os
  import sys

  operator_install_dir = os.environ["OLMINSTALL_DIR"]  # upstream clone e.g. /workspace/olminstall
  os.chdir(operator_install_dir)
  os.execvp(sys.executable, [sys.executable, "-m", "helpers.<module>"])

# --- stage target-cluster kubeconfig at /credentials/kubeconfig ---
# Implemented by steps/stage_kubeconfig_for_task.py (EPHC vs external cluster).
prepare-kubeconfig-ephc: |
  #!/usr/bin/env python3
  import os
  import sys

  rhoai_e2e_dir = "/workspace/repo/integration-tests/rhoai-e2e"
  os.chdir(rhoai_e2e_dir)
  os.environ["EPHC_KUBECONFIG_REL"] = "$(steps.get-kubeconfig.results.kubeconfig)"
  os.execvp(sys.executable, [sys.executable, "-m", "steps.stage_kubeconfig_for_task"])
  # Requires volumeMount: credentials → /credentials
  # Sets KUBECONFIG target: /credentials/kubeconfig from EPHC get-kubeconfig step result.

prepare-kubeconfig-external: |
  #!/usr/bin/env python3
  import os
  import sys

  rhoai_e2e_dir = "/workspace/repo/integration-tests/rhoai-e2e"
  os.chdir(rhoai_e2e_dir)
  os.environ["CLUSTER_SOURCE"] = "$(params.CLUSTER_SOURCE)"
  os.execvp(sys.executable, [sys.executable, "-m", "steps.stage_kubeconfig_for_task"])
  # Env: CLUSTER_SOURCE — EPHC or tenant Secret name (key kubeconfig)
  # Writes /credentials/kubeconfig for downstream install/test steps (KUBECONFIG=/credentials/kubeconfig).

# --- write-konflux-task-summary finally (per-task Konflux Results TASK_MESSAGE) ---
# Set SCRIPTS_REPO_ROOT to the rhoai-e2e checkout for this task (workspace clone or /workspace/repo).
write-konflux-task-summary-finally: |
  finally:
    - name: write-konflux-task-summary
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
        - name: PIPELINE_TASK
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tekton.dev/pipelineTask']
        - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
        exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh"
  # EPHC provision-space has no scripts workspace: shallow-clone SCRIPTS_REPO_* then exec runner above.

# --- pipeline-run-summary dispatcher (single image, three sub-steps) ---
pipeline-run-summary-step: |
  #!/usr/bin/env python3
  import os
  import sys

  rhoai_e2e_dir = "/workspace/repo/integration-tests/rhoai-e2e"
  os.chdir(rhoai_e2e_dir)
  os.environ["RHOAI_E2E_SUMMARY_STEP"] = "gather"  # gather | collect-ui | patch
  os.execvp(sys.executable, [sys.executable, "-m", "steps.pipeline_run_summary_steps"])

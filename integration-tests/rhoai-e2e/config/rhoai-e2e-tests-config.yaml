# Olminstall Konflux pipeline — declarative test phases (BVT, component smoke, tier1 placeholder).
# Used by:
#   - rhoai_e2e.py (--tests / --tests-config) to validate the ITS param TESTS
#   - Tekton task parse-pipeline-tests (after cloning SCRIPTS_REPO) to set RUN_SMOKE / RUN_BVT / RUN_TIER1
#
# Adding a phase: extend this file, then wire matching Pipeline tasks + when: in
# rhoai-e2e-pipeline.yaml (pipeline cannot discover arbitrary phases without code).
# Phases may set requiredInSelection: true to force them into every TESTS value (optional).
#
# schemaVersion bumps when structure changes (tools may reject unknown versions).
schemaVersion: 1

# OCI artifact browser layout for publish-results (JUnit + logs only; not tool binaries).
artifactUpload:
  ociSubdir: test-payload-results
  includePatterns:
    - "*.xml"
    - "*.log"
    - "*.console.log"

phases:
  - id: bvt
    description: opendatahub-tests pytest markers cluster_health and operator_health.
    default: true
    setsPipelineResults:
      RUN_BVT: true

  - id: smoke
    description: >
      Per-component smoke suites (see rhoai-e2e-components-smoke.yaml and COMPONENTS param).
      Requires a workload cluster with installation when PRODUCT is rhoai/odh (EPHC or external kubeconfig).
    requiredInSelection: false
    default: true
    setsPipelineResults:
      RUN_SMOKE: true

  - id: tier1
    description: Per-component tier1 pytest (combined with smoke in one run when both are in TEST_GATES).
    default: false
    setsPipelineResults:
      RUN_TIER1: true

# Clone pull-secret-quay from openshift-config into every new namespace (Jenkins ROSA HCP).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-secrets
spec:
  rules:
    - name: sync-pull-secret-quay
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - kube-system
                      - kube-public
                      - kube-node-lease
                      - openshift-config
                      - openshift-operator-lifecycle-manager
                      - openshift-marketplace
                      - openshift-operators
                      - openshift-monitoring
                      - openshift-ingress
                      - openshift-authentication
                      - openshift-console
                      - openshift-apiserver
                      - openshift-dns
                      - openshift-image-registry
                      - default
      generate:
        apiVersion: v1
        kind: Secret
        name: pull-secret-quay
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        clone:
          namespace: openshift-config
          name: pull-secret-quay

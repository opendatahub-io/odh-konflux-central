# Rewrite registry.redhat.io/rhoai pulls to quay.io/rhoai (HyperShift substitute for IDMS).
# LEGACY in-repo fallback only — Jenkins/Konflux EPHC uses Vault
# rosahcp-quay-kyverno-authenticate (ClusterPolicy replace-image-registry) via tenant
# secret rhoai-e2e-rosa-hcp-kyverno. Do not apply on HyperShift when Vault mount is present.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: replace-rhoai-registry
spec:
  background: false
  rules:
    - name: replace-rhoai-registry-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      mutate:
        foreach:
          - list: request.object.spec.containers
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{ element.name }}"
                    image: "{{ regex_replace_all('^registry\\.redhat\\.io/rhoai/(.*)$', '{{element.image}}', 'quay.io/rhoai/$1' )}}"
    - name: replace-rhoai-registry-initcontainers
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        all:
          - key: "{{ request.object.spec.initContainers[] || `[]` | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: request.object.spec.initContainers
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{ element.name }}"
                    image: "{{ regex_replace_all('^registry\\.redhat\\.io/rhoai/(.*)$', '{{element.image}}', 'quay.io/rhoai/$1' )}}"

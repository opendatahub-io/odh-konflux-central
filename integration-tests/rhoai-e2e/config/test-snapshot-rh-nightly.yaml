---
# Offline fallback for ``--run-its rhoai-e2e-konflux-rhoai1-ocp422``.
# ``rhoai_e2e.py`` resolves the latest Konflux snapshot for ``RHOAI_FBC_NAME`` from the
# ITS manifest; this pin is used only when Konflux lookup fails (no cluster access).
# RHOAI 3.5 EA2 stage push (2026-07), OCP 4.22 fragment (digest pin until Konflux lookup).
apiVersion: appstudio.redhat.com/v1alpha1
kind: Snapshot
metadata:
  generateName: rh-nightly-snap-
  namespace: rhoai-tenant
spec:
  application: testops-playpen
  components:
    - name: rhoai-fbc-fragment-ocp-422
      containerImage: quay.io/rhoai/rhoai-fbc-fragment@sha256:d9f54f26a526be21e0806a5c36b7d929b5861cffa68bcca57825fb878ecb40a2
      source:
        git:
          url: https://github.com/opendatahub-io/odh-konflux-central.git
          revision: "main"

---
# EPHC smoke slice A: auto on rhoai-fbc-fragment-ocp-420 (pairs with ocp421 = B: cypress+platform).
# Slice A COMPONENTS (all smoke except dashboard_cypress + platform).
# Debug: --run-its rhoai-e2e-ephc-ocp420 --konflux-app testops-playpen
# Re-apply on FBC only after upstream merge.
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  labels:
    test.appstudio.openshift.io/optional: "true"
  name: rhoai-e2e-ephc-ocp420
  namespace: rhoai-tenant
spec:
  application: rhoai-fbc-fragment-ocp-420
  contexts:
    - description: RHOAI EPHC smoke slice A when rhoai-fbc-fragment-ocp-420 builds
      name: component_rhoai-fbc-fragment-ocp-420
  params:
    - name: CLUSTER_SOURCE
      value: "EPHC"
    - name: OCP_VERSION
      value: "4.20"
    - name: PRODUCT
      value: "rhoai"
    - name: RHOAI_VERSION
      value: "unspecified (default)"
    - name: UPDATE_CHANNEL
      value: "beta"
    - name: OPERATOR_NAME
      value: "rhods-operator"
    - name: RHOAI_FBC_NAME
      value: "rhoai-fbc-fragment-ocp-420"
    - name: RHOAI_FBC_IMAGE
      value: "unspecified (default)"
    - name: MIN_RHOAI_VERSION
      value: "3.5"
    - name: TEST_GATES
      value: "bvt,smoke"
    - name: COMPONENTS
      value: "workbenches,model_registry,model_server,model_runtime,maas_billing,ai_pipelines,kuberay,mlflow,ogx,ai_safety,ai_safety_evalhub,ai_safety_guardrails,ai_safety_lmeval,ai_safety_trustyai_operator,ai_safety_trustyai_service,llama_stack,trainer,distributed_workloads,spark_operator,workbench_images,codeflare_sdk"
    - name: QUAY_PULL_SECRET_NAME
      value: "rhoai-external-quay-secret"
    - name: SCRIPTS_REPO_URL
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: SCRIPTS_REPO_REVISION
      value: main
  resolverRef:
    params:
      - name: url
        value: https://github.com/opendatahub-io/odh-konflux-central.git
      - name: revision
        value: main
      - name: pathInRepo
        value: integration-tests/rhoai-e2e/tekton/pipelines/rhoai-e2e-pipelinerun-ephc.yaml
    resolver: git
    resourceKind: pipelinerun

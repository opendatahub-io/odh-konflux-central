---
# EPHC smoke slice 420-tail: slow / heavy tail only (llama_stack, distributed_workloads, workbench_images).
# Debug: --run-its e2e-ephc-ocp420-llam-dsw-wbi --konflux-app testops-playpen
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  labels:
    test.appstudio.openshift.io/optional: "true"
  name: e2e-ephc-ocp420-llam-dsw-wbi
  namespace: rhoai-tenant
spec:
  application: rhoai-fbc-fragment-ocp-420
  contexts:
    - description: EPHC 420 tail smoke when rhoai-fbc-fragment-ocp-420 builds
      name: component_rhoai-fbc-fragment-ocp-420
  params:
    - name: CLUSTER_SOURCE
      value: "EPHC"
    - name: OCP_VERSION
      value: "4.20"
    - name: PRODUCT
      value: "rhoai"
    - name: RHOAI_VERSION
      value: "unspecified (default)"
    - name: UPDATE_CHANNEL
      value: "beta"
    - name: OPERATOR_NAME
      value: "rhods-operator"
    - name: RHOAI_FBC_NAME
      value: "rhoai-fbc-fragment-ocp-420"
    - name: RHOAI_FBC_IMAGE
      value: "unspecified (default)"
    - name: MIN_RHOAI_VERSION
      value: "3.5"
    - name: TEST_GATES
      value: "bvt,smoke"
    - name: COMPONENTS
      value: "llama_stack,distributed_workloads,workbench_images"
    - name: QUAY_PULL_SECRET_NAME
      value: "rhoai-external-quay-secret"
    - name: SCRIPTS_REPO_URL
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: SCRIPTS_REPO_REVISION
      value: main
  resolverRef:
    params:
      - name: url
        value: https://github.com/opendatahub-io/odh-konflux-central.git
      - name: revision
        value: main
      - name: pathInRepo
        value: integration-tests/rhoai-e2e/tekton/pipelines/rhoai-e2e-pipelinerun-ephc.yaml
    resolver: git
    resourceKind: pipelinerun

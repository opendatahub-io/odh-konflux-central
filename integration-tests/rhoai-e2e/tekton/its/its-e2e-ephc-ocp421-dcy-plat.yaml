---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: e2e-its-e2e-ephc-ocp421-dcy-plat-
  labels:
    pipelines.appstudio.openshift.io/type: test
    pac.test.appstudio.openshift.io/event-type: push
spec:
  timeouts:
    pipeline: 9h0m0s
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: $(params.SCRIPTS_REPO_URL)
      - name: revision
        value: $(params.SCRIPTS_REPO_REVISION)
      - name: pathInRepo
        value: integration-tests/rhoai-e2e/tekton/pipelines/rhoai-e2e-pipeline.yaml
  workspaces:
    - name: tests-shared
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 15Gi
  taskRunTemplate:
    serviceAccountName: konflux-integration-runner
---
# Colocated manifest: document 1 = PipelineRun shell (Integration Service resolver reads
# the first document). document 2 = IntegrationTestScenario (`--enable-its` / `--run-its`).
# EPHC smoke slice B: auto on rhoai-fbc-fragment-ocp-421 (pairs with ocp420 = A).
# Slice B COMPONENTS: dashboard_cypress + platform only.
# Debug: --run-its e2e-ephc-ocp421-dcy-plat --konflux-app testops-playpen
# Enable on FBC only after upstream merge.
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  labels:
    test.appstudio.openshift.io/optional: "true"
  name: e2e-ephc-ocp421-dcy-plat
  namespace: rhoai-tenant
spec:
  application: rhoai-fbc-fragment-ocp-421
  contexts:
    - description: EPHC 421 slice B on CLI override Snapshots (rhoai_e2e.py --sync-fbc-e2e-snapshots)
      name: override
  params:
    - name: CLUSTER_SOURCE
      value: "EPHC"
    - name: OCP_VERSION
      value: "4.21"
    - name: PRODUCT
      value: "rhoai"
    - name: FBC_STRUCTURAL
      value: "true"
    - name: RHOAI_VERSION
      value: "unspecified (default)"
    - name: UPDATE_CHANNEL
      value: "beta"
    - name: OPERATOR_NAME
      value: "rhods-operator"
    - name: RHOAI_FBC_NAME
      value: "rhoai-fbc-fragment-ocp-421"
    - name: RHOAI_FBC_IMAGE
      value: "unspecified (default)"
    - name: MIN_RHOAI_VERSION
      value: "3.5"
    - name: WAIT_FOR_CONFORMA
      value: "false"
    - name: TEST_GATES
      value: "bvt,smoke"
    - name: COMPONENTS
      value: "dashboard_cypress,platform"
    - name: QUAY_PULL_SECRET_NAME
      value: "rhoai-external-quay-secret"
    - name: PIPELINERUN_GENERATE_PREFIX
      value: "e2e-its-e2e-ephc-ocp421-dcy-plat-"
    - name: PIPELINE_TIMEOUT
      value: "9h0m0s"
    - name: SCRIPTS_REPO_URL
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: SCRIPTS_REPO_REVISION
      value: main
  resolverRef:
    params:
      - name: url
        value: https://github.com/opendatahub-io/odh-konflux-central.git
      - name: revision
        value: main
      - name: pathInRepo
        value: integration-tests/rhoai-e2e/tekton/its/its-e2e-ephc-ocp421-dcy-plat.yaml
    resolver: git
    resourceKind: pipelinerun

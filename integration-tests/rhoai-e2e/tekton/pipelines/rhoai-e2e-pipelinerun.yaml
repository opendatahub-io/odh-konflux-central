---
# Shared IntegrationTestScenario PipelineRun shell (git pipelineRef, PVC, SA, timeout).
# Tekton does not substitute ``$(params.*)`` in ``spec.timeouts.pipeline`` or ``metadata.generateName``.
# Integration Service runs use the literal timeout below; per-ITS ``PIPELINE_TIMEOUT`` applies to
# ``--run-its`` / CLI direct PipelineRuns (see ``create_direct_pipelinerun``). ``PIPELINERUN_GENERATE_PREFIX``
# in each ITS documents the ``--run-its`` naming profile; Integration Service runs use ``e2e-its-smoke-`` here.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: e2e-its-smoke-
  labels:
    pipelines.appstudio.openshift.io/type: test
    pac.test.appstudio.openshift.io/event-type: push
spec:
  timeouts:
    pipeline: 9h0m0s
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: $(params.SCRIPTS_REPO_URL)
      - name: revision
        value: $(params.SCRIPTS_REPO_REVISION)
      - name: pathInRepo
        value: integration-tests/rhoai-e2e/tekton/pipelines/rhoai-e2e-pipeline.yaml
  workspaces:
    - name: tests-shared
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 15Gi
  taskRunTemplate:
    serviceAccountName: konflux-integration-runner

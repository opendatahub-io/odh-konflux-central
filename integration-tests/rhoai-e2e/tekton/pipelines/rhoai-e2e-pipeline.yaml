        displayName: "Tests — prepare opendatahub-tests"
        description: >-
          Prepare for BVT and component tests: stage kubeconfig, resolve test images,
          export the component test plan, and run cluster prereqs when they were not
          already done in install-dep-operators. Scripts repo is cloned by parse-pipeline-tests.
        workspaces:
          - name: tests-shared
        params:
          - name: CONFORMA_GATE
            type: string
            default: ""
          - name: RUN_OPENDATAHUB_TESTS
            type: string
            default: ""
          - name: SCRIPTS_REPO_URL
            type: string
          - name: SCRIPTS_REPO_REVISION
            type: string
          - name: OPENDATAHUB_TESTS_REPO
            type: string
          - name: CLUSTER_SOURCE
            type: string
            default: ""
          - name: OPERATOR_NAMESPACE
            type: string
          - name: OPERATOR_NAME
            type: string
            default: "rhods-operator"
          - name: PRODUCT
            type: string
            default: ""
          - name: RUN_SMOKE
            type: string
            default: "false"
          - name: RUN_COMPONENT_TESTS
            type: string
            default: "false"
          - name: RUN_COMPONENT_CLUSTER_PREP_IN_DEP_OPERATORS
            type: string
            default: "false"
          - name: RUN_BVT_PLACEHOLDER_ONLY
            type: string
            default: "false"
          - name: RUN_DISTRIBUTED_WORKLOADS_TESTS
            type: string
            default: "false"
          - name: TEST_GATES
            type: string
            default: ""
          - name: COMPONENTS_CSV
            type: string
            default: ""
          - name: OLMINSTALL_TESTS_VERSION_OVERRIDE
            type: string
            default: ""
          - name: SMOKE_AWS_SECRET
            type: string
            default: "unused-smoke-aws-secret"
            description: Tenant shift-left secret (MAAS_OIDC_*, KEYCLOAK_ADMIN_* for prepare)
          - name: OLMINSTALL_ALLOW_GIT_SSLVERIFY_FALSE
            type: string
            default: "false"
            description: >-
              Set to "true" only when git operations require bypassing TLS certificate verification.
        results:
          - name: OPENDATAHUB_TESTS_IMAGE
            description: Full image reference for opendatahub-tests (BVT and smoke)
          - name: DISTRIBUTED_WORKLOADS_TESTS_IMAGE
            description: Full image reference for distributed-workloads-tests (trainer, KFTO)
          - name: OPERATOR_E2E_IMAGE
            description: Full image reference for opendatahub-operator-e2e (platform, spark_operator)
          - name: TASK_MESSAGE
            description: Pass/fail summary for Konflux task Results panel
          - name: COMPONENT_TEST_PLAN_EXPORTED
            description: >-
              true when export_component_plan wrote component-test-plan.json;
              skipped when RUN_COMPONENT_TESTS=false

        volumes:
          - name: credentials
            emptyDir: {}
          - name: smoke-aws-credentials
            emptyDir: {}
          - name: vault-approle
            secret:
              secretName: vault-approle
              optional: true
          - name: tenant-test-secrets
            secret:
              optional: true
              secretName: $(params.SMOKE_AWS_SECRET)
        stepTemplate:
          env:
            - name: OLMINSTALL_OC_VERBOSE
              value: "1"
        steps:
          - name: seed-test-image-results
            displayName: Seed test image results
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: OPENDATAHUB_TESTS_IMAGE_PATH
                value: $(results.OPENDATAHUB_TESTS_IMAGE.path)
              - name: DISTRIBUTED_WORKLOADS_TESTS_IMAGE_PATH
                value: $(results.DISTRIBUTED_WORKLOADS_TESTS_IMAGE.path)
              - name: OPERATOR_E2E_IMAGE_PATH
                value: $(results.OPERATOR_E2E_IMAGE.path)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              printf '%s' 'n/a' > "${OPENDATAHUB_TESTS_IMAGE_PATH}"
              printf '%s' 'n/a' > "${DISTRIBUTED_WORKLOADS_TESTS_IMAGE_PATH}"
              printf '%s' 'n/a' > "${OPERATOR_E2E_IMAGE_PATH}"

          - name: write-placeholder-test-images
            displayName: Skip test image resolve (BVT placeholder only)
            when:
              - input: "$(params.RUN_BVT_PLACEHOLDER_ONLY)"
                operator: in
                values: ["true"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: OPENDATAHUB_TESTS_IMAGE_PATH
                value: $(results.OPENDATAHUB_TESTS_IMAGE.path)
              - name: DISTRIBUTED_WORKLOADS_TESTS_IMAGE_PATH
                value: $(results.DISTRIBUTED_WORKLOADS_TESTS_IMAGE.path)
              - name: OPERATOR_E2E_IMAGE_PATH
                value: $(results.OPERATOR_E2E_IMAGE.path)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              printf '%s' 'n/a' > "${OPENDATAHUB_TESTS_IMAGE_PATH}"
              printf '%s' 'n/a' > "${DISTRIBUTED_WORKLOADS_TESTS_IMAGE_PATH}"
              printf '%s' 'n/a' > "${OPERATOR_E2E_IMAGE_PATH}"

          - name: skip-distributed-workloads-image
            displayName: Skip distributed-workloads image (not selected)
            when:
              - input: "$(params.RUN_BVT_PLACEHOLDER_ONLY)"
                operator: in
                values: ["false"]
              - input: "$(params.RUN_DISTRIBUTED_WORKLOADS_TESTS)"
                operator: in
                values: ["false"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: DISTRIBUTED_WORKLOADS_TESTS_IMAGE_PATH
                value: $(results.DISTRIBUTED_WORKLOADS_TESTS_IMAGE.path)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              printf '%s' 'n/a' > "${DISTRIBUTED_WORKLOADS_TESTS_IMAGE_PATH}"

          - name: prepare-kubeconfig-external
            when:
              - input: "$(params.CLUSTER_SOURCE)"
                operator: notin
                values: ["", "EPHC"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "steps.stage_kubeconfig_for_task"])

          - name: sync-kubeconfig-to-workspace
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: TESTS_SHARED
                value: $(workspaces.tests-shared.path)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
            script: |
              #!/bin/bash
              set -euo pipefail
              mkdir -p "${TESTS_SHARED}/credentials"
              if [[ "${PRODUCT}" != "rhoai" && "${PRODUCT}" != "odh" && -z "${CLUSTER_SOURCE}" ]]; then
                echo "opendatahub-tests-prepare: no workload cluster (PRODUCT unset (test-only), empty CLUSTER_SOURCE)"
                exit 0
              fi
              if [[ -f "${TESTS_SHARED}/.skip-verify-operator-ready" ]]; then
                echo "opendatahub-tests-prepare: no workload cluster (verify-operator-ready skipped)"
                exit 0
              fi
              if [[ -f "${TESTS_SHARED}/credentials/kubeconfig" ]]; then
                echo "Test kubeconfig already staged in tests-shared workspace"
                exit 0
              fi
              if [[ ! -f /credentials/kubeconfig ]]; then
                echo "ERROR: kubeconfig missing under /credentials" >&2
                exit 1
              fi
              cp /credentials/kubeconfig "${TESTS_SHARED}/credentials/kubeconfig"
              echo "Test kubeconfig staged in tests-shared workspace"

          - name: resolve-opendatahub-tests-image
            when:
              - input: "$(params.RUN_BVT_PLACEHOLDER_ONLY)"
                operator: in
                values: ["false"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
              - name: TESTS_SHARED
                value: $(workspaces.tests-shared.path)
              - name: OPERATOR_NAMESPACE
                value: $(params.OPERATOR_NAMESPACE)
              - name: OPERATOR_NAME
                value: $(params.OPERATOR_NAME)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: OLMINSTALL_TESTS_VERSION_OVERRIDE
                value: $(params.OLMINSTALL_TESTS_VERSION_OVERRIDE)
              - name: OPENDATAHUB_TESTS_REPO
                value: $(params.OPENDATAHUB_TESTS_REPO)
              - name: RESULT_PATH
                value: $(results.OPENDATAHUB_TESTS_IMAGE.path)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "steps.run_resolve_opendatahub_tests_image"])

          - name: resolve-operator-e2e-image
            when:
              - input: "$(params.RUN_BVT_PLACEHOLDER_ONLY)"
                operator: in
                values: ["false"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
              - name: TESTS_SHARED
                value: $(workspaces.tests-shared.path)
              - name: OPERATOR_NAMESPACE
                value: $(params.OPERATOR_NAMESPACE)
              - name: OPERATOR_NAME
                value: $(params.OPERATOR_NAME)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: OLMINSTALL_TESTS_VERSION_OVERRIDE
                value: $(params.OLMINSTALL_TESTS_VERSION_OVERRIDE)
              - name: OPERATOR_E2E_REPO
                value: quay.io/opendatahub/opendatahub-operator-e2e
              - name: RESULT_PATH
                value: $(results.OPERATOR_E2E_IMAGE.path)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "steps.run_resolve_operator_e2e_image"])

          - name: resolve-distributed-workloads-tests-image
            when:
              - input: "$(params.RUN_DISTRIBUTED_WORKLOADS_TESTS)"
                operator: in
                values: ["true"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
              - name: OPERATOR_NAMESPACE
                value: $(params.OPERATOR_NAMESPACE)
              - name: OPERATOR_NAME
                value: $(params.OPERATOR_NAME)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: OLMINSTALL_TESTS_VERSION_OVERRIDE
                value: $(params.OLMINSTALL_TESTS_VERSION_OVERRIDE)
              - name: DISTRIBUTED_WORKLOADS_TESTS_REPO
                value: quay.io/opendatahub/distributed-workloads-tests
              - name: RESULT_PATH
                value: $(results.DISTRIBUTED_WORKLOADS_TESTS_IMAGE.path)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "steps.run_resolve_distributed_workloads_tests_image"])

          - name: prepare-component-test-plan
            displayName: Export component test plan JSON for test tasks
            when:
              - input: "$(params.RUN_COMPONENT_TESTS)"
                operator: in
                values: ["true"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: COMPONENTS_CSV
                value: $(params.COMPONENTS_CSV)
              - name: COMPONENTS_CONFIG
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e/config/rhoai-e2e-components-smoke.yaml
              - name: COMPONENT_TEST_PLAN_JSON
                value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: OPERATOR_NAMESPACE
                value: $(params.OPERATOR_NAMESPACE)
              - name: OPERATOR_NAME
                value: $(params.OPERATOR_NAME)
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
              - name: OLMINSTALL_TESTS_VERSION_OVERRIDE
                value: $(params.OLMINSTALL_TESTS_VERSION_OVERRIDE)
              - name: KUBECONFIG
                value: $(workspaces.tests-shared.path)/credentials/kubeconfig
              - name: TESTS_SHARED
                value: $(workspaces.tests-shared.path)
            script: |
              #!/usr/bin/env python3
              import os, sys
              sys.path.insert(0, os.path.join(os.environ["TESTS_SHARED"], "scripts-repo/integration-tests/rhoai-e2e"))
              from steps.tests_payload import ensure_tests_payload_layout
              ensure_tests_payload_layout(os.environ["TESTS_SHARED"])
              os.chdir(os.path.join(os.environ["TESTS_SHARED"], "scripts-repo/integration-tests/rhoai-e2e"))
              os.execvp(sys.executable, [sys.executable, "-m", "steps.export_component_plan"])

          - name: prepare-components-prerequisites-external
            displayName: Component cluster prep (external pooled)
            # Mutually exclusive with prepare-components-prerequisites-ephc.
            # Skipped when RUN_COMPONENT_CLUSTER_PREP_IN_DEP_OPERATORS=true (prep runs in install-dep-operators).
            when:
              - input: "$(params.RUN_COMPONENT_TESTS)"
                operator: in
                values: ["true"]
              - input: "$(params.RUN_COMPONENT_CLUSTER_PREP_IN_DEP_OPERATORS)"
                operator: in
                values: ["false"]
              - input: "$(params.CLUSTER_SOURCE)"
                operator: notin
                values: ["", "EPHC"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            volumeMounts:
              - name: vault-approle
                mountPath: /vault-approle
                readOnly: true
              - name: tenant-test-secrets
                mountPath: /tenant-test-secrets
                readOnly: true
              - name: smoke-aws-credentials
                mountPath: /smoke-aws-credentials
            env:
              - name: KUBECONFIG
                value: $(workspaces.tests-shared.path)/credentials/kubeconfig
              - name: ARTIFACTS_DIR
                value: $(workspaces.tests-shared.path)/tests-payload/results
              - name: COMPONENTS_CSV
                value: $(params.COMPONENTS_CSV)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: COMPONENT_TEST_PLAN_JSON
                value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
              - name: OLMINSTALL_ALLOW_GIT_SSLVERIFY_FALSE
                value: $(params.OLMINSTALL_ALLOW_GIT_SSLVERIFY_FALSE)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              print("[prep-external] prepare-components-prerequisites-external", flush=True)
              os.execvp(sys.executable, [sys.executable, "-m", "runners.component_cluster_prep"])

          - name: prepare-components-prerequisites-ephc
            displayName: Component cluster prep (EPHC fresh install)
            # Mutually exclusive with prepare-components-prerequisites-external.
            # Skipped when RUN_COMPONENT_CLUSTER_PREP_IN_DEP_OPERATORS=true (prep runs in install-dep-operators).
            when:
              - input: "$(params.RUN_COMPONENT_TESTS)"
                operator: in
                values: ["true"]
              - input: "$(params.RUN_COMPONENT_CLUSTER_PREP_IN_DEP_OPERATORS)"
                operator: in
                values: ["false"]
              - input: "$(params.CLUSTER_SOURCE)"
                operator: in
                values: ["", "EPHC"]
              - input: "$(params.PRODUCT)"
                operator: in
                values: ["rhoai", "odh"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            volumeMounts:
              - name: vault-approle
                mountPath: /vault-approle
                readOnly: true
              - name: tenant-test-secrets
                mountPath: /tenant-test-secrets
                readOnly: true
              - name: smoke-aws-credentials
                mountPath: /smoke-aws-credentials
            env:
              - name: KUBECONFIG
                value: $(workspaces.tests-shared.path)/credentials/kubeconfig
              - name: ARTIFACTS_DIR
                value: $(workspaces.tests-shared.path)/tests-payload/results
              - name: COMPONENTS_CSV
                value: $(params.COMPONENTS_CSV)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
              - name: COMPONENT_TEST_PLAN_JSON
                value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
              - name: OLMINSTALL_ALLOW_GIT_SSLVERIFY_FALSE
                value: $(params.OLMINSTALL_ALLOW_GIT_SSLVERIFY_FALSE)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              print("[prep-ephc] prepare-components-prerequisites-ephc", flush=True)
              os.execvp(sys.executable, [sys.executable, "-m", "runners.component_cluster_prep"])

          - name: record-component-test-plan-export-status
            displayName: Record component test plan export status
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: RUN_COMPONENT_TESTS
                value: $(params.RUN_COMPONENT_TESTS)
              - name: COMPONENT_TEST_PLAN_JSON
                value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
              - name: COMPONENT_TEST_PLAN_EXPORTED_PATH
                value: $(results.COMPONENT_TEST_PLAN_EXPORTED.path)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              if [[ "${RUN_COMPONENT_TESTS}" != "true" ]]; then
                printf '%s' 'skipped' > "${COMPONENT_TEST_PLAN_EXPORTED_PATH}"
                exit 0
              fi
              if [[ -f "${COMPONENT_TEST_PLAN_JSON}" ]]; then
                printf '%s' 'true' > "${COMPONENT_TEST_PLAN_EXPORTED_PATH}"
                exit 0
              fi
              echo "ERROR: component test plan missing at ${COMPONENT_TEST_PLAN_JSON}" >&2
              exit 1

          - name: write-konflux-task-summary
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
              - name: PIPELINE_TASK
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['tekton.dev/pipelineTask']
              - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
              - name: TESTS_SHARED
                value: $(workspaces.tests-shared.path)
              - name: VERSION_SKIPPED_JSON
                value: $(workspaces.tests-shared.path)/run-config/version_skipped.json
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
              exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh"


    - name: resolve-component-run-flags
      displayName: "Setup — resolve component run flags"
      description: >-
        After prepare, decide which test-* tasks run. COMPONENTS (--components) limits
        what was requested; minRhoai/maxRhoai limits what the installed RHOAI version
        supports. Unselected or version-incompatible components are grey-skipped.
      timeout: 15m0s
      workspaces:
        - name: tests-shared
          workspace: tests-shared
      runAfter:
        - install-rhoai
        - install-odh
        - install-dep-operators
        - opendatahub-tests-prepare
      when:
        - input: "$(tasks.wait-for-conforma.results.CONFORMA_GATE)"
          operator: in
          values: ["pass"]
        - input: "$(tasks.parse-pipeline-tests.results.RUN_OPENDATAHUB_TESTS)"
          operator: in
          values: ["true"]
        - input: "$(tasks.opendatahub-tests-prepare.results.COMPONENT_TEST_PLAN_EXPORTED)"
          operator: in
          values: ["true", "skipped"]
      params:
        - name: RUN_COMPONENT_TESTS
          value: $(tasks.parse-pipeline-tests.results.RUN_COMPONENT_TESTS)
      taskSpec:
        displayName: "Setup — resolve component run flags"
        description: >-
          After prepare, decide which test-* tasks run. COMPONENTS (--components) limits
          what was requested; minRhoai/maxRhoai limits what the installed RHOAI version
          supports. Unselected or version-incompatible components are grey-skipped.
        workspaces:
          - name: tests-shared
        params:
          - name: RUN_COMPONENT_TESTS
            type: string
            default: "false"
        results:
          - name: RUN_SMOKE_workbenches
            description: Version-aware smoke flag for workbenches
          - name: RUN_SMOKE_model_registry
            description: Version-aware smoke flag for model_registry
          - name: RUN_SMOKE_model_server
            description: Version-aware smoke flag for model_server
          - name: RUN_SMOKE_model_runtime
            description: Version-aware smoke flag for model_runtime
          - name: RUN_SMOKE_maas_billing
            description: Version-aware smoke flag for maas_billing
          - name: RUN_SMOKE_ai_pipelines
            description: Version-aware smoke flag for ai_pipelines
          - name: RUN_SMOKE_kuberay
            description: Version-aware smoke flag for kuberay
          - name: RUN_SMOKE_mlflow
            description: Version-aware smoke flag for mlflow
          - name: RUN_SMOKE_ogx
            description: Version-aware smoke flag for ogx
          - name: RUN_SMOKE_ai_safety
            description: Version-aware smoke flag for ai_safety
          - name: RUN_SMOKE_ai_safety_evalhub
            description: Version-aware smoke flag for ai_safety_evalhub
          - name: RUN_SMOKE_ai_safety_guardrails
            description: Version-aware smoke flag for ai_safety_guardrails
          - name: RUN_SMOKE_ai_safety_lmeval
            description: Version-aware smoke flag for ai_safety_lmeval

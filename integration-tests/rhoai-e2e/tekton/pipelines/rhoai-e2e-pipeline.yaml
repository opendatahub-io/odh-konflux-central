    - name: provision-ephemeral-cluster
      displayName: "Cluster — provision OpenShift CI HyperShift"
      description: >-
        Provision an ephemeral HyperShift cluster via OpenShift CI
        (openshift/konflux-tasks provision-ephemeral-cluster, KONFLUX-15294).
      runAfter:
        - resolve-oci-releases
      when:
        - input: "$(tasks.wait-for-conforma.results.CONFORMA_GATE)"
          operator: in
          values: ["pass"]
        - input: "$(params.CLUSTER_SOURCE)"
          operator: in
          values: ["", "EPHC"]
        - input: "$(params.PRODUCT)"
          operator: in
          values: ["rhoai", "odh"]
      timeout: 2h15m0s
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: $(params.OCI_TASKS_REVISION)
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: $(params.OCI_WORKFLOW)
        - name: clusterProfile
          value: $(params.OCI_CLUSTER_PROFILE)
        - name: timeout
          value: "2h"
        - name: releases
          value: $(tasks.resolve-oci-releases.results.releases)
        - name: env
          value: >-
            {"COMPUTE_NODE_TYPE":"$(params.HYPERSHIFT_INSTANCE_TYPE)","HYPERSHIFT_NODE_COUNT":"3","HOSTED_MANAGEMENT_CLUSTER":"hosted-mgmt2","IMAGE_CONTENT_SOURCES":"- source: registry.redhat.io/rhoai\n  mirrors:\n    - quay.io/rhoai"}

    - name: stage-ephemeral-kubeconfig
      displayName: "Cluster — stage ephemeral kubeconfig"
      description: >-
        Copy the OpenShift CI ephemeral kubeconfig onto tests-shared for install
        and tests. Cluster create is provision-ephemeral-cluster.
      runAfter:
        - provision-ephemeral-cluster
      when:
        - input: "$(tasks.wait-for-conforma.results.CONFORMA_GATE)"
          operator: in
          values: ["pass"]
        - input: "$(params.CLUSTER_SOURCE)"
          operator: in
          values: ["", "EPHC"]
        - input: "$(params.PRODUCT)"
          operator: in
          values: ["rhoai", "odh"]
      workspaces:
        - name: tests-shared
          workspace: tests-shared
      params:
        - name: CLUSTER_CREDENTIALS_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: CLUSTER_CLAIM_NAME
          value: $(tasks.provision-ephemeral-cluster.results.testPlatformClusterClaimName)
        - name: OCP_MINOR
          value: $(tasks.resolve-oci-releases.results.ocpMinor)
        - name: OCP_CHANNEL
          value: $(tasks.resolve-oci-releases.results.ocpChannel)
        - name: SCRIPTS_REPO_URL
          value: $(params.SCRIPTS_REPO_URL)
        - name: SCRIPTS_REPO_REVISION
          value: $(params.SCRIPTS_REPO_REVISION)
      taskSpec:
        displayName: "Cluster — stage ephemeral kubeconfig"
        description: >-
          Copy OpenShift CI ephemeral kubeconfig onto tests-shared for install and tests.
          Echoes OCP minor and channel resolved for this provision (not from the upstream Task).
        workspaces:
          - name: tests-shared
        params:
          - name: CLUSTER_CREDENTIALS_SECRET_REF
            type: string
          - name: CLUSTER_CLAIM_NAME
            type: string
            default: ""
          - name: OCP_MINOR
            type: string
            default: ""
          - name: OCP_CHANNEL
            type: string
            default: ""
          - name: SCRIPTS_REPO_URL
            type: string
          - name: SCRIPTS_REPO_REVISION
            type: string
        results:
          - name: clusterName
            description: TestPlatformCluster claim name (ephemeral cluster id)
          - name: ocpMinor
            description: OpenShift minor requested for this ephemeral cluster
          - name: ocpChannel
            description: OpenShift CI payload channel (stable, candidate, or nightly)
          - name: TASK_MESSAGE
            description: Pass/fail summary for Konflux task Results panel
        volumes:
          - name: cluster-credentials
            secret:
              secretName: $(params.CLUSTER_CREDENTIALS_SECRET_REF)
        steps:
          - name: sync-kubeconfig-to-tests-shared
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            volumeMounts:
              - name: cluster-credentials
                mountPath: /var/run/secrets/cluster
                readOnly: true
            env:
              - name: TESTS_SHARED
                value: $(workspaces.tests-shared.path)
              - name: CLUSTER_CLAIM_NAME
                value: $(params.CLUSTER_CLAIM_NAME)
              - name: CLUSTER_NAME_PATH
                value: $(results.clusterName.path)
              - name: OCP_MINOR
                value: $(params.OCP_MINOR)
              - name: OCP_CHANNEL
                value: $(params.OCP_CHANNEL)
              - name: OCP_MINOR_PATH
                value: $(results.ocpMinor.path)
              - name: OCP_CHANNEL_PATH
                value: $(results.ocpChannel.path)
            script: |
              #!/bin/bash
              set -euo pipefail
              src="/var/run/secrets/cluster/kubeconfig"
              if [[ ! -f "${src}" ]]; then
                echo "ERROR: ephemeral kubeconfig missing at ${src}" >&2
                ls -la /var/run/secrets/cluster >&2 || true
                exit 1
              fi
              mkdir -p "${TESTS_SHARED}/credentials"
              cp "${src}" "${TESTS_SHARED}/credentials/kubeconfig"
              printf '%s' "${CLUSTER_CLAIM_NAME}" > "${CLUSTER_NAME_PATH}"
              printf '%s' "${OCP_MINOR}" > "${OCP_MINOR_PATH}"
              printf '%s' "${OCP_CHANNEL}" > "${OCP_CHANNEL_PATH}"
              echo "Ephemeral kubeconfig staged in tests-shared (claim ${CLUSTER_CLAIM_NAME} OCP ${OCP_MINOR} channel ${OCP_CHANNEL})"

          - name: write-konflux-task-summary
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
              - name: PIPELINE_TASK
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['tekton.dev/pipelineTask']
              - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
              exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh"


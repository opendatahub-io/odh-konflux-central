          value: $(params.OPERATOR_NAME)
      taskSpec:
        displayName: "Report — collect diagnostics"
        description: >-
          Collect cluster diagnostics after the run: pod logs, DSC status, and
          optional OLM dumps. Writes a diagnostic log for upload in publish-results.
        params:
          - name: OPERATOR_NAMESPACE
            type: string
          - name: PRODUCT
            type: string
          - name: CLUSTER_SOURCE
            type: string
            default: ""
          - name: CONFORMA_GATE
            type: string
            description: pass|skip from wait-for-conforma (skip = no target cluster)
            default: ""
          - name: SCRIPTS_REPO_URL
            type: string
          - name: SCRIPTS_REPO_REVISION
            type: string
          - name: OPERATOR_NAME
            type: string
            default: "rhods-operator"
        workspaces:
          - name: tests-shared
            description: Shared tests workspace (staged target-cluster kubeconfig)
        results:
          - name: KUBECONFIG_PATH
            description: Staged target-cluster kubeconfig path (empty when skipped)
          - name: DIAGNOSTICS_MANIFEST
            description: Issues summary + status snippets (full triage in <product>-diagnostic-<datetime>.log OCI artifact)
          - name: OPERATOR_VERSION
            description: Installed operator CSV version from target cluster (when reachable)
          - name: TASK_MESSAGE
            description: Pass/fail summary for Konflux task Results panel
        volumes:
          - name: credentials
            emptyDir: {}
          - name: diag
            emptyDir: {}
        stepTemplate:
          env:
            - name: OLMINSTALL_OC_VERBOSE
              value: "1"
        steps:
          - name: prepare-kubeconfig
            displayName: Stage kubeconfig for diagnostics
            image: quay.io/rhoai/rhoai-task-toolset:its@sha256:18b1af9b64d766478792849e49eed156464f678ef53b567a641a28444cacbfc9
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
              - name: CONFORMA_GATE
                value: $(params.CONFORMA_GATE)
              - name: TESTS_SHARED_KUBECONFIG
                value: $(workspaces.tests-shared.path)/credentials/kubeconfig
              - name: KUBECONFIG_PATH_RESULT
                value: $(results.KUBECONFIG_PATH.path)
              - name: NAMESPACE
                value: $(context.pipelineRun.namespace)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys

              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "steps.prepare_diagnostics_kubeconfig"])

          - name: collect-diagnostics
            displayName: Collect cluster diagnostics
            image: quay.io/rhoai/rhoai-task-toolset:its@sha256:18b1af9b64d766478792849e49eed156464f678ef53b567a641a28444cacbfc9
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: diag
                mountPath: /diag
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: OPERATOR_NAMESPACE
                value: $(params.OPERATOR_NAMESPACE)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: CONFORMA_GATE
                value: $(params.CONFORMA_GATE)
              - name: INSTALL_OPERATOR_RHOAI_STATUS
                value: $(tasks.install-rhoai.status)
              - name: INSTALL_OPERATOR_ODH_STATUS
                value: $(tasks.install-odh.status)
              - name: INSTALL_DEP_OPERATORS_STATUS
                value: $(tasks.install-dep-operators.status)
              - name: PIPELINE_RUN_STATUS
                value: $(tasks.status)
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: NAMESPACE
                value: $(context.pipelineRun.namespace)
              - name: PIPELINE_RUN_START_TIME
                value: $(context.pipelineRun.creationTimestamp)
              - name: DIAG_COLLECT_POD_LOGS
                value: "true"
              - name: TESTS_SHARED_DIR
                value: $(workspaces.tests-shared.path)
              - name: DIAG_MANIFEST_RESULT
                value: $(results.DIAGNOSTICS_MANIFEST.path)
              - name: OPERATOR_NAME
                value: $(params.OPERATOR_NAME)
              - name: OPERATOR_VERSION_PATH
                value: $(results.OPERATOR_VERSION.path)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys

              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "steps.collect_diagnostics"])
          - name: write-konflux-task-summary
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
              - name: PIPELINE_TASK
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['tekton.dev/pipelineTask']
              - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
              exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh"

    - name: publish-results
      displayName: "Report — publish results"
      description: >-
        Upload test artifacts to OCI, write Konflux UI summary (annotations and
        task Results), send Slack when configured, and propagate pipeline-level TEST_OUTPUT.
      when:
        - input: "$(tasks.status)"
          operator: in
          values: ["Succeeded", "Failed", "Completed"]
      params:
        - name: SCRIPTS_REPO_URL
          value: $(params.SCRIPTS_REPO_URL)
        - name: SCRIPTS_REPO_REVISION
          value: $(params.SCRIPTS_REPO_REVISION)
        - name: OPERATOR_NAME
          value: $(params.OPERATOR_NAME)
        - name: TEST_GATES
          value: $(params.TEST_GATES)
        - name: COMPONENTS
          value: $(params.COMPONENTS)
        - name: SLACK_CHANNEL_ID
          value: $(params.SLACK_CHANNEL_ID)
        - name: RHOAI_FBC_NAME
          value: $(params.RHOAI_FBC_NAME)
        - name: CLUSTER_SOURCE
          value: $(params.CLUSTER_SOURCE)
        - name: OPERATOR_NAMESPACE
          value: $(params.OPERATOR_NAMESPACE)
        - name: AGGREGATE_TASKS_STATUS
          value: "$(tasks.status)"
        - name: OCI_ARTIFACTS_REPO
          value: $(params.OCI_ARTIFACTS_REPO)
        - name: OCI_ARTIFACTS_PUSH_SECRET_NAME
          value: $(params.OCI_ARTIFACTS_PUSH_SECRET_NAME)
        - name: ARTIFACT_BROWSER_URL
          value: $(params.ARTIFACT_BROWSER_URL)
        - name: ARTIFACT_BROWSER_REPO_PATH
          value: $(params.ARTIFACT_BROWSER_REPO_PATH)
        - name: CONFORMA_GATE
          value: $(tasks.wait-for-conforma.results.CONFORMA_GATE)
        - name: PRODUCT
          value: $(params.PRODUCT)
      workspaces:
        - name: tests-shared
          workspace: tests-shared
      taskSpec:
        displayName: "Report — publish results"
        description: >-
          Upload tests-payload to OCI, patch PipelineRun summary annotations,
          write Konflux UI Results, send Slack notification, and propagate TEST_OUTPUT.
        params:
          - name: SCRIPTS_REPO_URL
            type: string
          - name: SCRIPTS_REPO_REVISION
            type: string
          - name: OPERATOR_NAME
            type: string
            default: "rhods-operator"
          - name: TEST_GATES
            type: string
            default: ""
          - name: COMPONENTS
            type: string
            default: ""
          - name: SLACK_CHANNEL_ID
            type: string
            default: ""
          - name: RHOAI_FBC_NAME
            type: string
            default: "odh-operator-catalog"
          - name: CLUSTER_SOURCE
            type: string
            default: ""
          - name: OPERATOR_NAMESPACE
            type: string
            default: "redhat-ods-operator"
          - name: AGGREGATE_TASKS_STATUS
            type: string
            default: ""
          - name: OCI_ARTIFACTS_REPO
            type: string
          - name: OCI_ARTIFACTS_PUSH_SECRET_NAME
            type: string
          - name: ARTIFACT_BROWSER_URL
            type: string
          - name: ARTIFACT_BROWSER_REPO_PATH
            type: string
          - name: CONFORMA_GATE
            type: string
            description: pass|skip from wait-for-conforma (skip = intentional e2e not run)
            default: ""
          - name: PRODUCT
            type: string
            default: "rhoai"
        workspaces:
          - name: tests-shared
            description: Shared PVC with scripts-repo (cloned by parse-pipeline-tests)
        volumes:
          - name: oci-docker-config-writable
            emptyDir: {}
          - name: odh-registry-secret-volume
            secret:
              optional: true
              secretName: $(params.OCI_ARTIFACTS_PUSH_SECRET_NAME)
              items:
                - key: .dockerconfigjson
                  path: config.json
        results:
          - name: CLUSTER
            description: Target cluster name (EPHC CTI or external kubeconfig context)
          - name: OPERATOR_VERSION
            description: Installed operator CSV version when install completed
          - name: TESTS_SUMMARY
            description: Combined pass/fail/skip totals with pass rate
          - name: BVT_GATE
            description: BVT gate pass/fail/skip totals with pass rate
          - name: SMOKE_GATE
            description: Smoke gate pass/fail/skip totals with pass rate
          - name: ARTIFACTS_URL
            description: Published BVT/smoke artifact browser URL
          - name: TEST_OUTPUT
            description: Konflux-standard JSON TEST_OUTPUT (from test-finalize / BVT / install)
          - name: TASK_MESSAGE
            description: Task status merged with Konflux test result class
        steps:
          - name: seed-ui-results
            displayName: Seed publish-results Tekton results
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            script: |
              #!/usr/bin/env sh
              set -eu
              if [ ! -s "$(results.CLUSTER.path)" ]; then
                printf '%s' "(unknown)" > "$(results.CLUSTER.path)"
              fi
              if [ ! -s "$(results.OPERATOR_VERSION.path)" ]; then
                printf '%s' "(unknown)" > "$(results.OPERATOR_VERSION.path)"
              fi
              if [ ! -s "$(results.BVT_GATE.path)" ]; then
                printf '%s' "N/A (not run)" > "$(results.BVT_GATE.path)"
              fi
              if [ ! -s "$(results.SMOKE_GATE.path)" ]; then
                printf '%s' "N/A (not run)" > "$(results.SMOKE_GATE.path)"
              fi

          - name: upload-tests-payload
            displayName: Upload test artifacts to OCI
            onError: continue
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            volumeMounts:
              - name: odh-registry-secret-volume
                mountPath: /tmp/oci-secret-readonly
                readOnly: true
              - name: oci-docker-config-writable
                mountPath: /tmp/docker-config
            env:
              - name: TESTS_PAYLOAD_DIR
                value: $(workspaces.tests-shared.path)/tests-payload
              - name: OCI_ARTIFACT_REFERENCE
                value: "$(params.OCI_ARTIFACTS_REPO):$(context.pipelineRun.name)"
              - name: DOCKER_CONFIG
                value: /tmp/docker-config
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
              - name: TESTS_CONFIG_PATH
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e/config/rhoai-e2e-tests-config.yaml
            script: |
              #!/bin/bash
              set -euo pipefail
              exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/upload_tests_payload.sh"

          - name: publish-artifacts-url
            displayName: Publish artifact browser URL
            onError: continue
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: ARTIFACTS_URL_PATH
                value: $(results.ARTIFACTS_URL.path)
              - name: ARTIFACT_BROWSER_BASE
                value: $(params.ARTIFACT_BROWSER_URL)
              - name: ARTIFACT_BROWSER_REPO_PATH
                value: $(params.ARTIFACT_BROWSER_REPO_PATH)
              - name: PR_NAME
                value: $(context.pipelineRun.name)
              - name: TESTS_PAYLOAD_DIR
                value: $(workspaces.tests-shared.path)/tests-payload
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              sys.path.insert(0, os.environ["SCRIPTS_REPO_ROOT"])
              from steps.write_artifacts_url import main
              raise SystemExit(main())

          - name: collect-ui-context
            displayName: Collect Konflux UI summary
            onError: continue
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: RHOAI_FBC_NAME
                value: $(params.RHOAI_FBC_NAME)
              - name: PIPELINE_TASK_STATUS
                value: $(params.AGGREGATE_TASKS_STATUS)
              - name: OPERATOR_NAME
                value: $(params.OPERATOR_NAME)
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
              - name: OPERATOR_NAMESPACE
                value: $(params.OPERATOR_NAMESPACE)
              - name: CLUSTER_PATH
                value: $(results.CLUSTER.path)
              - name: OPERATOR_VERSION_PATH
                value: $(results.OPERATOR_VERSION.path)
              - name: ARTIFACTS_URL_PATH
                value: $(results.ARTIFACTS_URL.path)
              - name: TESTS_SUMMARY_PATH
                value: $(results.TESTS_SUMMARY.path)
              - name: BVT_GATE_PATH
                value: $(results.BVT_GATE.path)
              - name: SMOKE_GATE_PATH
                value: $(results.SMOKE_GATE.path)
              - name: BVT_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-bvt-test-output.json
              - name: SMOKE_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-smoke-test-output.json
              - name: FBCF_IMAGE_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-fbcf-image.txt
              - name: TESTS_SHARED_KUBECONFIG
                value: $(workspaces.tests-shared.path)/credentials/kubeconfig
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              sys.path.insert(0, os.environ["SCRIPTS_REPO_ROOT"])
              from runners.report.collect_post_results_ui import main
              raise SystemExit(main())

          - name: emit-workspace-test-output
            displayName: Emit TEST_OUTPUT from workspace sidecars
            onError: continue
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: RESULT_PATH
                value: $(results.TEST_OUTPUT.path)
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: SMOKE_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-smoke-test-output.json
              - name: BVT_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-bvt-test-output.json
              - name: CONFORMA_SKIP_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-conforma-skip-test-output.json
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "runners.report.emit_pipeline_test_output_from_workspace"])

          - name: propagate-test-output
            displayName: Propagate pipeline TEST_OUTPUT
            onError: continue
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: RESULT_PATH
                value: $(results.TEST_OUTPUT.path)
              - name: SMOKE_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-smoke-test-output.json
              - name: BVT_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-bvt-test-output.json
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "runners.report.propagate_pipeline_test_output"])

          - name: populate-gate-summaries
            displayName: Populate BVT/smoke gate Tekton results
            onError: continue
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: TEST_OUTPUT_PATH
                value: $(results.TEST_OUTPUT.path)
              - name: TESTS_SUMMARY_PATH
                value: $(results.TESTS_SUMMARY.path)
              - name: BVT_GATE_PATH
                value: $(results.BVT_GATE.path)
              - name: SMOKE_GATE_PATH
                value: $(results.SMOKE_GATE.path)
              - name: BVT_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-bvt-test-output.json
              - name: SMOKE_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-smoke-test-output.json
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              sys.path.insert(0, os.environ["SCRIPTS_REPO_ROOT"])
              from runners.report.populate_publish_gate_results import main
              raise SystemExit(main())

          - name: patch-summary-annotations
            displayName: Patch PipelineRun summary
            onError: continue
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: PIPELINE_TASK_STATUS
                value: $(params.AGGREGATE_TASKS_STATUS)
              - name: ARTIFACTS_URL_PATH
                value: $(results.ARTIFACTS_URL.path)
              - name: TEST_OUTPUT_PATH
                value: $(results.TEST_OUTPUT.path)
              - name: CLUSTER_PATH
                value: $(results.CLUSTER.path)
              - name: OPERATOR_VERSION_PATH
                value: $(results.OPERATOR_VERSION.path)
              - name: FBCF_IMAGE_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-fbcf-image.txt
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "runners.report.patch_pipelinerun_summary"])

          - name: write-konflux-task-summary
            displayName: Write Konflux task summary
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
              - {name: TEST_OUTPUT_PATH, value: $(results.TEST_OUTPUT.path)}
              - {name: TESTS_SUMMARY_PATH, value: $(results.TESTS_SUMMARY.path)}
              - {name: BVT_GATE_PATH, value: $(results.BVT_GATE.path)}
              - {name: SMOKE_GATE_PATH, value: $(results.SMOKE_GATE.path)}
              - {name: CLUSTER_PATH, value: $(results.CLUSTER.path)}
              - {name: OPERATOR_VERSION_PATH, value: $(results.OPERATOR_VERSION.path)}
              - {name: ARTIFACTS_URL_PATH, value: $(results.ARTIFACTS_URL.path)}
              - name: BVT_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-bvt-test-output.json
              - name: SMOKE_TEST_OUTPUT_PATH
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-smoke-test-output.json
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: CONFORMA_GATE
                value: $(params.CONFORMA_GATE)
              - name: PIPELINE_TASK_STATUS
                value: $(params.AGGREGATE_TASKS_STATUS)
              - name: PIPELINE_TASK
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['tekton.dev/pipelineTask']
              - name: OLMINSTALL_TASK_ALWAYS_SUCCEED
                value: "1"
              - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
              bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh" || true
              exit 0

          - name: send-notification
            displayName: Send Slack notification
            onError: continue
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: TEST_STATUS
                value: $(params.AGGREGATE_TASKS_STATUS)
              - name: OPERATOR_NAME
                value: $(params.OPERATOR_NAME)
              - name: OPERATOR_VERSION
                value: $(results.OPERATOR_VERSION.path)
              - name: FBCF_IMAGE
                value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-fbcf-image.txt
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: COMPONENTS
                value: $(params.COMPONENTS)
              - name: SLACK_CHANNEL_ID
                value: $(params.SLACK_CHANNEL_ID)
              - name: ARTIFACTS_URL
                value: $(results.ARTIFACTS_URL.path)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
              - name: SLACK_WEBHOOK_URL
                valueFrom:
                  secretKeyRef:
                    name: slack-webhook
                    key: webhook-url
                    optional: true
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "runners.report.send_notification"])

          - name: check-requested-gates-ran
            displayName: Fail hollow green when gates skipped
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: CONFORMA_GATE
                value: $(params.CONFORMA_GATE)
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: PIPELINE_NAMESPACE
                value: $(context.pipelineRun.namespace)
              - name: BVT_GATE_PATH
                value: $(results.BVT_GATE.path)
              - name: SMOKE_GATE_PATH
                value: $(results.SMOKE_GATE.path)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              sys.path.insert(0, os.environ["SCRIPTS_REPO_ROOT"])
              from runners.report.check_requested_gates_ran import main
              raise SystemExit(main())

  workspaces:
    - name: tests-shared
      description: Shared kubeconfig, scripts-repo (cloned once by parse-pipeline-tests), smoke plan, and test artifacts

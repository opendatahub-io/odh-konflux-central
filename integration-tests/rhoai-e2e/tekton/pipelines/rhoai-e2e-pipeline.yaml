      displayName: "Setup — extract FBCF image"
      description: >-
        Parse the Konflux ApplicationSnapshot and record the FBC catalog image to install.
        With PRODUCT unset (test-only), records n/a and skips snapshot parsing (scripts from parse-pipeline-tests).
      runAfter:
        - wait-for-conforma
      workspaces:
        - name: tests-shared
          workspace: tests-shared
      when:
        - input: "$(tasks.wait-for-conforma.results.CONFORMA_GATE)"
          operator: in
          values: ["pass"]
      taskSpec:
        displayName: "Setup — extract FBCF image"
        description: >-
          Parse the Konflux snapshot and record the FBC catalog image to install, or n/a when
          PRODUCT unset (test-only) (no operator install).
        workspaces:
          - name: tests-shared
            description: Shared PVC with scripts-repo (cloned by parse-pipeline-tests)
        params:
          - name: SNAPSHOT
            type: string
          - name: COMPONENT_NAME
            type: string
          - name: PRODUCT
            type: string
            default: ""
          - name: MIN_RHOAI_VERSION
            type: string
            default: "3.5"
          - name: SCRIPTS_REPO_URL
            type: string
          - name: SCRIPTS_REPO_REVISION
            type: string
        results:
          - name: FBCF_IMAGE
            description: Extracted FBCF image URL
          - name: TASK_MESSAGE
            description: Pass/fail summary for Konflux task Results panel
        steps:
          - name: skip-fbcf-for-test-only
            displayName: Skip FBC extract (test-only)
            when:
              - input: "$(params.PRODUCT)"
                operator: notin
                values: ["rhoai", "odh"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: FBCF_IMAGE_PATH
                value: $(results.FBCF_IMAGE.path)
              - name: TASK_MESSAGE_PATH
                value: $(results.TASK_MESSAGE.path)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              printf '%s' 'n/a' > "${FBCF_IMAGE_PATH}"
              printf '%s' 'PRODUCT unset (test-only) — FBC catalog extract skipped (no install).' > "${TASK_MESSAGE_PATH}"

          - name: parse-snapshot
            displayName: Extract FBC catalog image
            when:
              - input: "$(params.PRODUCT)"
                operator: in
                values: ["rhoai", "odh"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: COMPONENT_NAME
                value: $(params.COMPONENT_NAME)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: RESULT_PATH
                value: $(results.FBCF_IMAGE.path)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys

              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "steps.extract_fbcf_image"])
          - name: check-min-rhoai-fbc
            displayName: Verify RHOAI FBC >= MIN_RHOAI_VERSION
            when:
              - input: "$(params.PRODUCT)"
                operator: in
                values: ["rhoai", "odh"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: RHOAI_FBC_NAME
                value: $(params.COMPONENT_NAME)
              - name: MIN_RHOAI_VERSION
                value: $(params.MIN_RHOAI_VERSION)
              - name: SCRIPTS_REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
            script: |
              #!/usr/bin/env python3
              import os, sys
              os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
              os.execvp(sys.executable, [sys.executable, "-m", "steps.check_min_rhoai_fbc"])
          - name: write-konflux-task-summary
            when:
              - input: "$(params.PRODUCT)"
                operator: in
                values: ["rhoai", "odh"]
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
              - name: PIPELINE_TASK
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['tekton.dev/pipelineTask']
              - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
              exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh"

      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: COMPONENT_NAME
          value: $(params.RHOAI_FBC_NAME)
        - name: PRODUCT
          value: $(params.PRODUCT)
        - name: MIN_RHOAI_VERSION
          value: $(params.MIN_RHOAI_VERSION)
        - name: SCRIPTS_REPO_URL
          value: $(params.SCRIPTS_REPO_URL)
        - name: SCRIPTS_REPO_REVISION
          value: $(params.SCRIPTS_REPO_REVISION)


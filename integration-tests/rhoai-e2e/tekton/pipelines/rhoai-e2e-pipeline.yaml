---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: rhoai-e2e-test
  labels:
    app.kubernetes.io/version: "1.0"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: odh, rhoai, integration-test
    rhoai-e2e.konflux.dev/snippets: config/rhoai-e2e-pipeline-snippets.yaml (see README.md#pipeline-snippets-rhoai-e2e-pipeline-snippetsyaml)
spec:
  description: >-
    End-to-end (E2E) RHOAI/ODH test on Konflux: optionally provision an EPHC cluster,
    install the operator from the snapshot FBC catalog image, run BVT health
    checks, then optional per-component smoke tests. Reporting and artifact
    upload run in the finally block after tests complete.

  params:
    - name: SNAPSHOT
      description: |
        Spec section of an ApplicationSnapshot as a JSON string.
        Provided by Konflux Integration Test Scenario.
      type: string

    - name: SCRIPTS_REPO_URL
      description: Git repo containing the pipeline step scripts
      type: string
      default: "https://github.com/opendatahub-io/odh-konflux-central.git"

    - name: SCRIPTS_REPO_REVISION
      description: Branch/tag/SHA of the scripts repo to clone
      type: string
      default: "main"

    - name: CLUSTER_SOURCE
      description: |
        Target cluster selector. EPHC — Ephemeral Hosted Cluster in OpenShift CI (Prow).
        Any other value — tenant Secret name (key kubeconfig) for a user-provided cluster.
        Empty with PRODUCT unset (test-only) — no cluster (snapshot-only / placeholder BVT).
      type: string
      default: ""

    - name: FORCE_CLUSTER_RUN
      description: |
        When "true", skip external-cluster single-flight wait (allow parallel runs on the same
        physical cluster). EPHC is never serialized.
      type: string
      default: "false"

    - name: CLUSTER_IDLE_WAIT_SEC
      description: |
        Max seconds to wait in external-cluster-ready for another rhoai-e2e run on the same
        external cluster to finish (Jenkins resource-lock parity).
      type: string
      default: "21300"

    - name: CLUSTER_IDLE_POLL_SEC
      description: Poll interval while waiting for an external cluster to become idle.
      type: string
      default: "60"

    - name: OCP_VERSION
      description: |
        Informational catalog OCP minor for Konflux UI. Set by rhoai_e2e.py on trigger.
        "latest (default)" on EPHC when omitted; inferred from RHOAI_FBC_NAME on external runs.
      type: string
      default: ""

    - name: OCP_VERSION_PREFIX
      description: |
        OpenShift minor for the ephemeral cluster (e.g. 4.21 or 4.21.). Empty uses RHOAI_FBC_NAME
        (rhoai-fbc-fragment-ocp-421 → 4.21) for OpenShift CI provision-ephemeral-cluster.
      type: string
      default: ""

    - name: OCP_RELEASE_CHANNEL
      description: |
        OpenShift CI payload stream for provision-ephemeral-cluster: stable (GA),
        candidate (EC), or nightly. Independent of UPDATE_CHANNEL (RHOAI OLM).
      type: string
      default: "stable"

    - name: CLEANUP
      description: |
        When "true" and CLUSTER_SOURCE is a tenant Secret name (not EPHC), run upstream olminstall
        cleanup.sh -t operator before install-operator.
      type: string
      default: "false"

    - name: HYPERSHIFT_INSTANCE_TYPE
      description: AWS instance type for ephemeral HyperShift workers (COMPUTE_NODE_TYPE)
      type: string
      default: "m5.2xlarge"

    - name: OCI_CLUSTER_PROFILE
      description: |
        OpenShift CI cluster profile for hypershift-hostedcluster-workflow.
        Konflux shared HyperShift profile is aws-konflux-prod (EPHC deprecation notice).
      type: string
      default: "aws-konflux-prod"

    - name: OCI_WORKFLOW
      description: OpenShift CI workflow name for provision-ephemeral-cluster
      type: string
      default: "hypershift-hostedcluster-workflow"

    - name: OCI_TASKS_REVISION
      description: |
        Pinned commit of openshift/konflux-tasks for provision-ephemeral-cluster.
      type: string
      # renovate: datasource=git-refs depName=https://github.com/openshift/konflux-tasks
      default: "9751a2028f2b3b88e4204d5c42de8eda4ebb466f"

    - name: PRODUCT
      description: |
        Product selector: "rhoai" or "odh" (empty = test-only on external cluster).
        When empty PRODUCT, cluster provisioning and operator installation are skipped; set
        CLUSTER_SOURCE to a tenant Secret (kubeconfig key) to run BVT/smoke on that cluster.
      type: string
      default: "rhoai"

    - name: INSTALL_DEPENDENCIES
      description: |
        When "true" with PRODUCT unset (test-only), run install-dep-operators (setup-dependencies.sh,
        RHCL, component cluster prep) before component tests. Opt-in for external/pooled clusters.
      type: string
      default: "false"

    - name: SECRET_SOURCE
      description: |
        Where component/prepare tasks load Jenkins envFile* credentials: vault (AppRole +
        apps/rhods-ci/shift-left at runtime, default) or tenant (cloned Konflux envfile-* Secrets).
      type: string
      default: "vault"

    - name: RHOAI_VERSION
      description: |
        RHOAI catalog line from the resolved FBC snapshot (metadata or image tag) for Konflux UI.
        Set by rhoai_e2e.py on trigger; also passed to install-rhoai/odh for failed-install fallback.
      type: string
      default: ""

    - name: UPDATE_CHANNEL
      description: OLM update channel (clean install value)
      type: string
      default: "stable"

    - name: OPERATOR_NAME
      description: OLM package / deployment name (e.g. rhods-operator for RHOAI)
      type: string
      default: "rhods-operator"

    - name: OPERATOR_NAMESPACE
      description: Namespace for operator installation
      type: string
      default: "redhat-ods-operator"

    - name: RHOAI_FBC_NAME
      description: Snapshot component name for the catalog fragment (e.g. rhoai-fbc-fragment-ocp-421)
      type: string
      default: "odh-operator-catalog"

    - name: RHOAI_FBC_IMAGE
      description: |
        Informational RHOAI FBC catalog pullspec for Konflux UI. Set by rhoai_e2e.py on trigger.
        Empty with PRODUCT unset (test-only). Install uses pipeline result FBCF_IMAGE from extract-fbcf-image
        (n/a when PRODUCT unset (test-only)).
      type: string
      default: ""

    - name: MIN_RHOAI_VERSION
      description: |
        Minimum RHOAI catalog line for PRODUCT=rhoai ITS auto-runs. Enforced in wait-for-conforma
        from Snapshot PAC metadata (e.g. rhoai-2.25 vs rhoai-3.5-ea.2). Skipped when PRODUCT unset (test-only)
        or when catalog line cannot be determined (manual snapshots).
      type: string
      default: "3.5"

    - name: COMPONENTS
      description: |
        Comma-separated component ids from rhoai-e2e-components-smoke.yaml (smoke phase only).
        Empty runs smoke for every catalog component. Ignored when smoke is not in TEST_GATES.
      type: string
      default: ""

    - name: COMPONENT_TEST_TIMEOUT
      description: |
        Per-component smoke pytest timeout duration (e.g. 10m, 90s, 1h30m).
        Empty disables per-component timeout.
      type: string
      default: ""

    - name: TEST_TAGS
      description: |
        Optional comma-separated catalog Cypress tag sets (e.g. SmokeSet1,SmokeSet5).
        Runners that define gates in rhoai-e2e-components-smoke.yaml apply the filter;
        others ignore this param.
      type: string
      default: ""

    - name: OLMINSTALL_TESTS_VERSION_OVERRIDE
      description: |
        Optional override for opendatahub-tests image tag resolution and component version gates.
        Use with PRODUCT unset (test-only) when the probed CSV should not drive tests (mirrors Jenkins UI image override).
      type: string
      default: ""

    - name: FAIL_FAST_DISABLED_COMPONENT
      description: |
        When "true", each component task probes DSC/operator readiness before pytest.
        Unready components emit one failing JUnit test and skip pytest; other components
        still run. Set "false" to run full pytest without the prereq probe.
      type: string
      default: "true"

    - name: WAIT_FOR_CONFORMA
      description: |
        When "true", wait for Enterprise Contract (conforma) on the same Snapshot before
        provisioning a cluster or running e2e smoke. Emits WARNING TEST_OUTPUT when skipped.
      type: string
      default: "true"

    - name: CONFORMA_GATE_TIMEOUT_SEC
      description: Max seconds to wait for conforma PipelineRuns on the triggering Snapshot
      type: string
      default: "1800"

    - name: TEST_GATES
      description: |
        Comma-separated test gate ids declared in integration-tests/rhoai-e2e/config/rhoai-e2e-tests-config.yaml
        inside SCRIPTS_REPO. parse-pipeline-tests clones that repo and evaluates RUN_* flags from the file.
        Default must stay in sync with in-repo ITS examples (bvt,smoke).
      type: string
      default: "bvt,smoke"

    - name: OLMINSTALL_CATALOG_NAME
      description: CatalogSource name used by rhoai-e2e install-operator.sh
      type: string
      default: "rhoai-catalog-dev"

    - name: OLMINSTALL_REPO_URL
      description: |
        rhoai-e2e repo URL — provides tested OLM
        install manifests (resources/install-rhods-operator.yaml) and utility
        scripts (utils/oc_wait.sh, utils/oc_approve.sh).
      type: string
      default: "https://gitlab.cee.redhat.com/data-hub/olminstall.git"

    - name: OLMINSTALL_REPO_REVISION
      description: Branch/tag/SHA of data-hub/rhoai-e2e to clone
      type: string
      default: "main"

    - name: OLMINSTALL_GITOPS_BRANCH
      description: |
        odh-gitops branch for setup-dependencies.sh (-b). Empty uses rhoai-e2e default (main).
        Jenkins parity: GITOPS_REPO_BRANCH.
      type: string
      default: ""

    - name: QUAY_PULL_SECRET_NAME
      description: Name of the namespace secret containing quay.io/rhoai dockerconfigjson
      type: string
      default: "rhoai-external-quay-secret"

    - name: ROSA_HCP_KYVERNO_SECRET
      description: >-
        Tenant secret with Vault rosahcp-psquay-* Kyverno YAML and rosahcp-quay-auth
        (.dockerconfigjson). Jenkins addICSP ROSA_HCP parity on HyperShift EPHC install.
      type: string
      default: "rhoai-e2e-rosa-hcp-kyverno"

    - name: OCI_ARTIFACTS_PUSH_SECRET_NAME
      description: |
        Secret (type kubernetes.io/dockerconfigjson, key .dockerconfigjson) mounted for BVT
        `oras push` to OCI_ARTIFACTS_REPO (e.g. quay.io/opendatahub/odh-ci-artifacts). Separate from
        QUAY_PULL_SECRET_NAME which is used for rhoai catalog/image pulls in install-operator.
      type: string
      default: "odh-registry-secret"

    - name: OPENDATAHUB_TESTS_REPO
      description: |
        Container image repository (no tag) for BVT — quay.io/opendatahub/opendatahub-tests.
        Tag is derived from installed CSV version with skopeo fallback to latest.
      type: string
      default: "quay.io/opendatahub/opendatahub-tests"

    - name: OCI_ARTIFACTS_REPO
      description: |
        OCI repository for BVT test artifacts (JUnit XML + console logs).
        Uses the same shared repo as other integration test pipelines in this project.
      type: string
      default: "quay.io/opendatahub/odh-ci-artifacts"

    - name: ARTIFACT_BROWSER_URL
      description: |
        Base URL of the OCI artifact browser used to view published test artifacts.
        Per-run artifacts are at <ARTIFACT_BROWSER_URL>/<ARTIFACT_BROWSER_REPO_PATH>/<run>/ (gates in bvt/, smoke/, …).
      type: string
      default: "https://app-artifact-browser.apps.rosa.konflux-qe.zmr9.p3.openshiftapps.com"

    - name: ARTIFACT_BROWSER_REPO_PATH
      description: |
        Path segment (repo slug) in the artifact browser for OCI_ARTIFACTS_REPO.
        Default "odh-ci-artifacts" matches the shared QE browser layout for that repo name; override if your OCI target maps to a different slug.
      type: string
      default: "odh-ci-artifacts"

    - name: SLACK_CHANNEL_ID
      description: |
        Optional Slack channel ID (e.g. C01234ABCDE) to receive a run notification.
        Leave empty (the default) to suppress all Slack messages. When set, the
        slack-webhook secret must be present in the namespace; the channel field
        in the payload overrides the webhook's default destination.
      type: string
      default: ""

  results:
    - name: TEST_OUTPUT
      description: Overall test result from test-finalize (bvt/smoke gates); publish-results stays green
      value: $(tasks.test-finalize.results.TEST_OUTPUT)

    - name: FBCF_IMAGE
      description: FBCF image that was tested
      value: $(tasks.extract-fbcf-image.results.FBCF_IMAGE)

    - name: ARTIFACTS_URL
      description: BVT JUnit and logs in the OCI artifact browser (Konflux task Results panel)
      value: $(finally.publish-results.results.ARTIFACTS_URL)

    - name: TESTS_SUMMARY
      description: Combined pass/fail/skip totals with pass rate (all gates)
      value: $(finally.publish-results.results.TESTS_SUMMARY)

    - name: BVT_GATE
      description: BVT gate pass/fail/skip totals with pass rate
      value: $(finally.publish-results.results.BVT_GATE)

    - name: SMOKE_GATE
      description: Smoke gate pass/fail/skip totals with pass rate
      value: $(finally.publish-results.results.SMOKE_GATE)

    - name: RHOAI_E2E_SUMMARY_TEST_OUTPUT
      description: Combined test pass/fail/skip totals for Konflux UI
      value: $(finally.publish-results.results.TESTS_SUMMARY)

    - name: OLMINSTALL_OPERATOR_VERSION
      description: Installed operator CSV version from install-operator
      value: $(finally.publish-results.results.OPERATOR_VERSION)

    - name: CLUSTER
      description: Target cluster name (EPHC CTI or external kubeconfig context)
      value: $(finally.publish-results.results.CLUSTER)

    - name: OLMINSTALL_RUN_SUMMARY
      description: Combined test pass/fail/skip totals for Konflux UI
      value: $(finally.publish-results.results.TESTS_SUMMARY)

  tasks:
    - name: parse-pipeline-tests
      displayName: "Setup — parse test gates"
      description: >-
        Clone SCRIPTS_REPO, record trigger/FBC context as separate Results rows,
        read TEST_GATES and COMPONENTS, and set RUN_* flags for install, BVT, and
        component test tasks.
      workspaces:
        - name: tests-shared
          workspace: tests-shared
      params:
        - name: TEST_GATES
          value: $(params.TEST_GATES)
        - name: COMPONENTS
          value: $(params.COMPONENTS)
        - name: SCRIPTS_REPO_URL
          value: $(params.SCRIPTS_REPO_URL)
        - name: SCRIPTS_REPO_REVISION
          value: $(params.SCRIPTS_REPO_REVISION)
        - name: CLUSTER_SOURCE
          value: $(params.CLUSTER_SOURCE)
        - name: PRODUCT
          value: $(params.PRODUCT)
        - name: INSTALL_DEPENDENCIES
          value: $(params.INSTALL_DEPENDENCIES)
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: RHOAI_FBC_NAME
          value: $(params.RHOAI_FBC_NAME)
      taskSpec:
        displayName: "Setup — parse test gates"
        description: >-
          Clone scripts, write trigger/FBC context as separate Konflux Results rows
          (TRIGGER, KONFLUX_EVENT, FBC, CLUSTER, …), then resolve TEST_GATES /
          COMPONENTS into RUN_* flags.
        params:
          - name: TEST_GATES
            type: string
          - name: COMPONENTS
            type: string
          - name: SCRIPTS_REPO_URL
            type: string
          - name: SCRIPTS_REPO_REVISION
            type: string
          - name: CLUSTER_SOURCE
            type: string
            default: ""
          - name: PRODUCT
            type: string
            default: ""
          - name: INSTALL_DEPENDENCIES
            type: string
            default: "false"
          - name: SNAPSHOT
            type: string
            default: ""
          - name: RHOAI_FBC_NAME
            type: string
            default: ""
        workspaces:
          - name: tests-shared
            description: Shared PVC; scripts-repo is cloned here once for the whole run
        results:
          - name: TRIGGER
            description: How this PipelineRun was triggered (CLI, rh-nightly sync, or ITS)
          - name: KONFLUX_EVENT
            description: Konflux Activity event type (Incoming vs Push)
          - name: SNAPSHOT
            description: Konflux Snapshot name when present
          - name: FBC
            description: FBC catalog component and digest to install or test against
          - name: CLUSTER
            description: Target cluster (external kubeconfig secret or EPHC)
          - name: RUN
            description: PRODUCT and TEST_GATES for this PipelineRun
          - name: TRIGGER_CMD
            description: Reproduced rhoai_e2e.py command when triggered from CLI
          - name: RUN_SMOKE
            description: '"true" or "false"'
          - name: RUN_BVT
            description: '"true" or "false"'
          - name: RUN_TIER1
            description: '"true" or "false"'
          - name: RUN_OPENDATAHUB_TESTS
            description: '"true" when BVT or component smoke runs after install'
          - name: RUN_MINIMAL_DEPS
            description: '"true" when setup-dependencies.sh should run (rhoai/odh install, or test-only + INSTALL_DEPENDENCIES)'
          - name: RUN_INSTALL_DEP_OPERATORS
            description: '"true" when install-dep-operators should run (rhoai/odh install, or test-only + INSTALL_DEPENDENCIES with component tests)'

          - name: RUN_COMPONENT_TESTS
            description: '"true" when per-component smoke and/or tier1 tasks should run'
          - name: RUN_COMPONENT_CLUSTER_PREP_IN_DEP_OPERATORS
            description: '"true" when INSTALL_DEPENDENCIES moves component cluster prep into install-dep-operators (test-only + smoke/tier1)'
          - name: RUN_BVT_PLACEHOLDER_ONLY
            description: '"true" when BVT writes placeholder JUnit only (test-only, no CLUSTER_SOURCE)'
          - name: RUN_DISTRIBUTED_WORKLOADS_TESTS
            description: '"true" when trainer or distributed_workloads smoke/tier1 is selected'
          - name: COMPONENTS_CSV
            description: Canonical component ids selected for smoke (may be empty)
          - name: SETUP_DEPENDENCIES_ARGS
            description: Arguments for setup-dependencies.sh when RUN_MINIMAL_DEPS (default -M)
          - name: SMOKE_AWS_SECRET
            description: Tenant Secret for shift-left model smoke (from components catalog)
        steps:
          - name: clone-scripts-repo
            displayName: Clone scripts repository
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: REPO_URL
                value: $(params.SCRIPTS_REPO_URL)
              - name: REPO_REV
                value: $(params.SCRIPTS_REPO_REVISION)
              - name: DEST_DIR
                value: $(workspaces.tests-shared.path)/scripts-repo
            script: |
              #!/bin/bash
              set -euo pipefail
              echo "Cloning ${REPO_URL}@${REPO_REV} into tests-shared/scripts-repo..."
              MARKER="${DEST_DIR}/.scripts-repo-revision"
              if [[ -f "${DEST_DIR}/integration-tests/rhoai-e2e/rhoai_e2e.py" ]]; then
                cd "${DEST_DIR}"
                current_origin="$(git remote get-url origin 2>/dev/null || echo '')"
                if [[ "${current_origin}" == "${REPO_URL}" ]]; then
                  if git fetch --depth=1 origin "${REPO_REV}" \
                     && git checkout -q FETCH_HEAD \
                     && git clean -qfd; then
                    printf '%s@%s\n' "${REPO_REV}" "$(git rev-parse HEAD)" > "${MARKER}"
                    echo "✓ Refreshed scripts-repo at ${REPO_REV} ($(git rev-parse --short HEAD))"
                    exit 0
                  fi
                  echo "Refresh failed for ${REPO_REV}; re-cloning ${REPO_URL}"
                  cd /
                fi
                echo "Existing checkout points at ${current_origin:-<none>}; re-cloning ${REPO_URL}"
              fi
              rm -rf "${DEST_DIR}"
              mkdir -p "${DEST_DIR}"
              cd "${DEST_DIR}"
              git init -q
              git remote add origin "${REPO_URL}"
              git fetch --depth=1 origin "${REPO_REV}"
              git checkout -q FETCH_HEAD
              printf '%s@%s\n' "${REPO_REV}" "$(git rev-parse HEAD)" > "${MARKER}"
              echo "✓ Cloned scripts repo"

          - name: print-run-context
            displayName: Print trigger / FBC context
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: PIPELINE_RUN_NAME
                value: $(context.pipelineRun.name)
              - name: PIPELINE_NAMESPACE
                value: $(context.pipelineRun.namespace)
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: RHOAI_FBC_NAME
                value: $(params.RHOAI_FBC_NAME)
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: TRIGGER_PATH
                value: $(results.TRIGGER.path)
              - name: KONFLUX_EVENT_PATH
                value: $(results.KONFLUX_EVENT.path)
              - name: SNAPSHOT_PATH
                value: $(results.SNAPSHOT.path)
              - name: FBC_PATH
                value: $(results.FBC.path)
              - name: CLUSTER_PATH
                value: $(results.CLUSTER.path)
              - name: RUN_PATH
                value: $(results.RUN.path)
              - name: TRIGGER_CMD_PATH
                value: $(results.TRIGGER_CMD.path)
              - name: REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo
            script: |
              #!/usr/bin/env python3
              import os, sys

              os.chdir(os.path.join(os.environ["REPO_ROOT"], "integration-tests/rhoai-e2e"))
              os.execvp(sys.executable, [sys.executable, "-m", "steps.print_pipeline_run_context"])

          - name: eval-tests-from-config
            displayName: Resolve test gates
            image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
            env:
              - name: TEST_GATES
                value: $(params.TEST_GATES)
              - name: COMPONENTS
                value: $(params.COMPONENTS)
              - name: REPO_ROOT
                value: $(workspaces.tests-shared.path)/scripts-repo
              - name: RUN_SMOKE_PATH
                value: $(results.RUN_SMOKE.path)
              - name: RUN_BVT_PATH
                value: $(results.RUN_BVT.path)
              - name: RUN_TIER1_PATH
                value: $(results.RUN_TIER1.path)
              - name: RUN_OPENDATAHUB_TESTS_PATH
                value: $(results.RUN_OPENDATAHUB_TESTS.path)
              - name: RUN_MINIMAL_DEPS_PATH
                value: $(results.RUN_MINIMAL_DEPS.path)
              - name: RUN_INSTALL_DEP_OPERATORS_PATH
                value: $(results.RUN_INSTALL_DEP_OPERATORS.path)
              - name: COMPONENTS_CSV_WORKSPACE
                value: $(workspaces.tests-shared.path)/run-config/COMPONENTS_CSV
              - name: COMPONENTS_CSV_PATH
                value: $(results.COMPONENTS_CSV.path)
              - name: SETUP_DEPENDENCIES_ARGS_WORKSPACE
                value: $(workspaces.tests-shared.path)/run-config/SETUP_DEPENDENCIES_ARGS
              - name: SETUP_DEPENDENCIES_ARGS_PATH
                value: $(results.SETUP_DEPENDENCIES_ARGS.path)
              - name: SMOKE_AWS_SECRET_WORKSPACE
                value: $(workspaces.tests-shared.path)/run-config/SMOKE_AWS_SECRET
              - name: SMOKE_AWS_SECRET_PATH
                value: $(results.SMOKE_AWS_SECRET.path)
              - name: RUN_COMPONENT_TESTS_PATH
                value: $(results.RUN_COMPONENT_TESTS.path)
              - name: RUN_COMPONENT_CLUSTER_PREP_IN_DEP_OPERATORS_PATH
                value: $(results.RUN_COMPONENT_CLUSTER_PREP_IN_DEP_OPERATORS.path)
              - name: RUN_BVT_PLACEHOLDER_ONLY_PATH
                value: $(results.RUN_BVT_PLACEHOLDER_ONLY.path)
              - name: RUN_DISTRIBUTED_WORKLOADS_TESTS_PATH
                value: $(results.RUN_DISTRIBUTED_WORKLOADS_TESTS.path)
              - name: CLUSTER_SOURCE
                value: $(params.CLUSTER_SOURCE)
              - name: PRODUCT
                value: $(params.PRODUCT)
              - name: INSTALL_DEPENDENCIES
                value: $(params.INSTALL_DEPENDENCIES)
              - name: SECRET_SOURCE
                value: $(params.SECRET_SOURCE)
              - name: SECRET_SOURCE_WORKSPACE
                value: $(workspaces.tests-shared.path)/run-config/SECRET_SOURCE
            script: |
              #!/usr/bin/env python3
              import os, sys

              os.chdir(os.path.join(os.environ["REPO_ROOT"], "integration-tests/rhoai-e2e"))
              os.execvp(sys.executable, [sys.executable, "-m", "steps.write_pipeline_test_flags"])


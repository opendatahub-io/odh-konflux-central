apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhoai-e2e-bvt-health-checks
spec:
  description: >-
    Basic verification tests (BVT) before component smoke: cluster health and
    operator health. Must pass before component tests run. On snapshot-only runs
    without a cluster, writes placeholder JUnit instead of running pytest.
  params:
    - name: OPENDATAHUB_TESTS_IMAGE
      type: string
      description: Container image for pytest steps (set by opendatahub-tests-prepare)
    - name: ARTIFACT_BROWSER_URL
      type: string
    - name: ARTIFACT_BROWSER_REPO_PATH
      type: string
    - name: PIPELINE_RUN_NAME
      type: string
    - name: CLUSTER_SOURCE
      type: string
      default: ""
    - name: PRODUCT
      type: string
      default: ""
  workspaces:
    - name: tests-shared
  results:
    - name: TEST_OUTPUT
      description: BVT pass/fail summary for Konflux (cluster and operator health)
    - name: TASK_MESSAGE
      description: Pass/fail summary for Konflux task Results panel
  stepTemplate:
    env:
      - name: OLMINSTALL_OC_VERBOSE
        value: "1"
      # opendatahub-tests image runs as odh with a read-only /home/odh; Tekton entrypoint
      # copies docker creds to $HOME/.docker — point HOME at a writable path.
      - name: HOME
        value: /tmp/odh-home
      - name: DOCKER_CONFIG
        value: /tmp/odh-home/.docker
  steps:
    - name: write-bvt-placeholder-junit
      displayName: Write skipped BVT placeholder
      when:
        - input: "$(params.CLUSTER_SOURCE)"
          operator: in
          values: ["", "EPHC"]
        - input: "$(params.PRODUCT)"
          operator: notin
          values: ["rhoai", "odh"]
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: BVT_ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys
        from pathlib import Path
        os.makedirs(os.environ["BVT_ARTIFACTS_DIR"], exist_ok=True)
        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(
            sys.executable,
            [sys.executable, "-m", "runners.bvt_product_existing_placeholder_junit", os.environ["BVT_ARTIFACTS_DIR"]],
        )

    - name: pytest-bvt-gates
      displayName: Run BVT on external cluster
      onError: continue
      when:
        - input: "$(params.CLUSTER_SOURCE)"
          operator: notin
          values: ["", "EPHC"]
      image: $(params.OPENDATAHUB_TESTS_IMAGE)
      env:
        - name: BVT_SUITE
          value: health
        - name: KUBECONFIG
          value: $(workspaces.tests-shared.path)/credentials/kubeconfig
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: CLUSTER_SOURCE
          value: $(params.CLUSTER_SOURCE)
        - name: PRODUCT
          value: $(params.PRODUCT)
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys
        from pathlib import Path
        os.makedirs(os.environ["ARTIFACTS_DIR"], exist_ok=True)
        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "runners.run_bvt_pytest"])

    - name: pytest-bvt-gates-ephc
      displayName: Run BVT on EPHC cluster
      onError: continue
      when:
        - input: "$(params.CLUSTER_SOURCE)"
          operator: in
          values: ["", "EPHC"]
        - input: "$(params.PRODUCT)"
          operator: in
          values: ["rhoai", "odh"]
      image: $(params.OPENDATAHUB_TESTS_IMAGE)
      env:
        - name: BVT_SUITE
          value: health
        - name: KUBECONFIG
          value: $(workspaces.tests-shared.path)/credentials/kubeconfig
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: CLUSTER_SOURCE
          value: $(params.CLUSTER_SOURCE)
        - name: PRODUCT
          value: $(params.PRODUCT)
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys
        from pathlib import Path
        os.makedirs(os.environ["ARTIFACTS_DIR"], exist_ok=True)
        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "runners.run_bvt_pytest"])

    - name: summarize-test-results
      displayName: Summarize BVT results
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: ARTIFACT_BROWSER_BASE
          value: $(params.ARTIFACT_BROWSER_URL)
        - name: ARTIFACT_BROWSER_REPO_PATH
          value: $(params.ARTIFACT_BROWSER_REPO_PATH)
        - name: PR_NAME
          value: $(params.PIPELINE_RUN_NAME)
        - name: TEST_OUTPUT_PATH
          value: $(results.TEST_OUTPUT.path)
        - name: NOTE_PREFIX
          value: BVT
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: WRITE_ARTIFACTS_URL
          value: "false"
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys
        from pathlib import Path
        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "steps.summarize_test_output"])

    - name: write-konflux-task-summary
      displayName: Write Konflux task summary
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
        - name: PIPELINE_TASK
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tekton.dev/pipelineTask']
        - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
        exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh"

    - name: check-test-output-gate
      displayName: Enforce BVT gate
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: TEST_OUTPUT_PATH
          value: $(results.TEST_OUTPUT.path)
        - name: GATE_LABEL
          value: BVT
        - name: GATE_STRICT
          value: "true"
        - name: ALLOW_ALL_SKIPPED_NOTE_PREFIX
          value: "bvt:"
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys
        from pathlib import Path
        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "steps.check_test_output_gate"])

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: olminstall-install-operator
spec:
  description: >-
    Install the ODH/RHOAI operator on the target cluster from the FBC catalog
    image in the Konflux snapshot. Patches pull secrets, runs olminstall install,
    and waits until the operator CSV reaches Succeeded.
  workspaces:
    - name: tests-shared
  params:
    - name: CONFORMA_GATE
      type: string
      default: ""
      description: Pipeline when-binding only (Conforma pass/fail from wait-for-conforma)
    - name: FBCF_IMAGE
      type: string
      description: FBCF catalog image from the Konflux snapshot (extract-fbcf-image)
    - name: UPDATE_CHANNEL
      type: string
      description: OLM subscription channel
    - name: OPERATOR_NAMESPACE
      type: string
    - name: OPERATOR_NAME
      type: string
      description: OLM package name (e.g. rhods-operator)
    - name: OLMINSTALL_REPO_URL
      type: string
    - name: OLMINSTALL_REPO_REVISION
      type: string
    - name: OLMINSTALL_CATALOG_NAME
      type: string
      description: CatalogSource name for install-operator.sh
    - name: SCRIPTS_REPO_URL
      type: string
    - name: SCRIPTS_REPO_REVISION
      type: string
    - name: QUAY_PULL_SECRET_NAME
      type: string
    - name: ROSA_HCP_KYVERNO_SECRET
      type: string
      default: rhoai-e2e-rosa-hcp-kyverno
      description: Tenant secret with Vault rosahcp-psquay-* and rosahcp-quay-kyverno-authenticate YAML
    - name: CLUSTER_SOURCE
      type: string
      default: ""
    - name: COMPONENTS_CSV
      type: string
    - name: RUN_BVT
      type: string
      default: "false"
    - name: PRODUCT
      type: string
      default: ""
      description: Product label for install logs (rhoai or odh)
    - name: RHOAI_VERSION
      type: string
      default: ""
      description: >-
        RHOAI catalog line from the FBC snapshot (Konflux UI + OPERATOR_VERSION fallback when CSV install fails)
  results:
    - name: INSTALL_STATUS
      description: SUCCESS or FAILED after OLM install and CSV verification
    - name: OPERATOR_VERSION
      description: Installed operator CSV version string
    - name: TASK_MESSAGE
      description: Pass/fail summary for Konflux task Results panel
  volumes:
    - name: credentials
      emptyDir: {}
    - name: quay-pull-secret
      secret:
        secretName: $(params.QUAY_PULL_SECRET_NAME)
    - name: rosa-hcp-kyverno
      secret:
        secretName: $(params.ROSA_HCP_KYVERNO_SECRET)
        optional: true
  stepTemplate:
    env:
      - name: OLMINSTALL_OC_VERBOSE
        value: "1"
      - name: PYTHONUNBUFFERED
        value: "1"
  steps:
    - name: clone-olminstall
      displayName: Clone olminstall repository
      image: quay.io/rhoai/rhoai-task-toolset:its@sha256:18b1af9b64d766478792849e49eed156464f678ef53b567a641a28444cacbfc9
      env:
        - name: REPO_URL
          value: $(params.OLMINSTALL_REPO_URL)
        - name: REPO_REV
          value: $(params.OLMINSTALL_REPO_REVISION)
        - name: DEST_DIR
          value: /workspace/olminstall
        - name: TLS_WORKAROUND
          value: "true"
        - name: OLMINSTALL_ALLOW_GIT_SSLVERIFY_FALSE
          value: "1"
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys

        sys.path.insert(0, os.environ["SCRIPTS_REPO_ROOT"])
        from steps.tekton_util import git_clone

        tls = os.environ.get("TLS_WORKAROUND", "").strip().lower() in ("1", "true", "yes")
        git_clone(os.environ["REPO_URL"], os.environ["REPO_REV"], os.environ["DEST_DIR"], tls_workaround=tls)

    - name: prepare-kubeconfig-ephc
      displayName: Stage EPHC kubeconfig
      when:
        - input: "$(params.CLUSTER_SOURCE)"
          operator: in
          values: ["", "EPHC"]
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      volumeMounts:
        - name: credentials
          mountPath: /credentials
      env:
        - name: TESTS_SHARED
          value: $(workspaces.tests-shared.path)
      script: |
        #!/bin/bash
        set -euo pipefail
        src="${TESTS_SHARED}/credentials/kubeconfig"
        if [[ ! -f "${src}" ]]; then
          echo "ERROR: EPHC kubeconfig missing at ${src} (expected stage-ephemeral-kubeconfig to stage it)" >&2
          exit 1
        fi
        cp "${src}" /credentials/kubeconfig
        echo "EPHC kubeconfig staged at /credentials/kubeconfig (from tests-shared)"

    - name: prepare-kubeconfig-external
      displayName: Load external kubeconfig
      when:
        - input: "$(params.CLUSTER_SOURCE)"
          operator: notin
          values: ["", "EPHC"]
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      volumeMounts:
        - name: credentials
          mountPath: /credentials
      env:
        - name: CLUSTER_SOURCE
          value: $(params.CLUSTER_SOURCE)
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys

        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "steps.stage_kubeconfig_for_task"])

    - name: patch-cluster-pull-secret
      displayName: Patch cluster pull secret
      image: quay.io/rhoai/rhoai-task-toolset:its@sha256:18b1af9b64d766478792849e49eed156464f678ef53b567a641a28444cacbfc9
      volumeMounts:
        - name: credentials
          mountPath: /credentials
        - name: quay-pull-secret
          mountPath: /var/secret/quay
          readOnly: true
        - name: rosa-hcp-kyverno
          mountPath: /var/secret/rosa-hcp-kyverno
          readOnly: true
      env:
        - name: KUBECONFIG
          value: /credentials/kubeconfig
        - name: ROSA_HCP_KYVERNO_POLICY_DIR
          value: /var/secret/rosa-hcp-kyverno
        - name: ROSA_HCP_QUAY_AUTH_PATH
          value: /var/secret/rosa-hcp-kyverno/.dockerconfigjson
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys

        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "install.patch_cluster_pull_secret"])

    - name: install-and-verify
      displayName: Install operator and verify CSV
      image: quay.io/rhoai/rhoai-task-toolset:its@sha256:18b1af9b64d766478792849e49eed156464f678ef53b567a641a28444cacbfc9
      volumeMounts:
        - name: credentials
          mountPath: /credentials
        - name: rosa-hcp-kyverno
          mountPath: /var/secret/rosa-hcp-kyverno
          readOnly: true
      env:
        - name: KUBECONFIG
          value: /credentials/kubeconfig
        - name: ROSA_HCP_KYVERNO_POLICY_DIR
          value: /var/secret/rosa-hcp-kyverno
        - name: FBCF_IMAGE
          value: $(params.FBCF_IMAGE)
        - name: UPDATE_CHANNEL
          value: $(params.UPDATE_CHANNEL)
        - name: OPERATOR_NAMESPACE
          value: $(params.OPERATOR_NAMESPACE)
        - name: OPERATOR_NAME
          value: $(params.OPERATOR_NAME)
        - name: OLMINSTALL_DIR
          value: /workspace/olminstall
        - name: OLMINSTALL_CATALOG_NAME
          value: $(params.OLMINSTALL_CATALOG_NAME)
        - name: QUAY_PULL_SECRET_NAME
          value: $(params.QUAY_PULL_SECRET_NAME)
        - name: INSTALL_STATUS_PATH
          value: $(results.INSTALL_STATUS.path)
        - name: OPERATOR_VERSION_PATH
          value: $(results.OPERATOR_VERSION.path)
        - name: COMPONENTS_CSV
          value: $(params.COMPONENTS_CSV)
        - name: RUN_BVT
          value: $(params.RUN_BVT)
        - name: PRODUCT
          value: $(params.PRODUCT)
        - name: RHOAI_VERSION
          value: $(params.RHOAI_VERSION)
        - name: CLUSTER_SOURCE
          value: $(params.CLUSTER_SOURCE)
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys

        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "install.install_and_verify"])

    - name: mirror-rosa-hcp-imagestreams-post-install
      displayName: Mirror ROSA HCP imagestreams
      image: quay.io/rhoai/rhoai-task-toolset:its@sha256:18b1af9b64d766478792849e49eed156464f678ef53b567a641a28444cacbfc9
      volumeMounts:
        - name: credentials
          mountPath: /credentials
      env:
        - name: KUBECONFIG
          value: /credentials/kubeconfig
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys

        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "install.rosa_hcp_imagestream_mirror"])
    - name: write-konflux-task-summary
      displayName: Write Konflux task summary
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
        - name: PIPELINE_TASK
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tekton.dev/pipelineTask']
        - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
        exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh"

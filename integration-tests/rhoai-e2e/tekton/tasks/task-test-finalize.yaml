apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhoai-e2e-test-finalize
spec:
  description: >-
    Runs after all component test tasks. Merges per-component JUnit and TEST_OUTPUT
    from tests-shared into one component aggregate summary (smoke and tier1 phases),
    merges bvt and component lines for the UI, checks that test prepare left the shared
    workspace ready, then enforces bvt (strict) and component (99%/80% pass-rate tiers
    on executed tests) gates. Per-component minPassRateForSuccess in each test-* task
    still controls component-test.exit for finalize; OCI upload is in publish-results.
  params:
    - name: COMPONENTS_CSV
      type: string
      default: ""
    - name: COMPONENT_TEST_TIMEOUT
      type: string
      default: ""
    - name: FAIL_FAST_DISABLED_COMPONENT
      type: string
      default: "true"
    - name: SMOKE_AWS_SECRET
      type: string
      default: "unused-smoke-aws-secret"
    - name: CLUSTER_SOURCE
      type: string
      default: ""
    - name: PRODUCT
      type: string
      default: ""
    - name: TEST_GATES
      type: string
      default: ""
    - name: ARTIFACT_BROWSER_URL
      type: string
    - name: ARTIFACT_BROWSER_REPO_PATH
      type: string
    - name: PIPELINE_RUN_NAME
      type: string
  workspaces:
    - name: tests-shared
  results:
    - name: TEST_OUTPUT
      description: Combined pass/fail summary for all component smoke tests (Konflux TEST_OUTPUT JSON)
    - name: TASK_MESSAGE
      description: Pass/fail summary for Konflux task Results panel
    - name: TESTS_SUMMARY
      description: Combined pass/fail totals (separate Konflux Results row)
    - name: BVT_GATE
      description: BVT gate stats (separate Konflux Results row; newlines in TASK_MESSAGE are not rendered)
    - name: SMOKE_GATE
      description: Component smoke gate stats (separate Konflux Results row)
  steps:
    - name: summarize-test-results
      displayName: Summarize component test results
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: ARTIFACT_BROWSER_BASE
          value: $(params.ARTIFACT_BROWSER_URL)
        - name: ARTIFACT_BROWSER_REPO_PATH
          value: $(params.ARTIFACT_BROWSER_REPO_PATH)
        - name: PR_NAME
          value: $(params.PIPELINE_RUN_NAME)
        - name: TEST_OUTPUT_PATH
          value: $(results.TEST_OUTPUT.path)
        - name: NOTE_PREFIX
          value: Component
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload
        - name: JUNIT_RECURSIVE
          value: "true"
        - name: WRITE_ARTIFACTS_URL
          value: "false"
        - name: APPLY_TEST_FINALIZE_PASS_RATE
          value: "true"
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys
        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "steps.summarize_test_output"])

    - name: write-combined-test-output
      displayName: Combine bvt and smoke summary
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: TEST_OUTPUT_PATH
          value: $(results.TEST_OUTPUT.path)
        - name: SMOKE_TEST_OUTPUT_PATH
          value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-smoke-test-output.json
        - name: BVT_TEST_OUTPUT_PATH
          value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-bvt-test-output.json
        - name: PIPELINE_RUN_NAME
          value: $(params.PIPELINE_RUN_NAME)
        - name: TEST_GATES
          value: $(params.TEST_GATES)
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys
        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "runners.report.write_finalize_test_output"])

    - name: finalize-component-tests
      displayName: Verify test prepare ran
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys
        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "steps.finalize_component_tests"])

    - name: write-konflux-task-summary
      displayName: Write Konflux task summary
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
        - {name: TEST_OUTPUT_PATH, value: $(results.TEST_OUTPUT.path)}
        - {name: TESTS_SUMMARY_PATH, value: $(results.TESTS_SUMMARY.path)}
        - {name: BVT_GATE_PATH, value: $(results.BVT_GATE.path)}
        - {name: SMOKE_GATE_PATH, value: $(results.SMOKE_GATE.path)}
        - name: SMOKE_TEST_OUTPUT_PATH
          value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-smoke-test-output.json
        - name: BVT_TEST_OUTPUT_PATH
          value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-bvt-test-output.json
        - name: TEST_GATES
          value: $(params.TEST_GATES)
        - name: PIPELINE_TASK
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tekton.dev/pipelineTask']
        - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
        exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh"

    - name: check-pipeline-test-gate
      displayName: Enforce bvt and smoke gates
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: PIPELINE_RUN_NAME
          value: $(params.PIPELINE_RUN_NAME)
        - name: TEST_GATES
          value: $(params.TEST_GATES)
        - name: SMOKE_TEST_OUTPUT_PATH
          value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-smoke-test-output.json
        - name: BVT_TEST_OUTPUT_PATH
          value: $(workspaces.tests-shared.path)/tests-payload/.rhoai-e2e-bvt-test-output.json
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env python3
        import os, sys
        os.chdir(os.environ["SCRIPTS_REPO_ROOT"])
        os.execvp(sys.executable, [sys.executable, "-m", "runners.report.check_pipeline_test_gate"])

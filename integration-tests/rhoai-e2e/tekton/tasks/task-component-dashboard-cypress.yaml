apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhoai-e2e-component-dashboard-cypress
spec:
  description: >-
    Run Dashboard Cypress E2E smoke tests: clone odh-dashboard, run tagged
    Cypress suites in parallel, and write per-component TEST_OUTPUT.
  params:
    - name: COMPONENT_ID
      type: string
    - name: COMPONENT_IMAGE
      type: string
      description: Cypress runtime image (clone odh-dashboard at test time; not baked odh-cypress)
    - name: PRODUCT
      type: string
      default: ""
    - name: CLUSTER_SOURCE
      type: string
      default: ""
    - name: COMPONENT_TEST_TIMEOUT
      type: string
      default: ""
    - name: TEST_TAGS
      type: string
      default: ""
    - name: FAIL_FAST_DISABLED_COMPONENT
      type: string
      default: "true"
    - name: TEST_GATES
      type: string
      default: ""
    - name: COMPONENT_VAULT_SECRET
      type: string
      default: "vault-approle"
    - name: ARTIFACT_BROWSER_URL
      type: string
    - name: ARTIFACT_BROWSER_REPO_PATH
      type: string
    - name: PIPELINE_RUN_NAME
      type: string
  workspaces:
    - name: tests-shared
  results:
    - name: TEST_OUTPUT
      description: Per-component pass/fail summary for this smoke run (Konflux TEST_OUTPUT JSON)
    - name: TASK_MESSAGE
      description: Pass/fail summary for Konflux task Results panel
  volumes:
    - name: vault-approle
      secret:
        secretName: vault-approle
        optional: true
    - name: tenant-test-secrets
      secret:
        optional: true
        secretName: $(params.COMPONENT_VAULT_SECRET)
    - name: component-vault-credentials
      emptyDir:
        medium: Memory
  steps:
    # run_component_golang writes component-golang.env consumed by run-cypress-tests.
    - name: orchestrate-cypress-test
      displayName: Prepare Cypress test run
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      volumeMounts:
        - name: vault-approle
          mountPath: /vault-approle
          readOnly: true
        - name: tenant-test-secrets
          mountPath: /tenant-test-secrets
          readOnly: true
        - name: component-vault-credentials
          mountPath: /component-vault-credentials
      env:
        - name: KUBECONFIG
          value: $(workspaces.tests-shared.path)/credentials/kubeconfig
        - name: COMPONENT_TEST_COMPONENT_ID
          value: $(params.COMPONENT_ID)
        - name: COMPONENT_TEST_PLAN_JSON
          value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: PRODUCT
          value: $(params.PRODUCT)
        - name: CLUSTER_SOURCE
          value: $(params.CLUSTER_SOURCE)
        - name: COMPONENT_TEST_TIMEOUT
          value: $(params.COMPONENT_TEST_TIMEOUT)
        - name: TEST_TAGS
          value: $(params.TEST_TAGS)
        - name: FAIL_FAST_DISABLED_COMPONENT
          value: $(params.FAIL_FAST_DISABLED_COMPONENT)
        - name: TEST_GATES
          value: $(params.TEST_GATES)
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
        - name: OLMINSTALL_ALLOW_GIT_SSLVERIFY_FALSE
          value: "1"
      script: |
        #!/usr/bin/env python3
        import os, sys
        from pathlib import Path
        repo = Path(os.environ["SCRIPTS_REPO_ROOT"])
        if not repo.is_dir():
            print(f"ERROR: {repo} missing", file=sys.stderr)
            sys.exit(2)
        os.chdir(repo)
        os.execvp(sys.executable, [sys.executable, "-m", "runners.run_component_golang"])
    - name: run-cypress-tests
      displayName: Run Cypress tests
      onError: continue
      image: $(params.COMPONENT_IMAGE)
      computeResources:
        limits:
          memory: 8Gi
          cpu: "4"
        requests:
          memory: 4Gi
          cpu: "1"
      volumeMounts:
        - name: vault-approle
          mountPath: /vault-approle
          readOnly: true
        - name: tenant-test-secrets
          mountPath: /tenant-test-secrets
          readOnly: true
        - name: component-vault-credentials
          mountPath: /component-vault-credentials
      env:
        - name: KUBECONFIG
          value: $(workspaces.tests-shared.path)/credentials/kubeconfig
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: COMPONENT_TEST_TIMEOUT
          value: $(params.COMPONENT_TEST_TIMEOUT)
        - name: PRODUCT
          value: $(params.PRODUCT)
        - name: CLUSTER_SOURCE
          value: $(params.CLUSTER_SOURCE)
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
        - name: CY_RETRY
          value: "1"
        - name: LIBGL_ALWAYS_SOFTWARE
          value: "1"
        - name: MESA_SHADER_CACHE_DISABLE
          value: "true"
        - name: ELECTRON_DISABLE_GPU
          value: "1"
        - name: UV_THREADPOOL_SIZE
          value: "4"
        - name: ELECTRON_NO_ATTACH_CONSOLE
          value: "1"
        - name: RHCL_GATEWAY_FAIL_FAST
          value: "1"
      script: |
        #!/usr/bin/env python3
        import os, sys
        from pathlib import Path
        repo = Path(os.environ["SCRIPTS_REPO_ROOT"])
        if not repo.is_dir():
            print(f"ERROR: {repo} missing", file=sys.stderr)
            sys.exit(2)
        os.chdir(repo)
        os.execvp(sys.executable, [sys.executable, "-m", "runners.run_component_cypress"])

    - name: summarize-component-results
      displayName: Summarize this component
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: COMPONENT_ID
          value: $(params.COMPONENT_ID)
        - name: COMPONENT_TEST_PLAN_JSON
          value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
        - name: ARTIFACT_BROWSER_BASE
          value: $(params.ARTIFACT_BROWSER_URL)
        - name: ARTIFACT_BROWSER_REPO_PATH
          value: $(params.ARTIFACT_BROWSER_REPO_PATH)
        - name: PR_NAME
          value: $(params.PIPELINE_RUN_NAME)
        - name: TEST_OUTPUT_PATH
          value: $(results.TEST_OUTPUT.path)
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: WRITE_ARTIFACTS_URL
          value: "false"
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 2
        exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_rhoai_e2e_python_step.sh" steps.summarize_test_output
    - name: write-konflux-task-summary
      displayName: Write Konflux task summary
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
        - name: TEST_OUTPUT_PATH
          value: $(results.TEST_OUTPUT.path)
        - name: COMPONENT_ID
          value: $(params.COMPONENT_ID)
        - name: COMPONENT_TEST_PLAN_JSON
          value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: PIPELINE_TASK
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tekton.dev/pipelineTask']
        - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
        exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh"

    - name: finalize-component-exit
      displayName: Record component pass/fail
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: COMPONENT_ID
          value: $(params.COMPONENT_ID)
        - name: COMPONENT_TEST_PLAN_JSON
          value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 2
        exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_rhoai_e2e_python_step.sh" steps.finalize_component_task_exit

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rhoai-e2e-component-playwright
spec:
  description: >-
    Run Playwright smoke tests for workbench images using the component test
    image. Orchestrates the run, collects JUnit, and writes per-component TEST_OUTPUT.
  params:
    - name: COMPONENT_ID
      type: string
    - name: COMPONENT_IMAGE
      type: string
      description: workbench-images-tests Playwright image
    - name: PRODUCT
      type: string
      default: ""
    - name: CLUSTER_SOURCE
      type: string
      default: ""
    - name: COMPONENT_TEST_TIMEOUT
      type: string
      default: ""
    - name: FAIL_FAST_DISABLED_COMPONENT
      type: string
      default: "true"
    - name: TEST_GATES
      type: string
      default: ""
    - name: TEST_TAGS
      type: string
      default: ""
    - name: COMPONENT_VAULT_SECRET
      type: string
      default: "vault-approle"
    - name: ARTIFACT_BROWSER_URL
      type: string
    - name: ARTIFACT_BROWSER_REPO_PATH
      type: string
    - name: PIPELINE_RUN_NAME
      type: string
  workspaces:
    - name: tests-shared
  results:
    - name: TEST_OUTPUT
      description: Per-component pass/fail summary for this smoke run (Konflux TEST_OUTPUT JSON)
    - name: TASK_MESSAGE
      description: Pass/fail summary for Konflux task Results panel
  volumes:
    - name: vault-approle
      secret:
        secretName: vault-approle
        optional: true
    - name: tenant-test-secrets
      secret:
        optional: true
        secretName: $(params.COMPONENT_VAULT_SECRET)
    - name: component-vault-credentials
      emptyDir: {}
  steps:

    - name: orchestrate-playwright-test
      displayName: Prepare Playwright test run
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      volumeMounts:
        - name: vault-approle
          mountPath: /vault-approle
          readOnly: true
        - name: tenant-test-secrets
          mountPath: /tenant-test-secrets
          readOnly: true
        - name: component-vault-credentials
          mountPath: /component-vault-credentials
      env:
        - name: KUBECONFIG
          value: $(workspaces.tests-shared.path)/credentials/kubeconfig
        - name: COMPONENT_TEST_COMPONENT_ID
          value: $(params.COMPONENT_ID)
        - name: COMPONENT_TEST_PLAN_JSON
          value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: PRODUCT
          value: $(params.PRODUCT)
        - name: CLUSTER_SOURCE
          value: $(params.CLUSTER_SOURCE)
        - name: COMPONENT_TEST_TIMEOUT
          value: $(params.COMPONENT_TEST_TIMEOUT)
        - name: FAIL_FAST_DISABLED_COMPONENT
          value: $(params.FAIL_FAST_DISABLED_COMPONENT)
        - name: TEST_GATES
          value: $(params.TEST_GATES)
        - name: TEST_TAGS
          value: $(params.TEST_TAGS)
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
        - name: OLMINSTALL_ALLOW_GIT_SSLVERIFY_FALSE
          value: "1"
      script: |
        #!/usr/bin/env python3
        import os, sys
        from pathlib import Path
        repo = Path(os.environ["SCRIPTS_REPO_ROOT"])
        if not repo.is_dir():
            print(f"ERROR: {repo} missing", file=sys.stderr)
            sys.exit(2)
        os.chdir(repo)
        os.execvp(sys.executable, [sys.executable, "-m", "runners.run_component_golang"])
    - name: run-playwright-tests
      displayName: Run Playwright tests
      onError: continue
      image: $(params.COMPONENT_IMAGE)
      computeResources:
        limits:
          memory: 8Gi
          cpu: "4"
        requests:
          memory: 4Gi
          cpu: "1"
      volumeMounts:
        - name: vault-approle
          mountPath: /vault-approle
          readOnly: true
        - name: tenant-test-secrets
          mountPath: /tenant-test-secrets
          readOnly: true
        - name: component-vault-credentials
          mountPath: /component-vault-credentials
      env:
        - name: KUBECONFIG
          value: $(workspaces.tests-shared.path)/credentials/kubeconfig
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: COMPONENT_ID
          value: $(params.COMPONENT_ID)
        - name: COMPONENT_TEST_TIMEOUT
          value: $(params.COMPONENT_TEST_TIMEOUT)
        - name: CI
          value: "true"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        ARTIFACTS="${ARTIFACTS_DIR:-/artifacts}"
        mkdir -p "$ARTIFACTS"
        ENVFILE="${ARTIFACTS}/component-golang-${COMPONENT_ID}.env"
        if [ ! -f "$ENVFILE" ]; then
          echo "ERROR: missing $ENVFILE (orchestrate step did not run)" >&2
          PFX="${ARTIFACT_PREFIX:-${COMPONENT_ID}-smoke}"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<testsuite name="%s" tests="1" failures="1"><testcase classname="%s" name="orchestration_failure"><failure message="Missing orchestration env file"/></testcase></testsuite>\n' \
            "${COMPONENT_ID}" "${COMPONENT_ID}" > "${ARTIFACTS}/${PFX}.xml"
          echo "2" > "${ARTIFACTS}/component-test.exit"
          exit 2
        fi
        # shellcheck disable=SC1090
        source "$ENVFILE"
        if [ "${SKIP:-false}" = "true" ]; then
          echo "SKIP playwright tests (orchestrate marked skip)"
          exit 0
        fi
        mkdir -p "${WORKING_DIR}/.kube"
        cp "$KUBECONFIG" "${WORKING_DIR}/.kube/config"
        export KUBECONFIG="${WORKING_DIR}/.kube/config"
        cd "$WORKING_DIR"
        if [ -d /component-vault-credentials ]; then
          for f in /component-vault-credentials/*; do
            [ -f "$f" ] || continue
            key="$(basename "$f")"
            [ "$key" = "AWS_CA_BUNDLE" ] && continue
            if [ -z "${!key:-}" ]; then
              export "$key=$(tr -d '\n' < "$f")"
            fi
          done
        fi
        export KUBECONFIG="${WORKING_DIR}/.kube/config"
        unset KUBERNETES_SERVICE_HOST KUBERNETES_SERVICE_PORT KUBERNETES_PORT \
          KUBERNETES_PORT_443_TCP KUBERNETES_PORT_443_TCP_ADDR KUBERNETES_PORT_443_TCP_PORT \
          KUBERNETES_PORT_443_TCP_PROTO || true
        echo "Running (playwright): ${RUN_COMMAND}"
        set +e
        if [ -n "${TEST_TIMEOUT_SEC:-}" ]; then
          timeout "${TEST_TIMEOUT_SEC}s" bash -c "${RUN_COMMAND}"
        else
          eval "${RUN_COMMAND}"
        fi
        ec=$?
        set -e
        found=
        while IFS= read -r -d '' f; do
          cp "$f" "${ARTIFACTS}/${ARTIFACT_PREFIX}.xml"
          found=1
          break
        done < <(find "$RESULTS_DIR" -name '*unit*.xml' -print0 2>/dev/null || true)
        if [ -z "$found" ]; then
          while IFS= read -r -d '' f; do
            cp "$f" "${ARTIFACTS}/${ARTIFACT_PREFIX}.xml"
            found=1
            break
          done < <(find "$RESULTS_DIR" -name 'junit.xml' -print0 2>/dev/null || true)
        fi
        if [ -z "$found" ]; then
          if [ "$ec" -ne 0 ]; then
            echo "WARN: no JUnit under ${RESULTS_DIR}; writing synthetic failure" >&2
            PFX="${ARTIFACT_PREFIX:-${COMPONENT_ID}-smoke}"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<testsuite name="%s" tests="1" failures="1" errors="0" skipped="0" time="0">\n  <testcase classname="%s" name="execution_failure" time="0">\n    <failure message="Component tests failed with exit %s (no JUnit produced)">\n      Check console logs for details.\n    </failure>\n  </testcase>\n</testsuite>\n' "${COMPONENT_ID}" "${COMPONENT_ID}" "$ec" > "${ARTIFACTS}/${PFX}.xml"
          else
            echo "WARN: no JUnit under ${RESULTS_DIR}" >&2
          fi
        fi
        echo "$ec" > "${ARTIFACTS}/component-test.exit"
        exit "$ec"

    - name: summarize-component-results
      displayName: Summarize this component
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: COMPONENT_ID
          value: $(params.COMPONENT_ID)
        - name: COMPONENT_TEST_PLAN_JSON
          value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
        - name: ARTIFACT_BROWSER_BASE
          value: $(params.ARTIFACT_BROWSER_URL)
        - name: ARTIFACT_BROWSER_REPO_PATH
          value: $(params.ARTIFACT_BROWSER_REPO_PATH)
        - name: PR_NAME
          value: $(params.PIPELINE_RUN_NAME)
        - name: TEST_OUTPUT_PATH
          value: $(results.TEST_OUTPUT.path)
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: WRITE_ARTIFACTS_URL
          value: "false"
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 2
        exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_rhoai_e2e_python_step.sh" steps.summarize_test_output
    - name: write-konflux-task-summary
      displayName: Write Konflux task summary
      onError: continue
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - {name: TASK_MESSAGE_PATH, value: $(results.TASK_MESSAGE.path)}
        - name: TEST_OUTPUT_PATH
          value: $(results.TEST_OUTPUT.path)
        - name: COMPONENT_ID
          value: $(params.COMPONENT_ID)
        - name: COMPONENT_TEST_PLAN_JSON
          value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: PIPELINE_TASK
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tekton.dev/pipelineTask']
        - {name: SCRIPTS_REPO_ROOT, value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 0
        exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_write_task_message.sh"

    - name: finalize-component-exit
      displayName: Record component pass/fail
      image: quay.io/konflux-ci/konflux-test:stable@sha256:09328e5f47da168ffe951ec9c4242cd6761e61e0a235df1bba3f5158e757446d
      env:
        - name: COMPONENT_ID
          value: $(params.COMPONENT_ID)
        - name: COMPONENT_TEST_PLAN_JSON
          value: $(workspaces.tests-shared.path)/tests-payload/component-test-plan.json
        - name: ARTIFACTS_DIR
          value: $(workspaces.tests-shared.path)/tests-payload/results
        - name: SCRIPTS_REPO_ROOT
          value: $(workspaces.tests-shared.path)/scripts-repo/integration-tests/rhoai-e2e
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [[ -n "${SCRIPTS_REPO_ROOT:-}" ]] || exit 2
        exec bash "${SCRIPTS_REPO_ROOT}/tekton/scripts/run_rhoai_e2e_python_step.sh" steps.finalize_component_task_exit

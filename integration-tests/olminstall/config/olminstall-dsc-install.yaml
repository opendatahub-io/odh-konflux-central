# DSC install policy for olminstall (Jenkins odhcluster / generateTestConfigFile parity).
# Used at install-rhoai to build default-dsc managementState from COMPONENTS_CSV + operator version.
# Component prep tasks enable Managed at test time via the same smokeComponents keys (installRemoved not applied).
#
# Maintain when Jenkins shift-left or odhcluster changes per-version DSC defaults.
schemaVersion: 1

# Smoke catalog id -> DSC spec.components keys this suite needs when selected.
smokeComponents:
  dashboard_cypress:
    keys: [dashboard, modelregistry, workbenches, kserve, aipipelines, feastoperator]
  workbenches:
    keys: [dashboard, workbenches]
    pre35ExtraKeys: [trainingoperator]
  model_registry:
    keys: [modelregistry]
  model_server:
    keys: [kserve]
  model_runtime:
    keys: [kserve]
  maas_billing:
    keys: [kserve]
  ai_safety:
    keys: [trustyai, kserve]
  ai_safety_evalhub:
    keys: [trustyai, kserve]
  ai_safety_guardrails:
    keys: [trustyai, kserve]
  ai_safety_lmeval:
    keys: [trustyai, kserve]
  ai_safety_trustyai_operator:
    keys: [trustyai, kserve]
  ai_safety_trustyai_service:
    keys: [trustyai, kserve]
  ai_pipelines:
    keys: [aipipelines]
  kuberay:
    keys: [ray]
  mlflow:
    keys: [mlflowoperator]
  llama_stack:
    keys: [llamastackoperator]
  ogx:
    keys: [ogx]
  trainer:
    keys: [trainer]
    pre35ExtraKeys: [trainingoperator]
  distributed_workloads:
    keys: [ray, trainer]
    pre35ExtraKeys: [trainingoperator]
  spark_operator:
    keys: [sparkoperator]
  codeflare_sdk:
    keys: [ray, codeflare]

# Install-time overrides by installed RHOAI version (first matching band wins).
installPolicy:
  versionBands:
    - minRhoai: "3.5"
      comment: >
        Jenkins autotrigger-smoke 3.5 EA: defer ogx, llama, spark, trainingoperator at install;
        component tasks patch Managed before pytest.
      installRemoved:
        - llamastackoperator
        - ogx
        - sparkoperator
        - trainingoperator

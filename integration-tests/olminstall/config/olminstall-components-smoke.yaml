# Per-component smoke suites for olminstall Konflux (opendatahub-tests pytest only).
# Used when TESTS includes phase id ``smoke`` and pipeline param COMPONENTS selects ids below.
#
# schemaVersion 2: each entry has two blocks:
#   component: — pytest selection mirrored from TestOps Jenkins shift-left configs
#   konflux:   — pipeline-only execution policy (timeouts, secrets, runners, pass-rate policy)
#
# Maintaining ``component:`` (manual copy from TestOps Jenkins — not cloned at runtime):
#   1. Open TestOps Jenkins repo (GitLab ``ods/jenkins``).
#   2. For each component, read
#      ``resources/configs/components-testing/components/<name>/main.yaml``.
#   3. Copy pytest-related fields into the matching ``component:`` block here
#      (merge.metadata, merge.image.args, merge.qualityGatesMap, konfluxRepoMapKeys, …).
#   4. Leave ``konflux:`` unchanged unless Konflux pipeline behavior should change.
#   There is no automated sync; update this file when upstream ``main.yaml`` changes.
#   Optional drift check: ``python3 -m suite.verify_catalog_parity`` (needs JENKINS_REPO).
# ``konflux.description`` — operator-facing Konflux task Details text (no Jenkins paths, Jira
# tickets, secret names, or internal param names). Runtime wiring belongs in other ``konflux:``
# fields; regenerate Tekton tasks after description edits.
#
# Omit pipeline/CLI param COMPONENTS (empty) or set ``all`` / ``--components all`` to run smoke
# for every enabled catalog id; set COMPONENTS or --components to a comma list to restrict.
# Cluster/operator health is BVT (``TESTS`` includes ``bvt``), not smoke.
#
schemaVersion: 2

# Konflux-only defaults for component smoke (not in TestOps Jenkins components-testing).
# DSC install managementState per RHOAI version: olminstall-dsc-install.yaml (edit) +
# olminstall-dsc-install.json (stdlib load in Tekton; keep in sync with YAML).
konflux:
  # Tenant Secret in rhoai-tenant with Vault shift-left / envFileModelServing keys (CI_S3_*, MODELS_S3_*, AWS_*).
  shiftLeftEnvSecret: shiftleft-envfile-model-serving
  # Per-gate defaults; components set componentTestTimeoutByGate.smoke (and optional tier1 override).
  defaultComponentTestTimeoutByGate:
    tier1: 45m

components:
  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
      merge:
        metadata:
          name: workbenches
          konfluxRepoMapKeys:
            - kubeflow
            - odh-dashboard
            - eval-hub
            - pipelines-components
            - ai-gateway-payload-processing
        image:
          args:
            - -o junit_suite_name=workbenches
            - tests/workbenches/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: workbenches
      description: Workbench lifecycle and image smoke tests for RHOAI workbenches.
      pytestExtraArgs: "--tc use_unprivileged_client:False -k 'not trainer_imagestreams and not older_tags_health'"
      requiresMinimalDeps: true
      setupDependenciesArgs: "-M"
      artifactPrefix: workbenches-smoke
      minPassRateForSuccess: 0.9
      componentTestTimeoutByGate:
        smoke: 10m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
      merge:
        metadata:
          name: ai-hub
          konfluxRepoMapKeys:
            - model-registry
            - model-registry-operator
            - odh-model-registry-operator
            - ml-metadata
        image:
          args:
            - -o junit_suite_name=ai-hub
            - tests/ai_hub/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: model_registry
      description: >
        AI Hub and Model Registry smoke tests.
      pytestExtraArgs: "--tc use_unprivileged_client:False"
      minPassRateForSuccess: 0.9
      componentTestTimeoutByGate:
        smoke: 20m
        tier1: 45m
  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
      merge:
        metadata:
          name: model-server
          konfluxRepoMapKeys:
            - kserve
            - odh-model-controller
            - kserve-autogluon-server
            - kube-auth-proxy
            - kube-rbac-proxy
        image:
          args:
            - -ra
            - -o junit_suite_name=model_server
            - tests/model_serving/model_server/
        qualityGatesMap:
          default:
            smoke: "-m 'smoke and not downstream_only'"
            tier1: "-m tier1"
    konflux:
      id: model_server
      description: >
        Model Server / KServe smoke tests. Opt-in on external clusters; needs cloud storage
        and/or LDAP credentials. On EPHC, minimal dependencies are installed before the operator.
      pytestExtraArgs: "--tc use_unprivileged_client:False -k 'not TestMLServerModelCar and not TestLLMDSmoke'"
      requiresMinimalDeps: true
      setupDependenciesArgs: "-M"
      minPassRateForSuccess: 0.9
      requiresShiftLeftEnv: true
      componentTestTimeoutByGate:
        smoke: 10m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
      merge:
        metadata:
          name: model-runtime
          konfluxRepoMapKeys:
            - batch-gateway
            - llm-d-inference-scheduler
            - llm-d-kv-cache
            - vllm-orchestrator-gateway
        image:
          args:
            - -o junit_suite_name=model_runtime
            - tests/model_serving/model_runtime/
        qualityGatesMap:
          default:
            smoke: "-m smoke --supported-accelerator-type CPU_x86"
            tier1: "-m tier1"
    konflux:
      id: model_runtime
      description: >
        Model Runtime smoke tests. Opt-in on external clusters; many cases need cloud credentials.
      pytestExtraArgs: "--tc use_unprivileged_client:False -k 'not TestMLServerModelCar and not TestLLMDSmoke and not TestVllmCpuX86S3Inference and not TestVllmProbeHealth'"
      minPassRateForSuccess: 0.9
      nonBlockingOnTimeout: true
      requiresShiftLeftEnv: true
      componentTestTimeoutByGate:
        smoke: 25m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 3.3
      merge:
        metadata:
          name: maas_billing
          konfluxRepoMapKeys:
            - models-as-a-service
        image:
          args:
            - -o junit_suite_name=maas_billing
            - tests/model_serving/maas_billing/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: maas_billing
      description: >
        Models-as-a-Service billing smoke tests. May fail on external pooled clusters until
        MaaS auth gateway setup completes within the task timeout.
        EPHC HyperShift blocks OAuth IdP patches — keep unprivileged client off (admin SA).
      pytestExtraArgs: "--tc use_unprivileged_client:False"
      minPassRateForSuccess: 0.9
      nonBlockingOnTimeout: true
      componentTestTimeoutByGate:
        smoke: 20m
        tier1: 45m
      requiresShiftLeftEnv: true

  - component:
      merge:
        metadata:
          name: ai-pipelines
          konfluxRepoMapKeys:
            - ds-pipelines
            - data-science-pipelines
            - data-science-pipelines-operator
            - argo-workflows
        qualityGatesMap:
          default:
            smoke: "--label-filter=Smoke"
            tier1: "--label-filter=Tier1"
    konflux:
      id: ai_pipelines
      description: >
        Data Science Pipelines (DSP) smoke tests via the ds-pipelines ginkgo suite.
      artifactPrefix: ai-pipelines-smoke
      runner:
        type: golang-ginkgo
        image: quay.io/opendatahub/ds-pipelines-tests:master
        workingDir: /dspa/backend/test/images
        resultsDir: /dspa/backend/test/end2end/reports
        # Tenant Secret name (RFC 1123); Jenkins Vault key is envFilePipelines at apps/rhods-ci/shift-left.
        vaultSecretKey: envfile-pipelines
        envDefaults:
          NAMESPACE: dspa-test
          DSPA_NAME: dspa
          IN_CLUSTER_MODE: "false"
        phaseCommands:
          smoke: "bash test-run.sh --label-filter=Smoke"
          tier1: "bash test-run.sh --label-filter=Tier1"
      componentTestTimeoutByGate:
        smoke: 15m
        tier1: 45m

  - component:
      merge:
        metadata:
          name: kuberay
          konfluxRepoMapKeys:
            - kuberay
            - codeflare-operator
        qualityGatesMap:
          default:
            smoke: "-testTier=Smoke"
            tier1: "-testTier=Tier1"
    konflux:
      id: kuberay
      description: >
        KubeRay and CodeFlare operator smoke tests.
      artifactPrefix: kuberay-smoke
      runner:
        type: golang-test-tier
        image: quay.io/opendatahub/kuberay-tests:latest
        workingDir: /kuberay/tests
        resultsDir: /kuberay/tests/results
        phaseCommands:
          smoke: "bash run-tests.sh -testTier=Smoke"
          tier1: "bash run-tests.sh -testTier=Tier1"
      componentTestTimeoutByGate:
        smoke: 15m
        tier1: 45m

  - component:
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 3.4
      merge:
        metadata:
          name: mlflow
          konfluxRepoMapKeys:
            - mlflow
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: mlflow
      description: >
        MLflow operator and tracking server smoke tests.
      artifactPrefix: mlflow-smoke
      runner:
        type: external-pytest
        image: quay.io/opendatahub/mlflow-tests:main
        workingDir: /mlflow
        resultsDir: /mlflow/results
        vaultSecretKey: envfile-mlflow
        envDefaults:
          # Pooled external clusters already have MLflow operator Managed; skip CSV patch race.
          DEPLOY_MLFLOW_OPERATOR: "false"
          # ARTIFACT_BACKENDS, S3, and DB settings come from tenant secret envfile-mlflow (Jenkins envFileMlflow).
        phaseCommands:
          smoke: "bash mlflow-tests/images/test-run.sh -o junit_suite_name=mlflow-e2e -m smoke"
          tier1: "bash mlflow-tests/images/test-run.sh -o junit_suite_name=mlflow-e2e -m tier1"
      componentTestTimeoutByGate:
        smoke: 20m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 3.5
      merge:
        metadata:
          name: ogx
          konfluxRepoMapKeys:
            - ogx-distribution
        image:
          args:
            - -o junit_suite_name=ogx
            - tests/ogx/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: ogx
      description: >
        Red Hat OGX Distribution smoke tests. Catalog keeps Jenkins baseline (-k not pgvector).
        verify_images skips apply on EPHC and EXTERNAL (mirrored) clusters via the
        pytest runner, not this catalog -k. Do not add runner `-k not vector_stores`
        (empties smoke under not pgvector).
      shiftLeftEnvSecret: envfile-ogx
      pytestExtraArgs: "--tc use_unprivileged_client:False --tc distribution_name:rh-dev -k 'not pgvector'"
      requiresShiftLeftEnv: true
      minPassRateForSuccess: 0.9
      nonBlockingOnTimeout: true
      componentTestTimeoutByGate:
        smoke: 15m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
        maxRhoai: 3.4
      merge:
        metadata:
          name: model-explainability
          konfluxRepoMapKeys:
            - trustyai-explainability
            - trustyai-service-operator
            - NeMo-Guardrails
            - fms-guardrails-orchestrator
            - guardrails-detectors
            - guardrails-regex-detector
            - lm-evaluation-harness
        image:
          args:
            - -o junit_suite_name=ai_safety
            - tests/ai_safety/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: ai_safety
      description: >
        Monolithic AI Safety and TrustyAI smoke tests. Phased out for RHOAI 3.5+ in favor of
        the granular ai_safety_* suites below.
      pytestExtraArgs: "--tc use_unprivileged_client:False -k 'not evalhub_mcp and not evalhub_conversion'"
      minPassRateForSuccess: 0.9
      componentTestTimeoutByGate:
        smoke: 10m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 3.5
      merge:
        metadata:
          name: ai-safety-evalhub
          konfluxRepoMapKeys:
            - eval-hub
        image:
          args:
            - -o junit_suite_name=ai-safety-evalhub
            - tests/ai_safety/evalhub/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: ai_safety_evalhub
      description: >
        AI Safety EvalHub smoke tests (RHOAI 3.5+).
      pytestExtraArgs: "--tc use_unprivileged_client:False -k 'not evalhub_mcp and not evalhub_conversion'"
      requiresShiftLeftEnv: true
      minPassRateForSuccess: 0.9
      componentTestTimeoutByGate:
        smoke: 10m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 3.5
      merge:
        metadata:
          name: ai-safety-guardrails
          konfluxRepoMapKeys:
            - NeMo-Guardrails
            - fms-guardrails-orchestrator
            - guardrails-detectors
            - guardrails-regex-detector
        image:
          args:
            - -o junit_suite_name=ai-safety-guardrails
            - tests/ai_safety/guardrails/
            - tests/ai_safety/nemo_guardrails/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: ai_safety_guardrails
      description: >
        AI Safety Guardrails smoke tests (RHOAI 3.5+).
      pytestExtraArgs: "--tc use_unprivileged_client:False"
      requiresShiftLeftEnv: true
      minPassRateForSuccess: 0.9
      componentTestTimeoutByGate:
        smoke: 10m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 3.5
      merge:
        metadata:
          name: ai-safety-lmeval
          konfluxRepoMapKeys:
            - lm-evaluation-harness
        image:
          args:
            - -o junit_suite_name=ai-safety-lmeval
            - tests/ai_safety/lm_eval/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: ai_safety_lmeval
      description: >
        AI Safety LM evaluation harness smoke tests (RHOAI 3.5+).
      pytestExtraArgs: "--tc use_unprivileged_client:False"
      requiresShiftLeftEnv: true
      minPassRateForSuccess: 0.9
      componentTestTimeoutByGate:
        smoke: 10m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 3.5
      merge:
        metadata:
          name: ai-safety-trustyai-operator
          konfluxRepoMapKeys:
            - trustyai-service-operator
        image:
          args:
            - -o junit_suite_name=ai-safety-trustyai-operator
            - tests/ai_safety/trustyai_operator/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: ai_safety_trustyai_operator
      description: >
        TrustyAI Service Operator smoke tests (RHOAI 3.5+).
      pytestExtraArgs: "--tc use_unprivileged_client:False"
      requiresShiftLeftEnv: true
      minPassRateForSuccess: 0.9
      componentTestTimeoutByGate:
        smoke: 10m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 3.5
      merge:
        metadata:
          name: ai-safety-trustyai-service
          konfluxRepoMapKeys:
            - trustyai-explainability
        image:
          args:
            - -o junit_suite_name=ai-safety-trustyai-service
            - tests/ai_safety/trustyai_service/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: ai_safety_trustyai_service
      description: >
        TrustyAI explainability service smoke tests (RHOAI 3.5+).
      pytestExtraArgs: "--tc use_unprivileged_client:False"
      requiresShiftLeftEnv: true
      minPassRateForSuccess: 0.9
      componentTestTimeoutByGate:
        smoke: 10m
        tier1: 45m

  - component:
      copyFromFramework: opendatahub-tests
      copyOverrides: true
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 2.25
        maxRhoai: 3.4
      merge:
        metadata:
          name: llama_stack
          konfluxRepoMapKeys:
            - llama-stack-k8s-operator
            - llama-stack-provider-ragas
            - llama-stack-provider-trustyai-garak
        image:
          args:
            - -o junit_suite_name=llama_stack
            - tests/llama_stack/
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: llama_stack
      description: >
        Llama Stack operator smoke tests. Requires opendatahub-tests 3.4+ where tests/llama_stack
        is published; newer EA tags may omit it until republished.
      opendatahubTestsImage: quay.io/opendatahub/opendatahub-tests:3.4
      requiresShiftLeftEnv: true
      minPassRateForSuccess: 0.9
      componentTestTimeoutByGate:
        smoke: 10m
        tier1: 45m
  - component:
      merge:
        metadata:
          name: dashboard-cypress
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: dashboard_cypress
      description: >
        Open Data Hub dashboard Cypress E2E smoke tests.
      artifactPrefix: dashboard-cypress-smoke
      minPassRateForSuccess: 0.9
      componentTestTimeoutByGate:
        # Cap concurrent SmokeSets (maxParallel/auto rh-ai) lengthens wall clock vs 5-way parallel.
        smoke: 45m
        tier1: 90m
      runner:
        type: cypress-dashboard
        image: quay.io/redhat-user-workloads/rh-platform-experien-tenant/cypress-e2e-image/cypress-e2e-image:9bc9e59
        sourceRepo: https://github.com/opendatahub-io/odh-dashboard.git
        sourceRef: main  # fallback when operator version unknown; orchestrate maps x.y -> rhoai-x.y
        workingDir: frontend
        resultsDir: packages/cypress/results/e2e
        vaultSecretKey: envfile-dashboard-cypress
        envDefaults:
          CYPRESS_PARALLEL_TAGS: smoke
        phaseCommands:
          smoke: cypress-parallel
          tier1: cypress-parallel
        cypress:
          skipTags: "@Bug @Maintain @Featureflagged"
          testTimeoutSeconds: "480"
          parallelStaggerSec: 15
          # Limit concurrent browsers on RHCL gateway (rh-ai.*) to cut Authorino 503s.
          maxParallel: 2
          displayBase: 99
          runConfig: numTestsKeptInMemory=0,experimentalMemoryManagement=true,video=false,viewportWidth=1920,viewportHeight=1080
          gates:
            smoke:
              - grepTag: "@SmokeSet1"
                resultsSubdir: SmokeSet1
              - grepTag: "@SmokeSet2"
                resultsSubdir: SmokeSet2
              - grepTag: "@SmokeSet3"
                resultsSubdir: SmokeSet3
              - grepTag: "@SmokeSet4"
                resultsSubdir: SmokeSet4
              - grepTag: "@SmokeSet5"
                resultsSubdir: SmokeSet5
            tier1:
              - grepTag: "@SanitySet1"
                resultsSubdir: SanitySet1
              - grepTag: "@SanitySet2"
                resultsSubdir: SanitySet2
              - grepTag: "@SanitySet3"
                resultsSubdir: SanitySet3
              - grepTag: "@SanitySet4"
                resultsSubdir: SanitySet4

  - component:
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 3.2
      merge:
        metadata:
          name: trainer
        qualityGatesMap:
          default:
            smoke: "-testTier=Smoke"
            tier1: "-testTier=Tier1"
    konflux:
      id: trainer
      description: >
        Kubeflow Training (Trainer) distributed training smoke tests.
      artifactPrefix: trainer-smoke
      runner:
        type: golang-test-tier
        image: quay.io/opendatahub/distributed-workloads-tests:latest
        workingDir: /distributed-workloads/tests
        resultsDir: /distributed-workloads/tests/results
        phaseCommands:
          smoke: "mkdir -p results && bash run-test.sh --format standard-verbose --junitfile results/xunit_report.xml --junitfile-testsuite-name short --junitfile-testcase-classname relative --junitfile-hide-skipped-tests --junitfile-project-name=trainer -- -timeout 60m ./trainer -args -testTier=Smoke"
          tier1: "mkdir -p results && bash run-test.sh --format standard-verbose --junitfile results/xunit_report.xml --junitfile-testsuite-name short --junitfile-testcase-classname relative --junitfile-hide-skipped-tests --junitfile-project-name=trainer -- -timeout 60m ./trainer -args -testTier=Tier1"
      componentTestTimeoutByGate:
        smoke: 15m
        tier1: 45m

  - component:
      enablement:
        enable: true
        odh-stable: true
        maxRhoai: 3.5
      merge:
        metadata:
          name: distributed-workloads
        qualityGatesMap:
          default:
            smoke: "-testTier=Smoke"
            tier1: "-testTier=Tier1"
    konflux:
      id: distributed_workloads
      description: >
        KFTO distributed workloads smoke tests.
      artifactPrefix: distributed-workloads-smoke
      runner:
        type: golang-test-tier
        image: quay.io/opendatahub/distributed-workloads-tests:latest
        workingDir: /distributed-workloads/tests
        resultsDir: /distributed-workloads/tests/results
        phaseCommands:
          smoke: "mkdir -p results && bash run-test.sh --format standard-verbose --junitfile results/xunit_report.xml --junitfile-testsuite-name short --junitfile-testcase-classname relative -- -timeout 60m ./kfto -args -testTier=Smoke"
          tier1: "mkdir -p results && bash run-test.sh --format standard-verbose --junitfile results/xunit_report.xml --junitfile-testsuite-name short --junitfile-testcase-classname relative --junitfile-hide-skipped-tests -- -timeout 60m ./kfto -args -testTier=Tier1"
      componentTestTimeoutByGate:
        smoke: 15m
        tier1: 45m

  - component:
      enablement:
        enable: true
        odh-stable: true
        minRhoai: 3.4
      merge:
        metadata:
          name: spark-operator
        qualityGatesMap:
          default:
            smoke: "-m smoke"
            tier1: "-m tier1"
    konflux:
      id: spark_operator
      description: >
        Spark operator integration smoke tests.
      artifactPrefix: spark-operator-smoke
      runner:
        type: golang-ginkgo
        image: quay.io/opendatahub/opendatahub-operator-e2e:main
        workingDir: /e2e
        resultsDir: /e2e/results
        envDefaults:
          E2E_TEST_DELETION_POLICY: never
          E2E_TEST_BACKUP_AND_RESTORE_DSCI_AND_DSC: "false"
          E2E_TEST_DSC_MANAGEMENT: "false"
          E2E_TEST_CLEAN_UP_PREVIOUS_RESOURCES: "false"
          E2E_TEST_OPERATOR_NAMESPACE: redhat-ods-operator
          E2E_TEST_APPLICATIONS_NAMESPACE: redhat-ods-applications
          E2E_TEST_DSC_MONITORING_NAMESPACE: redhat-ods-monitoring
          E2E_TEST_WORKBENCHES_NAMESPACE: redhat-ods-applications
          E2E_TEST_TAG: Smoke
        phaseCommands:
          smoke: "bash run_e2e_tests.sh --test-component=sparkoperator"
          tier1: "E2E_TEST_TAG=Tier1 bash run_e2e_tests.sh --test-component=sparkoperator"
      componentTestTimeoutByGate:
        smoke: 20m

---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: odh-observability-monitoring-e2e
spec:
  workspaces:
    - name: deploy-files
      emptyDir: {}
    - name: publish-files
      emptyDir: {}
  pipelineSpec:
    description: |
      Provision an ephemeral OpenShift cluster, deploy odh-observability from a
      Konflux Snapshot, and run TestMonitoring in standalone module mode.
    params:
      - name: SNAPSHOT
        description: Konflux Snapshot containing odh-observability-ci.
        type: string
      - name: OCP_VERSION_PREFIX
        description: OpenShift minor used to select the latest supported patch release.
        type: string
      - name: INSTANCE_TYPE
        description: AWS instance type for the ephemeral cluster worker.
        type: string
        default: m5.2xlarge
      - name: oci-artifacts-repo
        description: OCI repository used to publish test artifacts.
        type: string
        default: quay.io/opendatahub/odh-ci-artifacts
      - name: artifact-browser-url
        description: Base URL used to link published test artifacts.
        type: string
        default: https://app-artifact-browser.apps.rosa.konflux-qe.zmr9.p3.openshiftapps.com
    results:
      - name: TEST_OUTPUT
        description: Test result in the Konflux integration-test format.
        value: $(tasks.deploy-and-test.results.TEST_OUTPUT)
    workspaces:
      - name: deploy-files
      - name: publish-files
    tasks:
      - name: resolve-snapshot
        params:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)
        taskSpec:
          params:
            - name: SNAPSHOT
              type: string
          results:
            - name: observability-image
            - name: observability-git-url
            - name: observability-git-revision
            - name: pull-request-author
            - name: pull-request-number
            - name: git-repo
            - name: git-org
          steps:
            - name: resolve-component
              image: quay.io/konflux-ci/konflux-test:stable
              env:
                - name: SNAPSHOT
                  value: $(params.SNAPSHOT)
                - name: PR_AUTHOR
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['pac.test.appstudio.openshift.io/sender']
                - name: PR_NUMBER
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['pac.test.appstudio.openshift.io/pull-request']
                - name: GIT_REPO
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['pac.test.appstudio.openshift.io/url-repository']
                - name: GIT_ORG
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['pac.test.appstudio.openshift.io/url-org']
              script: |
                #!/usr/bin/env bash
                set -euo pipefail

                component="$(jq -cer \
                  '.components[] | select(.name == "odh-observability-ci")' \
                  <<< "${SNAPSHOT}")"
                image="$(jq -er '.containerImage | select(type == "string" and length > 0)' \
                  <<< "${component}")"
                git_url="$(jq -er '.source.git.url | select(type == "string" and length > 0)' \
                  <<< "${component}")"
                git_revision="$(jq -er '.source.git.revision | select(type == "string" and length > 0)' \
                  <<< "${component}")"

                echo "odh-observability-ci image: ${image}"
                echo "odh-observability-ci source: ${git_url}@${git_revision}"
                printf '%s' "${image}" > "$(results.observability-image.path)"
                printf '%s' "${git_url}" > "$(results.observability-git-url.path)"
                printf '%s' "${git_revision}" > "$(results.observability-git-revision.path)"
                printf '%s' "${PR_AUTHOR}" > "$(results.pull-request-author.path)"
                printf '%s' "${PR_NUMBER}" > "$(results.pull-request-number.path)"
                printf '%s' "${GIT_REPO}" > "$(results.git-repo.path)"
                printf '%s' "${GIT_ORG}" > "$(results.git-org.path)"

      - name: provision-eaas-space
        runAfter: [resolve-snapshot]
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/konflux-ci/build-definitions.git
            - name: revision
              value: main
            - name: pathInRepo
              value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
        params:
          - name: ownerName
            value: $(context.pipelineRun.name)
          - name: ownerUid
            value: $(context.pipelineRun.uid)

      - name: provision-cluster
        runAfter: [provision-eaas-space]
        params:
          - name: OCP_VERSION_PREFIX
            value: $(params.OCP_VERSION_PREFIX)
          - name: INSTANCE_TYPE
            value: $(params.INSTANCE_TYPE)
        taskSpec:
          params:
            - name: OCP_VERSION_PREFIX
              type: string
            - name: INSTANCE_TYPE
              type: string
          results:
            - name: clusterName
              value: $(steps.create-cluster.results.clusterName)
            - name: ocpVersion
              value: $(steps.pick-version.results.version)
          steps:
            - name: get-supported-versions
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/build-definitions.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/eaas-get-supported-ephemeral-cluster-versions/0.1/eaas-get-supported-ephemeral-cluster-versions.yaml
              params:
                - name: eaasSpaceSecretRef
                  value: $(tasks.provision-eaas-space.results.secretRef)
            - name: pick-version
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/build-definitions.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/eaas-get-latest-openshift-version-by-prefix/0.1/eaas-get-latest-openshift-version-by-prefix.yaml
              params:
                - name: prefix
                  value: $(params.OCP_VERSION_PREFIX)
            - name: create-cluster
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/build-definitions.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
              params:
                - name: eaasSpaceSecretRef
                  value: $(tasks.provision-eaas-space.results.secretRef)
                - name: version
                  value: $(steps.pick-version.results.version)
                - name: instanceType
                  value: $(params.INSTANCE_TYPE)

      - name: deploy-and-test
        timeout: 120m
        runAfter: [provision-cluster]
        workspaces:
          - name: shared-files
            workspace: deploy-files
        params:
          - name: observability-image
            value: $(tasks.resolve-snapshot.results.observability-image)
          - name: observability-git-url
            value: $(tasks.resolve-snapshot.results.observability-git-url)
          - name: observability-git-revision
            value: $(tasks.resolve-snapshot.results.observability-git-revision)
          - name: ocp-version
            value: $(tasks.provision-cluster.results.ocpVersion)
        taskSpec:
          params:
            - name: observability-image
              type: string
            - name: observability-git-url
              type: string
            - name: observability-git-revision
              type: string
            - name: ocp-version
              type: string
          results:
            - name: TEST_OUTPUT
              description: Result for TestMonitoring.
          workspaces:
            - name: shared-files
              mountPath: /workspace
          volumes:
            - name: credentials
              emptyDir: {}
            - name: test-status
              emptyDir: {}
          steps:
            - name: get-kubeconfig
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/build-definitions.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
              params:
                - name: eaasSpaceSecretRef
                  value: $(tasks.provision-eaas-space.results.secretRef)
                - name: clusterName
                  value: $(tasks.provision-cluster.results.clusterName)
                - name: credentials
                  value: credentials

            - name: clone-observability
              image: alpine/git
              env:
                - name: GIT_URL
                  value: $(params.observability-git-url)
                - name: GIT_REVISION
                  value: $(params.observability-git-revision)
              script: |
                #!/bin/sh
                set -eu
                git init /workspace/odh-observability
                git -C /workspace/odh-observability remote add origin "${GIT_URL}"
                git -C /workspace/odh-observability fetch --depth 1 origin "${GIT_REVISION}"
                git -C /workspace/odh-observability checkout --detach FETCH_HEAD

            - name: install-cert-manager
              image: quay.io/rhoai/rhoai-task-toolset:odh-observability
              onError: continue
              env:
                - name: KUBECONFIG
                  value: /credentials/$(steps.get-kubeconfig.results.kubeconfig)
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
                - name: test-status
                  mountPath: /test-status
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                trap 'echo 1 > /test-status/prerequisites.exit' ERR
                oc apply -f - <<'EOF'
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: cert-manager-operator
                ---
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: cert-manager-operator
                  namespace: cert-manager-operator
                spec:
                  targetNamespaces:
                    - cert-manager-operator
                ---
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: openshift-cert-manager-operator
                  namespace: cert-manager-operator
                spec:
                  channel: stable-v1
                  installPlanApproval: Automatic
                  name: openshift-cert-manager-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
                EOF

                for attempt in $(seq 1 60); do
                  csv="$(oc get csv -n cert-manager-operator \
                    -l operators.coreos.com/openshift-cert-manager-operator.cert-manager-operator \
                    -o name 2>/dev/null | head -1)"
                  [[ -n "${csv}" ]] && break
                  echo "Attempt ${attempt}/60: cert-manager CSV not created yet"
                  sleep 10
                done
                [[ -n "${csv:-}" ]]
                oc wait --for=jsonpath='{.status.phase}'=Succeeded "${csv}" \
                  -n cert-manager-operator --timeout=10m

                for deployment in cert-manager cert-manager-webhook cert-manager-cainjector; do
                  for attempt in $(seq 1 60); do
                    oc get "deployment/${deployment}" -n cert-manager >/dev/null 2>&1 && break
                    echo "Attempt ${attempt}/60: deployment/${deployment} not created yet"
                    sleep 10
                  done
                  oc wait --for=condition=Available "deployment/${deployment}" \
                    -n cert-manager --timeout=10m
                done

                # Deployment availability does not guarantee that the API server trusts
                # cert-manager's admission webhook certificate and CA bundle yet.
                webhook_ready=false
                for attempt in $(seq 1 30); do
                  if oc create --dry-run=server -o name -f - >/dev/null 2>/tmp/cert-manager-webhook-probe.err <<'EOF'
                apiVersion: cert-manager.io/v1
                kind: Issuer
                metadata:
                  generateName: cert-manager-webhook-probe-
                  namespace: cert-manager
                spec:
                  selfSigned: {}
                EOF
                  then
                    webhook_ready=true
                    break
                  fi
                  echo "Attempt ${attempt}/30: cert-manager webhook not ready: $(tr '\n' ' ' < /tmp/cert-manager-webhook-probe.err | cut -c1-200)"
                  sleep 10
                done
                if [[ "${webhook_ready}" != true ]]; then
                  echo "cert-manager admission webhook did not become trusted" >&2
                  oc get validatingwebhookconfiguration cert-manager-webhook -o yaml || true
                  oc get pods -n cert-manager -o wide || true
                  oc logs -n cert-manager deployment/cert-manager-webhook --tail=50 || true
                  exit 1
                fi
                echo 0 > /test-status/prerequisites.exit

            - name: deploy-observability
              image: quay.io/rhoai/rhoai-task-toolset:odh-observability
              imagePullPolicy: Always
              onError: continue
              env:
                - name: KUBECONFIG
                  value: /credentials/$(steps.get-kubeconfig.results.kubeconfig)
                - name: OBSERVABILITY_IMAGE
                  value: $(params.observability-image)
              workingDir: /workspace/odh-observability
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
                - name: test-status
                  mountPath: /test-status
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                trap 'echo 1 > /test-status/setup.exit' ERR

                if [[ "$(cat /test-status/prerequisites.exit 2>/dev/null || echo 1)" != "0" ]]; then
                  echo "Cluster prerequisite installation failed; operator deployment cannot continue."
                  exit 1
                fi

                # This also preserves digest references: repo@sha256:digest.
                image_repository="${OBSERVABILITY_IMAGE%:*}"
                image_tag="${OBSERVABILITY_IMAGE##*:}"
                echo "Deploying ${image_repository}:${image_tag}"
                helm upgrade --install odh-observability charts/odh-observability \
                  --namespace odh-observability-system \
                  --create-namespace \
                  --set-string operatorNamespace=odh-observability-system \
                  --set-string monitoringNamespace=redhat-ods-monitoring \
                  --set-string image.repository="${image_repository}" \
                  --set-string image.tag="${image_tag}"
                oc wait --for=condition=Available deployment/odh-observability \
                  -n odh-observability-system --timeout=10m
                echo 0 > /test-status/setup.exit

            - name: test-monitoring
              image: quay.io/rhoai/rhoai-task-toolset:odh-observability
              imagePullPolicy: Always
              onError: continue
              computeResources:
                requests:
                  cpu: "4"
                  memory: 16Gi
                limits:
                  cpu: "6"
                  memory: 24Gi
              env:
                - name: KUBECONFIG
                  value: /credentials/$(steps.get-kubeconfig.results.kubeconfig)
                - name: GOMEMLIMIT
                  value: 10GiB
                - name: GOTOOLCHAIN
                  value: auto
              workingDir: /workspace/odh-observability
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
                - name: test-status
                  mountPath: /test-status
              script: |
                #!/usr/bin/env bash
                set -uo pipefail
                if [[ "$(cat /test-status/setup.exit 2>/dev/null || echo 1)" != "0" ]]; then
                  echo "Operator deployment failed; TestMonitoring cannot run."
                  echo 1 > /test-status/monitoring.exit
                  exit 1
                fi

                mkdir -p /workspace/artifacts-dir
                set +e
                # Make consumes one $, preserving the regex end anchor for go test.
                make e2e-test E2E_TEST_FLAGS='-run ^TestMonitoring$$ -timeout 90m -api-mode module -monitoring-cr-name default-monitoring -install-operators=true -olm-timeout 15m -eventually-timeout 10m' \
                  2>&1 | tee /workspace/artifacts-dir/monitoring.log
                status=${PIPESTATUS[0]}
                set -e
                echo "${status}" > /test-status/monitoring.exit
                exit "${status}"

            - name: collect-diagnostics
              image: quay.io/rhoai/rhoai-task-toolset:odh-observability
              onError: continue
              env:
                - name: KUBECONFIG
                  value: /credentials/$(steps.get-kubeconfig.results.kubeconfig)
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
              script: |
                #!/usr/bin/env bash
                set -uo pipefail
                mkdir -p /workspace/artifacts-dir
                {
                  echo "OpenShift version: $(params.ocp-version)"
                  oc get nodes -o wide
                  oc get pods -A
                  oc get monitoring -o yaml 2>&1 || true
                  oc get monitoringstack,thanosquerier,opentelemetrycollector,tempomonolithic -A 2>&1 || true
                  oc logs -n odh-observability-system deployment/odh-observability \
                    --all-containers --tail=500 2>&1 || true
                } | tee /workspace/artifacts-dir/diagnostics.log

            - name: must-gather-on-failure
              image: quay.io/rhoai/rhoai-task-toolset:odh-observability
              onError: continue
              env:
                - name: KUBECONFIG
                  value: /credentials/$(steps.get-kubeconfig.results.kubeconfig)
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
                - name: test-status
                  mountPath: /test-status
              script: |
                #!/usr/bin/env bash
                set -uo pipefail
                if [[ "$(cat /test-status/monitoring.exit 2>/dev/null || echo 1)" == "0" ]]; then
                  echo "TestMonitoring passed; skipping must-gather."
                  exit 0
                fi

                mkdir -p /workspace/artifacts-dir/gather-openshift
                oc adm must-gather \
                  --dest-dir /workspace/artifacts-dir/gather-openshift \
                  > /workspace/artifacts-dir/must-gather.log 2>&1

            - name: stage-artifacts
              onError: continue
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/secure-git-push/0.1/secure-git-push.yaml
              params:
                - name: source-path
                  value: /workspace/artifacts-dir
                - name: repo-path
                  value: opendatahub-io/odh-build-metadata
                - name: repo-branch
                  value: ci-artifacts
                - name: sparse-file-path
                  value: test-artifacts/docs
                - name: dest-path
                  value: test-artifacts/$(context.pipelineRun.name)
                - name: pipelinerun-name
                  value: $(context.pipelineRun.name)

            - name: report-result
              image: quay.io/konflux-ci/konflux-test:stable
              env:
                - name: OCP_VERSION
                  value: $(params.ocp-version)
              volumeMounts:
                - name: test-status
                  mountPath: /test-status
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                status="$(cat /test-status/monitoring.exit 2>/dev/null || echo 1)"
                result=SUCCESS
                failures=0
                successes=1
                if [[ "${status}" != "0" ]]; then
                  result=FAILURE
                  failures=1
                  successes=0
                fi

                output="$(jq -cn \
                  --arg result "${result}" \
                  --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  --arg note "OCP ${OCP_VERSION}: TestMonitoring exit=${status}" \
                  --argjson failures "${failures}" \
                  --argjson successes "${successes}" \
                  '{result:$result,timestamp:$timestamp,failures:$failures,warnings:0,successes:$successes,note:$note}')"
                printf '%s' "${output}" > "$(results.TEST_OUTPUT.path)"
                echo "TEST_OUTPUT: ${output}"
                [[ "${result}" == "SUCCESS" ]]
    finally:
      - name: publish-artifacts-and-update-pr
        workspaces:
          - name: shared-files
            workspace: publish-files
        params:
          - name: oci-artifacts-repo
            value: $(params.oci-artifacts-repo)
          - name: artifact-browser-url
            value: $(params.artifact-browser-url)
          - name: pipeline-status
            value: $(tasks.status)
        taskSpec:
          params:
            - name: oci-artifacts-repo
              type: string
            - name: artifact-browser-url
              type: string
            - name: pipeline-status
              type: string
          workspaces:
            - name: shared-files
              mountPath: /workspace
          volumes:
            - name: odh-registry-secret-volume
              secret:
                secretName: odh-registry-secret
                items:
                  - key: .dockerconfigjson
                    path: oci-storage-dockerconfigjson
          steps:
            - name: pull-staged-artifacts
              onError: continue
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/git-clone/0.1/git-clone.yaml
              params:
                - name: repo-path
                  value: opendatahub-io/odh-build-metadata
                - name: repo-branch
                  value: ci-artifacts
                - name: sparse-file-path
                  value: test-artifacts/$(context.pipelineRun.name)
                - name: dest-path
                  value: /workspace/odh-ci-artifacts
                - name: artifacts-dir-path
                  value: test-artifacts/$(context.pipelineRun.name)

            - name: publish-oci-artifacts
              onError: continue
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
              params:
                - name: workdir-path
                  value: /workspace/odh-ci-artifacts/test-artifacts/$(context.pipelineRun.name)
                - name: oci-ref
                  value: $(params.oci-artifacts-repo):$(context.pipelineRun.name)
                - name: credentials-volume-name
                  value: odh-registry-secret-volume

            - name: update-pull-request
              onError: continue
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/pull-request-comment/0.1/pull-request-comment.yaml
              params:
                - name: test-name
                  value: $(context.pipelineRun.name)
                - name: oci-container
                  value: $(params.oci-artifacts-repo):$(context.pipelineRun.name)
                - name: pipeline-aggregate-status
                  value: $(params.pipeline-status)
                - name: pull-request-author
                  value: $(tasks.resolve-snapshot.results.pull-request-author)
                - name: pull-request-number
                  value: $(tasks.resolve-snapshot.results.pull-request-number)
                - name: git-repo
                  value: $(tasks.resolve-snapshot.results.git-repo)
                - name: git-org
                  value: $(tasks.resolve-snapshot.results.git-org)
                - name: git-revision
                  value: $(tasks.resolve-snapshot.results.observability-git-revision)
                - name: artifact-browser-url
                  value: $(params.artifact-browser-url)

            - name: cleanup-staged-artifacts
              onError: continue
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/red-hat-data-services/rhoai-konflux-tasks.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/cleanup-git-repo/0.1/cleanup-git-repo.yaml
              params:
                - name: work-dir
                  value: /workspace/odh-ci-artifacts
                - name: artifacts-dir-path
                  value: test-artifacts
                - name: dir-to-be-deleted
                  value: $(context.pipelineRun.name)
  timeouts:
    pipeline: 3h30m
    tasks: 3h
    finally: 30m

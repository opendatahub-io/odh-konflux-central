name: Generate Component Repo Map

on:
  workflow_dispatch:
  schedule:
    - cron: '3 0 * * *'
  push:
    branches: [main]
    paths:
      - 'pipelineruns/**'

permissions:
  contents: write

jobs:
  generate-map:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout OKC repository
      uses: actions/checkout@v4
      with:
        path: OKC

    - name: Clone notebooks repository
      uses: actions/checkout@v4
      with:
        repository: opendatahub-io/notebooks
        ref: main
        path: notebooks
        sparse-checkout: .tekton

    - name: Copy notebooks pipelinerun files
      run: cp notebooks/.tekton/* OKC/pipelineruns/notebooks/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install pyyaml

    - name: Generate component map
      working-directory: OKC
      run: python utils/generate_component_map.py

    - name: Commit and push changes
      working-directory: OKC
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add config/component_repo_map.json
        if git diff --cached --quiet; then
          echo "No changes to component_repo_map.json"
          exit 0
        fi
        git commit -m "chore: regenerate component_repo_map.json"
        git push
